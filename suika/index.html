<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>合成大西瓜 · Suika H5</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #eaf6ee; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
'use strict';
// ============================================================
// 合成大西瓜 H5 · 单文件 Canvas 2D · 零外部依赖
// 规则：从顶部投放水果，相同水果相碰合成更大一档（11 档链：
//       樱桃→草莓→葡萄→柠檬→橙子→苹果→梨→桃子→椰子→哈密瓜→大西瓜）；
//       合成得分 = 新档位的三角形数（草莓+3 … 大西瓜+66）；
//       两个大西瓜相碰双双消除 +100；
//       任一水果顶部越过危险线并停留 2 秒即游戏结束；
//       三档难度决定投放池最高档位（简单 3 种 / 普通 4 种 / 困难 5 种）；
//       最高分按难度分别记录，难度选择持久化；
//       对局中点左上角「菜单」按钮或按 Esc 可随时退出回菜单重选难度。
// 物理：固定步长 1/120s，重力积分 + 5 次顺序迭代（位置修正 +
//       低恢复系数冲量 + 切向摩擦），墙面/地板夹取，合成扫描在
//       每步物理后执行并支持连锁（单步内反复合成直到稳定）。
// 测试：node _test.js（无头断言物理/合成/连锁/危险线/计分/持久化）
// ============================================================

// ---- 常量 ----
const BEST_KEY = 'suikabest';
const DIFF_KEY = 'suikadiff';
const COOLDOWN = 0.45;          // 两次投放最小间隔（秒）
const DANGER_LIMIT = 2;         // 越线停留多少秒判负
const ARM_DELAY = 0.6;          // 刚投放的水果宽限（秒），不计危险
const DOUBLE_MELON_BONUS = 100; // 双西瓜消除奖励分
const MERGE_PAD = 2;            // 接触判定容差（px×S）：圆心距 ≤ 半径和+容差即合成
const REST = 0.05;              // 恢复系数（几乎不弹）
const ITER = 5;                 // 每步碰撞迭代次数
const WALL_RATIO = 0.022;       // 容器壁厚度 / BOX.w

// 难度：只影响投放池的最高档位
const DIFFS = {
  easy:   { label: '简单', maxTier: 2 },
  normal: { label: '普通', maxTier: 3 },
  hard:   { label: '困难', maxTier: 4 },
};
const DIFF_ORDER = ['easy', 'normal', 'hard'];

// 水果链：t = 半径比例（相对大西瓜），deco = 绘制细节类型
const FRUITS = [
  { id: 'cherry',      name: '樱桃',   rind: '#ef5350', rind2: '#b71c1c', juice: '#e53935', t: 0.176, deco: 'cherry' },
  { id: 'strawberry',  name: '草莓',   rind: '#f06292', rind2: '#c2185b', juice: '#ec407a', t: 0.232, deco: 'seed' },
  { id: 'grape',       name: '葡萄',   rind: '#9575cd', rind2: '#5e35b1', juice: '#7e57c2', t: 0.303, deco: 'lobes' },
  { id: 'lemon',       name: '柠檬',   rind: '#ffee58', rind2: '#f9a825', juice: '#fdd835', t: 0.366, deco: 'tips' },
  { id: 'orange',      name: '橙子',   rind: '#ffa726', rind2: '#e65100', juice: '#fb8c00', t: 0.423, deco: 'navel' },
  { id: 'apple',       name: '苹果',   rind: '#e53935', rind2: '#8e1616', juice: '#ef5350', t: 0.507, deco: 'leaf' },
  { id: 'pear',        name: '梨',     rind: '#dce775', rind2: '#9e9d24', juice: '#c0ca33', t: 0.584, deco: 'speck' },
  { id: 'peach',       name: '桃子',   rind: '#ffab91', rind2: '#e64a19', juice: '#ff8a65', t: 0.669, deco: 'cleft' },
  { id: 'coconut',     name: '椰子',   rind: '#8d6e63', rind2: '#4e342e', juice: '#6d4c41', t: 0.760, deco: 'holes' },
  { id: 'melon',       name: '哈密瓜', rind: '#c5e1a5', rind2: '#7cb342', juice: '#9ccc65', t: 0.845, deco: 'net' },
  { id: 'watermelon',  name: '大西瓜', rind: '#4caf50', rind2: '#1b5e20', juice: '#43a047', t: 1.000, deco: 'stripe' },
];
const TOP_TIER = FRUITS.length - 1;
// 投放权重：低档多、高档少（截断到难度池后归一）
const SPAWN_W = [30, 24, 20, 14, 12];
// 合成计分：新档位的三角形数（1 档草莓 +3，10 档大西瓜 +66）
function SC(tier) { return (tier + 1) * (tier + 2) / 2; }

// ---- 运行时状态 ----
let W = 0, H = 0, DPR = 1, S = 1;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const BOX = { x: 0, y: 0, w: 0, h: 0, wall: 0 };  // 容器（玻璃罐）

const G = {
  screen: 'menu',        // 'menu' | 'play' | 'over'
  score: 0,
  bestMap: { easy: 0, normal: 0, hard: 0 },
  diff: 'normal',
  fruits: [], particles: [], flashes: [], popups: [], confetti: [],
  current: 0, next: 0,
  aimX: 0, dragging: false,
  cooldown: 0,
  danger: 0,             // 已越线累计秒数
  lastWarn: -1,          // 危险提示音节流
  mergedTotal: 0,        // 本局合成次数（含连锁）
  overReason: '',
  newBest: false,
  prevBest: 0,
  mute: false,
};

// ---- 尺寸与缩放 ----
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  S = H / 800;
  BOX.w = H >= W ? Math.min(W - 28 * S, H * 0.6) : Math.min(W * 0.42, H * 0.74);
  BOX.w = Math.max(200, Math.min(BOX.w, W - 28 * S));
  BOX.x = (W - BOX.w) / 2;
  BOX.y = H * 0.115;
  BOX.h = H - 34 * S - BOX.y;
  BOX.wall = Math.max(4, BOX.w * WALL_RATIO);
  G.aimX = Math.min(Math.max(G.aimX || W / 2, innerLeft() + 20), innerRight() - 20);
}
function innerLeft() { return BOX.x + BOX.wall; }
function innerRight() { return BOX.x + BOX.w - BOX.wall; }
function floorY() { return BOX.y + BOX.h - BOX.wall; }
function deathY() { return BOX.y + Math.min(96 * S, BOX.h * 0.16); }
function gravity() { return 2600 * S; }
function fruitRadius(tier) { return Math.max(11 * S, BOX.w * 0.222 * FRUITS[tier].t); }

// ---- 音频（Web Audio 合成，无外部文件）----
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(type, f0, f1, dur, vol, delay) {
  const ac = audio(); if (!ac || G.mute) return;
  const t0 = ac.currentTime + (delay || 0);
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t0);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfxDrop() { tone('sine', 420, 170, 0.1, 0.14); }
function sfxMerge(tier) { const f = 200 * Math.pow(1.16, tier); tone('triangle', f, f * 1.5, 0.13, 0.2); }
function sfxChain() { [660, 880, 1100].forEach((hz, i) => tone('triangle', hz, hz, 0.14, 0.18, i * 0.06)); }
function sfxBonus() { [523, 659, 784, 1046].forEach((hz, i) => tone('triangle', hz, hz, 0.18, 0.2, i * 0.07)); }
function sfxWarn() { tone('square', 880, 880, 0.07, 0.06); }
function sfxOver() { tone('sawtooth', 320, 70, 0.5, 0.16); }

// ---- 工具 ----
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

function randomTier() {
  const m = DIFFS[G.diff].maxTier;
  let total = 0; const w = [];
  for (let i = 0; i <= m; i++) { w.push(SPAWN_W[i]); total += SPAWN_W[i]; }
  let r = Math.random() * total;
  for (let i = 0; i <= m; i++) { r -= w[i]; if (r < 0) return i; }
  return m;
}

function mkFruit(tier, x, y, vx, vy) {
  return { tier, x, y, vx: vx || 0, vy: vy || 0, r: fruitRadius(tier), rot: rand(0, 6.28), age: 0 };
}

// ---- 投放 ----
function dropFruit() {
  if (G.screen !== 'play' || G.cooldown > 0) return false;
  const r = fruitRadius(G.current);
  const x = clamp(G.aimX, innerLeft() + r, innerRight() - r);
  G.fruits.push(mkFruit(G.current, x, deathY(), 0, 80 * S));
  G.cooldown = COOLDOWN;
  G.current = G.next; G.next = randomTier();
  sfxDrop();
  return true;
}

// ---- 合成 ----
function mergePair(a, b) {
  for (const e of [a, b]) { const i = G.fruits.indexOf(e); if (i >= 0) G.fruits.splice(i, 1); }
  const t = a.tier, x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
  if (t >= TOP_TIER) {                              // 双瓜同归
    G.score += DOUBLE_MELON_BONUS;
    G.popups.push({ x, y: y - 20 * S, text: '双瓜消除 +' + DOUBLE_MELON_BONUS, color: '#c62828', size: 30, life: 1.4, t: 0 });
    burst(x, y, FRUITS[t].juice, 26, 460);
    confettiBurst(x, y);
    G.flashes.push({ x, y, r: fruitRadius(t) * 2.2, t: 0, life: 0.35, color: 'rgba(255,235,59,' });
    sfxBonus();
  } else {
    const nt = t + 1;
    const f = mkFruit(nt, x, y, (a.vx + b.vx) * 0.2, (a.vy + b.vy) * 0.2);
    f.x = clamp(f.x, innerLeft() + f.r, innerRight() - f.r);
    f.y = Math.min(f.y, floorY() - f.r);
    G.fruits.push(f);
    G.score += SC(nt);
    G.popups.push({ x, y: y - f.r - 8 * S, text: '+' + SC(nt), color: FRUITS[nt].rind2, size: 18 + nt, life: 0.8, t: 0 });
    burst(x, y, FRUITS[nt].juice, 8 + nt, 220 + nt * 18);
    G.flashes.push({ x, y, r: f.r * 1.7, t: 0, life: 0.28, color: 'rgba(255,255,255,' });
    sfxMerge(nt);
  }
  G.mergedTotal++;
}
// 反复扫描直到无可合成对（连锁）；返回本次合成次数
function tryMergeAll() {
  let count = 0, lastX = 0, lastY = 0;
  for (let pass = 0; pass < 96; pass++) {   // 上限防死循环；密集堆叠级联也够用
    const fs = G.fruits;
    let pair = null;
    for (let i = 0; i < fs.length && !pair; i++) {
      for (let j = i + 1; j < fs.length; j++) {
        const a = fs[i], b = fs[j];
        if (a.tier !== b.tier) continue;
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (d <= a.r + b.r + MERGE_PAD * S) { pair = [a, b]; break; }
      }
    }
    if (!pair) break;
    lastX = (pair[0].x + pair[1].x) / 2; lastY = (pair[0].y + pair[1].y) / 2;
    mergePair(pair[0], pair[1]);
    count++;
  }
  if (count >= 2) {
    G.popups.push({ x: lastX, y: lastY - 46 * S, text: '连锁 x' + count, color: '#ef6c00', size: 26, life: 1.1, t: 0 });
    sfxChain();
  }
  return count;
}

// ---- 粒子 / 特效 ----
function burst(x, y, color, n, sp) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(0.35, 1) * sp * S;
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60 * S, r: rand(2, 5) * S, color, life: rand(0.35, 0.7), t: 0 });
  }
}
function confettiBurst(x, y) {
  for (let i = 0; i < 36; i++) {
    const a = rand(0, Math.PI * 2), v = rand(0.3, 1) * 520 * S;
    G.confetti.push({
      x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 160 * S,
      w: rand(5, 10) * S, h: rand(3, 6) * S, rot: rand(0, 6.28), vrot: rand(-8, 8),
      color: ['#ef5350', '#ffca28', '#43a047', '#42a5f5', '#ab47bc'][i % 5], life: rand(0.8, 1.5), t: 0,
    });
  }
}

// ---- 物理 ----
function step(dt) {
  const g = gravity(), fs = G.fruits;
  const L = innerLeft(), R = innerRight(), F = floorY();
  for (const e of fs) {
    e.age += dt;
    e.vy += g * dt;
    e.vx *= Math.pow(0.6, dt);
    e.x += e.vx * dt; e.y += e.vy * dt;
    e.rot += e.vx * dt / e.r * 1.2;
  }
  for (let it = 0; it < ITER; it++) {
    for (const e of fs) {
      if (e.x - e.r < L) { e.x = L + e.r; if (e.vx < 0) e.vx = -e.vx * REST; }
      if (e.x + e.r > R) { e.x = R - e.r; if (e.vx > 0) e.vx = -e.vx * REST; }
      if (e.y + e.r > F) {
        e.y = F - e.r;
        if (e.vy > 0) e.vy = -e.vy * REST;
        e.vx *= 0.9;
      }
    }
    for (let i = 0; i < fs.length; i++) {
      for (let j = i + 1; j < fs.length; j++) {
        const a = fs[i], b = fs[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        const min = a.r + b.r;
        if (d >= min) continue;
        if (d < 0.0001) { dx = rand(-1, 1); dy = -1; d = Math.hypot(dx, dy); }
        const nx = dx / d, ny = dy / d, pen = min - d;
        const ma = a.r * a.r, mb = b.r * b.r, mt = ma + mb;
        const ca = mb / mt * 0.85, cb = ma / mt * 0.85;
        a.x -= nx * pen * ca; a.y -= ny * pen * ca;
        b.x += nx * pen * cb; b.y += ny * pen * cb;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const imp = -(1 + REST) * vn / (1 / ma + 1 / mb);
          a.vx -= imp * nx / ma; a.vy -= imp * ny / ma;
          b.vx += imp * nx / mb; b.vy += imp * ny / mb;
          const tx = -ny, ty = nx;
          const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
          a.vx += vt * 0.06 * tx; a.vy += vt * 0.06 * ty;
          b.vx -= vt * 0.06 * tx; b.vy -= vt * 0.06 * ty;
        }
      }
    }
  }
}

// ---- 局流程 ----
function resetGame() {
  G.score = 0; G.fruits.length = 0; G.particles.length = 0;
  G.flashes.length = 0; G.popups.length = 0; G.confetti.length = 0;
  G.cooldown = 0.5; G.danger = 0; G.lastWarn = -1; G.mergedTotal = 0;
  G.overReason = ''; G.newBest = false; G.dragging = false;
  G.current = randomTier(); G.next = randomTier();
  G.aimX = W / 2;
}
function startGame() { resetGame(); G.screen = 'play'; }
function bestNow() { return G.bestMap[G.diff] || 0; }
// 对局中主动退出回菜单：结算最高分并清空局面（可重选难度再开局）
function quitToMenu() {
  if (G.screen !== 'play') return;
  if (G.score > bestNow()) { G.bestMap[G.diff] = G.score; saveBest(); }
  G.screen = 'menu'; G.dragging = false;
  G.fruits.length = 0; G.particles.length = 0; G.confetti.length = 0;
  G.flashes.length = 0; G.popups.length = 0; G.danger = 0;
}
function endGame(reason) {
  if (G.screen !== 'play') return;
  G.overReason = reason; G.screen = 'over';
  sfxOver();
  if (G.score > bestNow()) { G.prevBest = bestNow(); G.bestMap[G.diff] = G.score; G.newBest = true; saveBest(); }
}
function loadBest() {
  try {
    const raw = localStorage.getItem(BEST_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (typeof o === 'number' && o > 0) G.bestMap.normal = o | 0;   // 兼容旧版单一纪录
    else if (o && typeof o === 'object')
      for (const k of DIFF_ORDER) if (o[k] > 0) G.bestMap[k] = o[k] | 0;
  } catch (e) {}
}
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(G.bestMap)); } catch (e) {} }
function loadDiff() {
  try { const d = localStorage.getItem(DIFF_KEY); if (d && DIFFS[d]) G.diff = d; } catch (e) {}
}
function setDiff(d) {
  if (!DIFFS[d]) return;
  G.diff = d;
  try { localStorage.setItem(DIFF_KEY, d); } catch (e) {}
}

// ---- 更新 ----
function update(dt) {
  if (G.screen === 'play') {
    G.cooldown = Math.max(0, G.cooldown - dt);
    step(dt);
    // 夹取放在合成扫描之前：避免夹取动作制造"同档刚接触"的瞬态漏合成
    for (const e of G.fruits) {
      if (e.x - e.r < innerLeft()) e.x = innerLeft() + e.r;
      if (e.x + e.r > innerRight()) e.x = innerRight() - e.r;
      if (e.y + e.r > floorY()) e.y = floorY() - e.r;
    }
    tryMergeAll();
    let over = false;
    for (const e of G.fruits) {
      if (e.age > ARM_DELAY && e.y - e.r < deathY()) { over = true; break; }
    }
    if (over) {
      G.danger += dt;
      const w = Math.floor(G.danger);
      if (w > G.lastWarn && G.danger < DANGER_LIMIT) { G.lastWarn = w; sfxWarn(); }
      if (G.danger >= DANGER_LIMIT) endGame('overflow');
    } else {
      G.danger = Math.max(0, G.danger - dt * 2);
      if (G.danger === 0) G.lastWarn = -1;
    }
  } else {
    step(dt);   // 结算界面保留堆叠动画
  }
  const g = gravity();
  for (const p of G.particles) { p.t += dt; p.vy += g * 0.8 * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = G.particles.length - 1; i >= 0; i--) if (G.particles[i].t >= G.particles[i].life) G.particles.splice(i, 1);
  for (const c of G.confetti) { c.t += dt; c.vy += g * 0.5 * dt; c.vx *= Math.pow(0.4, dt); c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.vrot * dt; }
  for (let i = G.confetti.length - 1; i >= 0; i--) if (G.confetti[i].t >= G.confetti[i].life) G.confetti.splice(i, 1);
  for (const f of G.flashes) f.t += dt;
  for (let i = G.flashes.length - 1; i >= 0; i--) if (G.flashes[i].t >= G.flashes[i].life) G.flashes.splice(i, 1);
  for (const p of G.popups) { p.t += dt; p.y -= 40 * S * dt; }
  for (let i = G.popups.length - 1; i >= 0; i--) if (G.popups[i].t >= G.popups[i].life) G.popups.splice(i, 1);
}

// ---- 绘制：水果 ----
function drawFruit(tier, x, y, r, rot, alpha) {
  const def = FRUITS[tier];
  ctx.save();
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.rotate(rot || 0);
  const rg = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.15, 0, 0, r * 1.05);
  rg.addColorStop(0, def.rind); rg.addColorStop(1, def.rind2);
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.14)'; ctx.lineWidth = Math.max(1, r * 0.05);
  ctx.beginPath(); ctx.arc(0, 0, r * 0.97, 0, Math.PI * 2); ctx.stroke();
  const hi = 'rgba(255,255,255,0.5)';
  switch (def.deco) {
    case 'cherry':
      ctx.fillStyle = hi;
      ctx.beginPath(); ctx.ellipse(-r * 0.35, -r * 0.45, r * 0.22, r * 0.13, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#5d4037'; ctx.lineWidth = r * 0.1;

function drawDropper() {

function drawFx() {
  for (const f of G.flashes) {

  ctx.globalAlpha = 1;

    ctx.save();

const BTN = {};
function drawButton(id, label, cx, cy, w, h, main) {

// ---- 输入 ----
function localXY(ev) {
  const rect = canvas.getBoundingClientRect();
  const p = ev.touches && ev.touches.length ? ev.touches[0] : (ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : ev);
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}
function onDown(ev) {
  ev.preventDefault(); audio();
  const { x, y } = localXY(ev);
  const btn = hitBtn(x, y);
  if (G.screen === 'menu') {
    if (btn === 'start') { startGame(); return; }
    if (btn && btn.indexOf('diff_') === 0) { setDiff(btn.slice(5)); return; }
    return;
  }
  if (G.screen === 'over') {
    if (btn === 'again') { startGame(); return; }
    if (btn === 'menu') { G.screen = 'menu'; return; }
    return;
  }
  if (btn === 'quit') { quitToMenu(); return; }
  if (btn) return;                       // 其余按钮优先，不触发瞄准
  G.dragging = true;
  G.aimX = x;
}
function onMove(ev) {
  if (G.screen !== 'play') return;
  ev.preventDefault();
  const { x } = localXY(ev);
  if (G.dragging || ev.pointerType !== 'touch') G.aimX = x;
}
function onUp(ev) {
  if (G.screen === 'play' && G.dragging) dropFruit();
  G.dragging = false;
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') { G.mute = !G.mute; return; }
  if (G.screen === 'play') {
    if (e.key === 'Escape') { quitToMenu(); return; }
    if (e.key === 'ArrowLeft') G.aimX -= 16 * S;
    if (e.key === 'ArrowRight') G.aimX += 16 * S;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); dropFruit(); }
    return;
  }
  if (e.key === 'Enter' || e.key === ' ') {
    if (G.screen === 'menu' || G.screen === 'over') startGame();
  }
});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastFrame = null; });

// ---- 主循环（固定步长 1/120s + dt 钳制）----
let lastFrame = null, acc = 0;
const STEP = 1 / 120;
function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrame === null) { lastFrame = ts; return; }
  let dt = (ts - lastFrame) / 1000; lastFrame = ts;
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  drawScene();
}

function init() {
  resize(); loadBest(); loadDiff();
  G.aimX = W / 2;
}

init();
requestAnimationFrame(frame);
</script>
