const DIFFS = {
  easy:   { label:'简单', hpMul:0.80, startCoins:400, radishHp:25, coinMul:1.2 },
  normal: { label:'普通', hpMul:1.00, startCoins:300, radishHp:20, coinMul:1.0 },

};
const DIFF_ORDER = ['easy','normal','hard'];
const BEST_KEY = 'radishdef_best';
const DIFF_KEY = 'radishdef_diff';
const UNLOCK_KEY = 'radishdef_unlock';
const LEVEL_KEY = 'radishdef_level';

// ---- 运行时状态 ----
let W = 0, H = 0, DPR = 1, U = 1;          // U = UI 缩放（以 640x960 设计稿为基准之一）
let CS = 40, GX = 0, GY = 0;               // 格边长与地图原点
let PORTRAIT = true;                       // 竖版：面板在下；横版：面板在右
let HUD_H = 52, PANEL_H = 92, PANEL_W = 120;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let PATH_CELLS = null;                     // 'c,r' -> true 路径格集合
let PATH_LEN = 0;                          // 路径总长（格）

const G = {
  screen: 'menu',          // 'menu' | 'play' | 'win' | 'over'
  diff: 'normal',
  level: 0,                // 当前关卡（0-based）
  unlock: 1,               // 已解锁关卡数（1~LEVELS.length）
  bestMap: { easy:[0,0,0], normal:[0,0,0], hard:[0,0,0] },   // 难度 × 关卡最高分

// ---- 路径几何 ----
function selectLevel(i) {
  i = Math.max(0, Math.min(LEVELS.length - 1, i | 0));
  G.level = i;
  const L = LEVELS[i];
  PATH_WPS = L.wps; RADISH_CELL = L.radish; OBS_CELLS = L.obs;
  buildPath();
  try { localStorage.setItem(LEVEL_KEY, String(i)); } catch (e) {}
}
function curLevel() { return LEVELS[G.level]; }
function curWaves() { return LEVELS[G.level].waves; }
function buildPath() {
  PATH_CELLS = {};
  PATH_LEN = 0;
  for (let i = 0; i < PATH_WPS.length - 1; i++) {
    const [ax, ay] = PATH_WPS[i], [bx, by] = PATH_WPS[i + 1];
    const sx = Math.sign(bx - ax), sy = Math.sign(by - ay);
    let x = ax, y = ay, n = 0;
    while (x !== bx || y !== by) { x += sx; y += sy; n++; }
    PATH_LEN += n;
    x = ax; y = ay;
    while (true) {
      if (x >= 0 && x < COLS && y >= 0 && y < ROWS) PATH_CELLS[x + ',' + y] = true;
      if (x === bx && y === by) break;
      x += sx; y += sy;
    }
  }
}
function isPath(c, r) { return !!PATH_CELLS[c + ',' + r]; }
// 路径进度 f(0~1) -> 像素坐标（基于当前布局的拐点像素表）
function wpPx() {
  return PATH_WPS.map(([c, r]) => [GX + (c + 0.5) * CS, GY + (r + 0.5) * CS]);
}
function posAt(f) {
  const wps = wpPx();
  const segs = [];
  let total = 0;
  for (let i = 0; i < wps.length - 1; i++) {
    const len = Math.hypot(wps[i + 1][0] - wps[i][0], wps[i + 1][1] - wps[i][1]);
    segs.push(len); total += len;
  }
  let d = Math.max(0, Math.min(1, f)) * total, acc = 0;
  for (let i = 0; i < segs.length; i++) {
    if (acc + segs[i] >= d) {
      const t = segs[i] > 0 ? (d - acc) / segs[i] : 0;
      return {
        x: wps[i][0] + (wps[i + 1][0] - wps[i][0]) * t,
        y: wps[i][1] + (wps[i + 1][1] - wps[i][1]) * t,
      };
    }
    acc += segs[i];
  }
  return { x: wps[wps.length - 1][0], y: wps[wps.length - 1][1] };
}

// ---- 布局 ----
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(W / 640, H / 960);
  PORTRAIT = W < H * 0.9;
  HUD_H = 52 * U;
  PANEL_H = 92 * U; PANEL_W = 120 * U;
  if (PORTRAIT) {
    CS = Math.min((W - 12 * U) / COLS, (H - HUD_H - PANEL_H - 26 * U) / ROWS);
    GX = (W - CS * COLS) / 2;
    GY = HUD_H + 8 * U + Math.max(0, (H - HUD_H - PANEL_H - 26 * U - ROWS * CS) / 2); // 竖屏：地图在 HUD 与面板间垂直居中
  } else {
    CS = Math.min((W - PANEL_W - 26 * U) / COLS, (H - HUD_H - 20 * U) / ROWS);
    GX = 10 * U; GY = HUD_H + (H - HUD_H - ROWS * CS) / 2;   // 横屏：地图垂直居中
  }
}
function cellAtXY(x, y) {
  const c = Math.floor((x - GX) / CS), r = Math.floor((y - GY) / CS);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return null;
  return { c, r };
}
function cellCX(c) { return GX + (c + 0.5) * CS; }
function cellCY(r) { return GY + (r + 0.5) * CS; }
function towerAt(c, r) { return G.towers.find(t => t.c === c && t.r === r) || null; }
function obsAt(c, r) { return G.cells[c + ',' + r] ? G.cells[c + ',' + r].obs : null; }
function isRadishCell(c, r) { return c === RADISH_CELL[0] && r === RADISH_CELL[1]; }
function buildable(c, r) {
  return !isPath(c, r) && !isRadishCell(c, r) && !obsAt(c, r) && !towerAt(c, r);
}

// ---- 音频（Web Audio 合成，无外部文件）----
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(hz0, hz1, dur, vol, type) {
  const ac = audio(); if (!ac || G.mute) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(hz0, ac.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(30, hz1), ac.currentTime + dur);
  g.gain.setValueAtTime(vol, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + dur + 0.02);
}
function noise(dur, vol, filterHz, q) {
  const ac = audio(); if (!ac || G.mute) return;
  const n = Math.floor(ac.sampleRate * dur), buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
  const src = ac.createBufferSource(); src.buffer = buf;
  const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filterHz; if (q) f.Q.value = q;
  const g = ac.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(ac.destination); src.start();
}

// ---- 工具 ----
function rand(a, b) { return a + Math.random() * (b - a); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
const BTN = {};
function hitBtn(px, py) {
  for (const id of Object.keys(BTN)) {
    const b = BTN[id];
    if (b && px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) return id;
  }
  return null;
}
function drawButton(id, label, cx, cy, w, h, main, disabled) {
  const x = cx - w / 2, y = cy - h / 2;
  BTN[id] = { x, y, w, h };
  ctx.save();
  ctx.globalAlpha = disabled ? 0.45 : 1;
  ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowOffsetY = 3 * U;
  ctx.fillStyle = main ? '#f08c00' : 'rgba(255,255,255,0.14)';
  roundRect(x, y, w, h, h / 2); ctx.fill();
  ctx.shadowColor = 'transparent';
  if (!main) { ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1.5 * U; roundRect(x, y, w, h, h / 2); ctx.stroke(); }
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + Math.round(h * 0.4) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, cx, cy + 1);
  ctx.restore();
}
function popup(x, y, text, color, size) {
  G.popups.push({ x, y, text, color: color || '#fff', size: size || 16, life: 0.9, t: 0 });
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), v = rand(0.3, 1) * (spd || 200) * U;
    G.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * U, r: rand(1.5, 3.5) * U, color, life: rand(0.3, 0.6), t: 0 });
  }
}

// ---- 局流程 ----
function resetGame() {
  G.score = 0; G.kills = 0;
  G.coins = DIFFS[G.diff].startCoins;
  G.radishHp = DIFFS[G.diff].radishHp;
  G.nextWave = 0; G.waveActive = false; G.interT = FIRST_INTER; G.waveClock = 0;
  G.spawnQueue = [];
  G.enemies.length = 0; G.towers.length = 0; G.projectiles.length = 0;
  G.particles.length = 0; G.popups.length = 0;
  G.cells = {};
  OBS_CELLS.forEach(([c, r], i) => {
    const def = OBST[i % OBST.length];
    G.cells[c + ',' + r] = { obs: { def, hp: def.hp, maxHp: def.hp, c, r, wob: rand(0, 6.28) } };
  });
  G.selType = null; G.sel = null; G.hoverCell = null;

  G.newBest = false; G.overReason = ''; G.time = 0;
}
function startGame() { resetGame(); G.screen = 'play'; }
function bestNow() { return (G.bestMap[G.diff] || [])[G.level] || 0; }
function endGame(reason) {
  if (G.screen !== 'play') return;
  G.overReason = reason;
  G.sel = null; G.selType = null; G.hoverCell = null;
  if (reason === 'win') {
    G.score += G.radishHp * 20;                            // 剩余萝卜生命折算奖励分
    if (G.level + 1 < LEVELS.length && G.unlock < G.level + 2) { G.unlock = G.level + 2; saveUnlock(); }
  }
  G.screen = reason === 'win' ? 'win' : 'over';
  if (G.score > bestNow()) {

  }

}
function loadBest() {
  try {

    const o = JSON.parse(raw);
    if (o && typeof o === 'object') for (const k of DIFF_ORDER) {
      const v = o[k];
      if (typeof v === 'number' && v > 0) G.bestMap[k] = [v | 0, 0, 0];        // 旧版单关纪录迁移
      else if (Array.isArray(v)) G.bestMap[k] = LEVELS.map((_, i) => Math.max(0, v[i] | 0));
    }
  } catch (e) {}
}
function saveUnlock() { try { localStorage.setItem(UNLOCK_KEY, String(G.unlock)); } catch (e) {} }
function loadUnlock() {

    const u = localStorage.getItem(UNLOCK_KEY);

}
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(G.bestMap)); } catch (e) {} }

// ---- 建塔 / 升级 / 出售 ----
function towerLevelStat(t) { return t.def.levels[t.lv - 1]; }
function tryBuild(c, r, typeId) {

  if (!buildable(c, r) || G.coins < def.cost) return false;
  G.coins -= def.cost;
  const t = { def, lv: 1, c, r, x: cellCX(c), y: cellCY(r), cd: 0.3, aim: -Math.PI / 2, invested: def.cost };
  G.towers.push(t);

  popup(t.x, t.y - CS * 0.5, '-' + def.cost, '#ffca28');
  return true;
}
function upgradeCost(t) { return t.lv >= 3 ? 0 : t.def.levels[t.lv].up; }
function upgradeTower(t) {

  G.coins -= cost; t.lv++; t.invested += cost;
  sfxUpgrade(); burst(t.x, t.y, '#ffd54f', 14);
  popup(t.x, t.y - CS * 0.5, 'Lv' + t.lv + '!', '#ffd54f', 18);
  return true;
}
function sellValue(t) { return Math.floor(t.invested * SELL_RATE); }
function sellTower(t) {

// ---- 波次与出怪 ----
function startWave() {
  const w = curWaves()[G.nextWave];
  if (!w) return;
  G.waveActive = true; G.waveClock = 0; G.interT = 0;
  G.spawnQueue = [];
  let cursor = 0;
  for (const [type, count] of w.list) {
    for (let i = 0; i < count; i++) { G.spawnQueue.push({ at: cursor, type }); cursor += w.gap; }
  }
  sfxWave();
  popup(GX + CS * COLS / 2, GY + CS * ROWS / 2, '第 ' + (G.nextWave + 1) + ' 波来袭！', '#fff176', 26);
}
function spawnEnemy(type) {
  const def = ENEMIES[type];
  const hpMul = (1 + WAVE_HP_GROW * G.nextWave) * DIFFS[G.diff].hpMul * curLevel().hpMul;
  const hp = Math.round(def.hp * hpMul);
  const e = {
    def, type, hp, maxHp: hp, f: 0, x: 0, y: 0,
    slowT: 0, slowF: 1, wob: rand(0, 6.28), nibbled: false,
  };
  const p0 = posAt(0); e.x = p0.x; e.y = p0.y;
  G.enemies.push(e);
}
function callWaveEarly() {
  if (G.waveActive || G.nextWave >= curWaves().length || G.interT <= 0) return 0;
  const bonus = Math.floor(G.interT);
  G.coins += bonus;
  popup(GX + CS * COLS / 2, GY + 20 * U, '提前召唤 +' + bonus, '#ffd54f', 20);
  G.interT = 0;
  startWave();
  return bonus;
}
function waveClearBonus() {
  const idx = G.nextWave;
  const coins = 20 + (idx + 1) * 5;
  G.coins += coins; G.score += (idx + 1) * 20;
  popup(GX + CS * COLS / 2, GY + CS * ROWS / 2, '波次奖励 +' + coins + ' 金币', '#aed581', 20);
}

// ---- 战斗 ----
function enemySpeed(e) { return e.def.spd * (e.slowT > 0 ? e.slowF : 1); }
function damageEnemy(e, dmg) {
  e.hp -= dmg;
  if (e.hp <= 0) killEnemy(e);
}
function killEnemy(e) {
  const i = G.enemies.indexOf(e); if (i < 0) return;
  G.enemies.splice(i, 1);
  const gain = Math.round(e.def.coins * DIFFS[G.diff].coinMul);
  G.coins += gain; G.score += e.def.pts; G.kills++;
  burst(e.x, e.y, '#bcaaa4', e.type === 'boar' ? 26 : 10);
  popup(e.x, e.y - 10 * U, '+' + gain, '#ffd54f', e.type === 'boar' ? 22 : 15);
  sfxDeath();
}
function damageObs(o, dmg) {
  o.hp -= dmg;
  if (o.hp <= 0) {
    const x = cellCX(o.c), y = cellCY(o.r);
    const gain = Math.round(o.def.coins * DIFFS[G.diff].coinMul);
    G.coins += gain; G.score += o.def.pts;
    delete G.cells[o.c + ',' + o.r];
    burst(x, y, o.def.id === 'cloud' ? '#eceff1' : '#a1887f', 18);
    popup(x, y, '清除! +' + gain, '#ffd54f', 18);
    sfxObsBreak(); sfxCoin();
  }
}
function fireTower(t, target, isObs) {
  const st = towerLevelStat(t);
  const dx = target.x !== undefined ? target.x : cellCX(target.c);
  const dy = target.y !== undefined ? target.y : cellCY(target.r);
  t.aim = Math.atan2(dy - t.y, dx - t.x);
  G.projectiles.push({
    kind: t.def.id, x: t.x, y: t.y - CS * 0.18, e: isObs ? null : target, o: isObs ? target : null,
    tx: dx, ty: dy, dmg: st.dmg, aoe: st.aoe || 0, slowF: st.slowF || 0, slowT: st.slowT || 0,
  });
  if (t.def.id === 'pea') sfxShootPea();
  else if (t.def.id === 'ice') sfxShootIce();
  else sfxShootMelon();
}
function applyProjectile(p) {
  const blastR = p.aoe * CS;
  if (p.kind === 'melon') { sfxBoom(); burst(p.tx, p.ty, '#66bb6a', 20, 300); }
  else if (p.kind === 'ice') burst(p.tx, p.ty, '#b3e5fc', 12, 220);
  if (p.aoe > 0) {
    for (const e of G.enemies.slice()) {
      if (Math.hypot(e.x - p.tx, e.y - p.ty) <= blastR + e.def.r * CS) {
        damageEnemy(e, p.dmg);
        if (p.kind === 'ice' && e.hp > 0 && G.enemies.includes(e)) { e.slowT = Math.max(e.slowT, p.slowT); e.slowF = p.slowF; }
      }
    }
  } else if (p.e && G.enemies.includes(p.e)) {
    damageEnemy(p.e, p.dmg); sfxHit();
  }
  if (p.o && G.cells[p.o.c + ',' + p.o.r] && G.cells[p.o.c + ',' + p.o.r].obs === p.o) damageObs(p.o, p.dmg);
}
function updateCombat(dt) {
  // 出怪
  if (G.waveActive) {
    G.waveClock += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].at <= G.waveClock) spawnEnemy(G.spawnQueue.shift().type);
  }
  // 敌人移动
  for (const e of G.enemies.slice()) {
    if (e.slowT > 0) e.slowT -= dt;
    e.f += enemySpeed(e) * dt / PATH_LEN;
    if (e.f >= 1) {                                  // 抵达萝卜：啃一口
      G.enemies.splice(G.enemies.indexOf(e), 1);
      G.radishHp -= e.def.dmg; G.nibbleFlash = 0.5;
      const rp = posAt(1);
      popup(rp.x, rp.y - CS * 0.6, '-' + e.def.dmg + ' 萝卜!', '#ef5350', 20);
      sfxNibble();
      if (G.radishHp <= 0) { G.radishHp = 0; endGame('eaten'); return; }
      continue;
    }
    const p = posAt(e.f); e.x = p.x; e.y = p.y;
  }
  // 塔索敌开火：有怪打最近的怪（最靠前的），无怪打障碍物（经典的清障机制）
  for (const t of G.towers) {
    t.cd -= dt;
    if (t.cd > 0) continue;
    const st = towerLevelStat(t);
    const rangePx = st.range * CS;
    let best = null;
    for (const e of G.enemies) {
      if (Math.hypot(e.x - t.x, e.y - t.y) <= rangePx && (!best || e.f > best.f)) best = e;
    }
    if (best) { fireTower(t, best, false); t.cd = st.rate; continue; }
    let bestO = null, bestD = 1e9;
    for (const k in G.cells) {
      const o = G.cells[k].obs;
      const d = Math.hypot(cellCX(o.c) - t.x, cellCY(o.r) - t.y);
      if (d <= rangePx && d < bestD) { bestD = d; bestO = o; }
    }
    if (bestO) { fireTower(t, bestO, true); t.cd = st.rate; }
    else t.cd = 0.1;
  }
  // 子弹飞行（追踪目标）
  const spd = PROJ_SPD * CS * dt;
  for (const p of G.projectiles.slice()) {
    if (p.e) {
      if (!G.enemies.includes(p.e)) { G.projectiles.splice(G.projectiles.indexOf(p), 1); continue; }
      p.tx = p.e.x; p.ty = p.e.y;
    } else if (p.o) {
      const cell = G.cells[p.o.c + ',' + p.o.r];
      if (!cell || cell.obs !== p.o) { G.projectiles.splice(G.projectiles.indexOf(p), 1); continue; }
      p.tx = cellCX(p.o.c); p.ty = cellCY(p.o.r);
    }
    const dx = p.tx - p.x, dy = p.ty - p.y, d = Math.hypot(dx, dy);
    if (d <= spd + 2 * U) { G.projectiles.splice(G.projectiles.indexOf(p), 1); applyProjectile(p); continue; }
    p.x += dx / d * spd; p.y += dy / d * spd;
  }
  // 波次推进
  if (G.waveActive && !G.spawnQueue.length && !G.enemies.length) {
    G.waveActive = false;
    waveClearBonus();
    G.nextWave++;
    if (G.nextWave >= curWaves().length) { endGame('win'); return; }
    G.interT = INTER_TIME;
  }
  if (!G.waveActive && G.nextWave < curWaves().length && G.interT > 0) {
    G.interT -= dt;
    if (G.interT <= 0) { G.interT = 0; startWave(); }
  }
}

// ---- 更新 ----
function update(dt) {
  G.time += dt;
  if (G.screen === 'play' && !G.paused) updateCombat(dt);
  for (const p of G.particles) { p.t += dt; p.vy += 320 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt; }
  for (let i = G.particles.length - 1; i >= 0; i--) if (G.particles[i].t >= G.particles[i].life) G.particles.splice(i, 1);
  for (const p of G.popups) { p.t += dt; p.y -= 34 * U * dt; }
  for (let i = G.popups.length - 1; i >= 0; i--) if (G.popups[i].t >= G.popups[i].life) G.popups.splice(i, 1);
  G.nibbleFlash = Math.max(0, G.nibbleFlash - dt);
}

// ============ 绘制 ============
function drawField() {

  }

  ctx.restore();
  drawButton('sp_resume', '继 续 游 戏', W / 2, H * 0.52, Math.min(240 * U, W * 0.55), 52 * U, true);
  drawButton('sp_tomenu', '回主菜单', W / 2, H * 0.52 + 70 * U, Math.min(240 * U, W * 0.55), 40 * U, false);
}
function drawMenu() {
  // 背景草地 + 一只大萝卜 + 小怪巡游
  drawField();
  ctx.save();
  ctx.translate(W / 2, H * 0.26);
  const scale = Math.min(W, H) * 0.0016;
  ctx.scale(scale, scale);
  const bodyH = 130, bodyW = 95;
  const gr = ctx.createLinearGradient(0, -30, 0, bodyH);
  gr.addColorStop(0, '#ffcdd2'); gr.addColorStop(0.35, '#fff0f1'); gr.addColorStop(1, '#ffe0e3');
  ctx.fillStyle = gr;
  ctx.beginPath();
  ctx.moveTo(-bodyW * 0.5, -bodyH * 0.1);
  ctx.quadraticCurveTo(-bodyW * 0.62, bodyH * 0.4, 0, bodyH);
  ctx.quadraticCurveTo(bodyW * 0.62, bodyH * 0.4, bodyW * 0.5, -bodyH * 0.1);
  ctx.quadraticCurveTo(0, -bodyH * 0.28, -bodyW * 0.5, -bodyH * 0.1);
  ctx.fill();
  ctx.fillStyle = '#43a047';
  for (const [lx, la] of [[-0.3, -0.7], [0, -0.05], [0.3, 0.6]]) {
    ctx.save(); ctx.translate(lx * bodyW, -bodyH * 0.18); ctx.rotate(la + Math.sin(G.time * 2 + lx * 4) * 0.08);
    ctx.beginPath(); ctx.ellipse(0, -38, 12, 42, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle = '#5d4037';
  ctx.beginPath(); ctx.arc(-24, 26, 7, 0, Math.PI * 2); ctx.arc(24, 26, 7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(0, 46, 16, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.restore();
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#fff8e1';
  ctx.font = '900 ' + Math.round(Math.min(W * 0.11, 58 * U)) + 'px sans-serif';
  ctx.fillText('萝卜守卫战', W / 2, H * 0.46);
  ctx.font = '600 ' + Math.round(13 * U) + 'px sans-serif';
  ctx.fillStyle = 'rgba(255,248,225,0.65)';
  ctx.fillText('RADISH DEFENSE · 经典塔防 · 共 ' + LEVELS.length + ' 关 · 当前 ' + curLevel().name, W / 2, H * 0.46 + 38 * U);
  ctx.fillStyle = 'rgba(255,248,225,0.9)'; ctx.font = '500 ' + Math.round(13 * U) + 'px sans-serif';
  ctx.fillText('建塔拦截怪物 · 清障腾地赚金币 · 守住大萝卜', W / 2, H * 0.46 + 64 * U);
  ctx.restore();
  // 难度胶囊
  const cw = Math.min(92 * U, (W - 46 * U) / 3), chh = 36 * U, cy = H * 0.615;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  DIFF_ORDER.forEach((id, i) => {
    const cx = W / 2 + (i - 1) * (cw + 12 * U);
    const sel = G.diff === id;
    BTN['diff_' + id] = { x: cx - cw / 2, y: cy - chh / 2, w: cw, h: chh };
    ctx.fillStyle = sel ? '#f08c00' : 'rgba(255,255,255,0.10)';
    roundRect(cx - cw / 2, cy - chh / 2, cw, chh, chh / 2); ctx.fill();
    if (!sel) { ctx.strokeStyle = 'rgba(255,248,225,0.4)'; ctx.lineWidth = 1.5 * U; roundRect(cx - cw / 2, cy - chh / 2, cw, chh, chh / 2); ctx.stroke(); }
    ctx.fillStyle = sel ? '#fff' : 'rgba(255,248,225,0.75)';
    ctx.font = '700 ' + Math.round(15 * U) + 'px sans-serif';
    ctx.fillText(DIFFS[id].label, cx, cy + 1);
  });
  ctx.font = '500 ' + Math.round(11 * U) + 'px sans-serif';
  ctx.fillStyle = 'rgba(255,248,225,0.5)';
  ctx.fillText('怪物血量 x' + DIFFS[G.diff].hpMul + ' · 初始金币 ' + DIFFS[G.diff].startCoins + ' · 萝卜生命 ' + DIFFS[G.diff].radishHp, W / 2, cy + chh);
  ctx.restore();
  // 关卡选择行：三张卡片（未解锁置灰）
  const lw = Math.min(118 * U, (W - 46 * U) / 3), lh = 44 * U, ly = H * 0.685;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  LEVELS.forEach((lv, i) => {
    const cx = W / 2 + (i - 1) * (lw + 12 * U);
    const locked = i >= G.unlock, sel = G.level === i;
    BTN['lv_' + i] = { x: cx - lw / 2, y: ly - lh / 2, w: lw, h: lh };
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.05)' : sel ? '#43a047' : 'rgba(255,255,255,0.10)';
    roundRect(cx - lw / 2, ly - lh / 2, lw, lh, 10 * U); ctx.fill();
    ctx.strokeStyle = locked ? 'rgba(255,248,225,0.15)' : sel ? '#a5d6a7' : 'rgba(255,248,225,0.4)';
    ctx.lineWidth = (sel ? 2.5 : 1.5) * U;
    roundRect(cx - lw / 2, ly - lh / 2, lw, lh, 10 * U); ctx.stroke();
    if (locked) {
      ctx.fillStyle = 'rgba(255,248,225,0.35)';
      ctx.font = '700 ' + Math.round(13 * U) + 'px sans-serif';
      ctx.fillText('🔒 未解锁', cx, ly);
      ctx.font = '500 ' + Math.round(10 * U) + 'px sans-serif';
      ctx.fillText('第 ' + (i + 1) + ' 关', cx, ly + 15 * U);
    } else {
      ctx.fillStyle = sel ? '#fff' : 'rgba(255,248,225,0.8)';
      ctx.font = '700 ' + Math.round(13 * U) + 'px sans-serif';
      ctx.fillText('第 ' + (i + 1) + ' 关', cx, ly - 9 * U);
      ctx.font = '500 ' + Math.round(10.5 * U) + 'px sans-serif';
      ctx.fillStyle = sel ? 'rgba(255,255,255,0.85)' : 'rgba(255,248,225,0.5)';
      ctx.fillText(lv.name + ' · ' + lv.waves.length + ' 波', cx, ly + 9 * U);
    }
  });
  ctx.restore();
  drawButton('start', '开 始 游 戏', W / 2, H * 0.795, Math.min(250 * U, W * 0.6), 54 * U, true);
  ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,248,225,0.6)';
  ctx.font = '600 ' + Math.round(12.5 * U) + 'px sans-serif';
  ctx.fillText(G.hint || ('「' + DIFFS[G.diff].label + '」第 ' + (G.level + 1) + ' 关历史最高 ' + bestNow() + ' 分 · 按 M 静音'), W / 2, H * 0.795 + 52 * U);
  ctx.restore();
  G.hint = null;
}
function drawEnd(win) {
  ctx.fillStyle = 'rgba(10,16,6,0.68)'; ctx.fillRect(0, 0, W, H);
  const finalWin = win && G.level + 1 >= LEVELS.length;
  ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = win ? '#aed581' : '#ef9a9a';
  ctx.font = '900 ' + Math.round(42 * U) + 'px sans-serif';
  ctx.fillText(win ? (finalWin ? '全 部 通 关 !' : '守 卫 成 功 !') : '萝卜被啃光了…', W / 2, H * 0.24);
  ctx.fillStyle = '#fff'; ctx.font = '600 ' + Math.round(14 * U) + 'px sans-serif';
  ctx.fillText(
    win
      ? (finalWin ? '三关全部守住，大萝卜安然无恙' : '第 ' + (G.level + 1) + ' 关「' + curLevel().name + '」' + curWaves().length + ' 波怪物都被击退了')
      : '第 ' + (G.level + 1) + ' 关 · 坚持到了第 ' + Math.min(G.nextWave + 1, curWaves().length) + ' 波',
    W / 2, H * 0.24 + 40 * U);
  ctx.fillStyle = '#ffd54f';
  ctx.font = '900 ' + Math.round(54 * U) + 'px sans-serif';
  ctx.fillText(G.score, W / 2, H * 0.44);
  ctx.font = '600 ' + Math.round(13 * U) + 'px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText(G.newBest ? '★ 新纪录！之前的最高 ' + G.prevBest + ' 分' : '「' + DIFFS[G.diff].label + '」第 ' + (G.level + 1) + ' 关最高分 ' + bestNow(), W / 2, H * 0.44 + 40 * U);
  ctx.font = '500 ' + Math.round(12.5 * U) + 'px sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('击杀 ' + G.kills + ' · 剩余萝卜生命 ' + G.radishHp + (win ? ' · 存活奖励 +' + G.radishHp * 20 : ''), W / 2, H * 0.44 + 66 * U);
  ctx.restore();
  if (win && !finalWin) {
    const nx = LEVELS[G.level + 1];
    drawButton('nextlv', '进入第 ' + (G.level + 2) + ' 关 · ' + nx.name, W / 2, H * 0.63, Math.min(260 * U, W * 0.66), 54 * U, true);
    drawButton('again', '再 来 一 局', W / 2, H * 0.63 + 72 * U, Math.min(260 * U, W * 0.66), 42 * U, false);
    drawButton('menu', '回主菜单', W / 2, H * 0.63 + 124 * U, Math.min(260 * U, W * 0.66), 42 * U, false);
  } else {
    drawButton('again', finalWin ? '重 玩 一 局' : '再 来 一 局', W / 2, H * 0.63, Math.min(250 * U, W * 0.6), 54 * U, true);
    drawButton('menu', '回主菜单', W / 2, H * 0.63 + 72 * U, Math.min(250 * U, W * 0.6), 42 * U, false);
  }
}
function drawScene() {
  for (const k in BTN) delete BTN[k];
  if (G.screen === 'menu') { drawMenu(); drawFx(); return; }
  drawField();
  drawPath();
  for (const k in G.cells) drawObs(G.cells[k].obs);
  drawRadish();
  drawPlacement();
  for (const t of G.towers) drawTower(t);
  for (const e of G.enemies) drawEnemy(e);
  for (const p of G.projectiles) drawProj(p);
  drawFx();
  drawHUD();
  drawPanel();
  if (G.screen === 'play') drawSelPopup();
  if (G.paused && G.screen === 'play') drawPaused();
  if (G.screen === 'win') drawEnd(true);
  if (G.screen === 'over') drawEnd(false);
}

// ---- 输入 ----
function localXY(ev) {
  const rect = canvas.getBoundingClientRect();
  const p = ev.touches && ev.touches.length ? ev.touches[0] : (ev.changedTouches && ev.changedTouches.length ? ev.changedTouches[0] : ev);
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}
function onDown(ev) {
  ev.preventDefault(); audio();
  const { x, y } = localXY(ev);
  const btn = hitBtn(x, y);
  if (G.screen === 'menu') {
    if (btn === 'start') { startGame(); return; }
    if (btn && btn.indexOf('diff_') === 0) { setDiff(btn.slice(5)); return; }
    if (btn && btn.indexOf('lv_') === 0) {
      const i = +btn.slice(3);
      if (i < G.unlock) { selectLevel(i); G.hint = null; }
      else G.hint = '🔒 「' + LEVELS[i].name + '」未解锁 · 先通关第 ' + i + ' 关';
      return;
    }
    return;
  }
  if (G.screen === 'win' || G.screen === 'over') {
    if (btn === 'nextlv') { selectLevel(G.level + 1); startGame(); return; }
    if (btn === 'again') { startGame(); return; }
    if (btn === 'menu') { G.screen = 'menu'; return; }
    return;
  }
  // --- play ---
  if (btn === 'sp_menu') { G.screen = 'menu'; G.paused = false; return; }
  if (btn === 'sp_pause' || btn === 'sp_resume') { G.paused = !G.paused; return; }
  if (btn === 'sp_tomenu') { G.paused = false; G.screen = 'menu'; return; }
  if (btn === 'sp_speed') { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; return; }
  if (btn === 'nw_call') { callWaveEarly(); return; }
  if (btn && btn.indexOf('tq_') === 0) {
    const id = btn.slice(3);
    G.selType = G.selType === id ? null : id; G.sel = null;
    return;
  }
  if (btn === 'tw_up' && G.sel) { upgradeTower(G.sel); return; }
  if (btn === 'tw_sell' && G.sel) { sellTower(G.sel); return; }
  if (btn) return;   // 其它按钮（占位）
  // 点击地图格
  const cell = cellAtXY(x, y);
  if (!cell) { G.selType = null; G.sel = null; return; }
  const t = towerAt(cell.c, cell.r);
  if (t) { G.sel = G.sel === t ? null : t; G.selType = null; return; }
  if (G.selType) {
    if (tryBuild(cell.c, cell.r, G.selType)) { /* 保留选中类型便于连建 */ }
    else G.sel = null;
    return;
  }
  G.sel = null;
}
function onMove(ev) {
  if (G.screen !== 'play') return;
  const { x, y } = localXY(ev);
  const cell = cellAtXY(x, y);
  G.hoverCell = cell && G.selType ? cell : null;
}
canvas.addEventListener('pointerdown', onDown);
canvas.addEventListener('pointermove', onMove);
window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') G.mute = !G.mute;
  if (G.screen === 'menu' && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if ((G.screen === 'win' || G.screen === 'over') && (e.key === 'Enter' || e.key === ' ')) { startGame(); return; }
  if (G.screen !== 'play') return;
  if (e.key === 'Escape') G.paused = !G.paused;
  if (e.key === '1') G.selType = G.selType === 'pea' ? null : 'pea';
  if (e.key === '2') G.selType = G.selType === 'ice' ? null : 'ice';
  if (e.key === '3') G.selType = G.selType === 'melon' ? null : 'melon';
  if (e.key === 's' || e.key === 'S') G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1;
  if (e.key === ' ') { e.preventDefault(); callWaveEarly(); }
});
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastFrame = null; });

// ---- 主循环（固定步长；倍速 = 每帧多跑几个 STEP；暂停跳过推进）----
let lastFrame = null, acc = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrame === null) { lastFrame = ts; return; }
  let dt = (ts - lastFrame) / 1000; lastFrame = ts;
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  while (acc >= STEP) {
    for (let s = 0; s < G.speed; s++) update(STEP);
    acc -= STEP;
  }
  drawScene();
}

function init() {
  loadBest(); loadDiff(); loadUnlock();
  let sv = 0;
  try { sv = localStorage.getItem(LEVEL_KEY) | 0; } catch (e) {}
  selectLevel(Math.min(Math.max(0, sv), G.unlock - 1));
  resize();
}

init();
requestAnimationFrame(frame);
</script>
