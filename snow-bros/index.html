/* ----------------------------- 难度 ----------------------------- */
const DIFFS = [
  { key: 'easy',   cn: '休闲', lives: 5, timeMul: 1.30, spawnInt: 2.60, freeze: 7.0, eMul: 0.85, scoreMul: 1.0, maxAlive: 3, rate: 0.30 },

/* ----------------------------- 工具 / 随机 ----------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const sign = v => v < 0 ? -1 : v > 0 ? 1 : 0;
const lerp = (a, b, t) => a + (b - a) * t;

let _seed = 1;
function setSeed(s) { _seed = (s >>> 0) || 1; }
function rng() { _seed = (_seed * 1664525 + 1013904223) >>> 0; return _seed / 4294967296; }
function rint(n) { return Math.floor(rng() * n) % (n || 1); }
function rrange(a, b) { return a + rng() * (b - a); }

/* ----------------------------- 存档 ----------------------------- */
const K_BEST = 'snowbro_best', K_DIFF = 'snowbro_diff', K_UNLOCK = 'snowbro_unlock';
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) { /* 隐私模式忽略 */ } }
let best = [0, 0, 0, 0, 0, 0, 0, 0, 0];   // 难度×关卡 九格
let unlock = 1;                            // 已解锁关数
let diffIdx = 1;
function recKey(d, l) { return d + '_' + l; }
function loadBest() {
  const raw = lsGet(K_BEST, ''); if (!raw) return;
  try { const o = JSON.parse(raw); for (let d = 0; d < 3; d++) for (let l = 0; l < 3; l++) best[d * 3 + l] = +(o[recKey(d, l)] || 0); } catch (e) { }
}
function saveBest() {
  const o = {}; for (let d = 0; d < 3; d++) for (let l = 0; l < 3; l++) o[recKey(d, l)] = best[d * 3 + l];
  lsSet(K_BEST, JSON.stringify(o));
}
function loadMeta() {
  diffIdx = clamp(+lsGet(K_DIFF, 1) || 0, 0, 2);
  unlock = clamp(+lsGet(K_UNLOCK, 1) || 1, 1, 3);
}
function saveMeta() { lsSet(K_DIFF, diffIdx); lsSet(K_UNLOCK, unlock); }

/* =========================================================================
 * 音效总线（Web Audio 实时合成，全部单音源 + 短包络，声部限流）
 * ========================================================================= */
let AC = null, master = null, muted = false, voices = 0, lastBoom = -1;
function audioInit() {
  if (AC || muted) return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  AC = new Ctor();
  master = AC.createGain(); master.gain.value = 0.5;
  const comp = AC.createDynamicsCompressor();
  master.connect(comp); comp.connect(AC.destination);
}
function tone(freq, dur, type, vol, slideTo) {
  if (!AC || muted) return;
  if (voices > 10) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(24, slideTo), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol === undefined ? 0.16 : vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
  voices++;
  o.onended = () => { voices--; };
}
function noise(dur, vol, freq) {
  if (!AC || muted) return;
  if (voices > 10) return;
  const t = AC.currentTime, n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate), ch = buf.getChannelData(0);
  /* 注意：噪声采样必须用 Math.random，绝不能碰种子 rng——无头测试里没有 AudioContext，
     一旦让音效消耗种子随机，真机与测试的随机序列就会分叉，同输入重放不再一致。 */
  for (let i = 0; i < n; i++) ch[i] = (i % 2 ? -1 : 1) * (1 - i / n) * (0.4 + Math.random() * 0.6);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq || 900;
  const g = AC.createGain(); g.gain.value = vol === undefined ? 0.2 : vol;
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + 0.02);
  voices++; src.onended = () => { voices--; };
}
const SFX = {
  shot()   { tone(760, 0.07, 'square', 0.09, 420); },
  fire()   { tone(180, 0.16, 'sawtooth', 0.11, 90); noise(0.1, 0.07, 1600); },
  freeze() { tone(1180, 0.1, 'triangle', 0.13, 300); noise(0.14, 0.09, 2600); },
  push()   { tone(240, 0.12, 'sine', 0.1, 520); },
  roll()   { tone(150, 0.09, 'sine', 0.05, 130); },
  pop()    { noise(0.22, 0.2, 700); tone(520, 0.16, 'square', 0.1, 120); },
  plat()   { tone(300, 0.12, 'triangle', 0.1, 620); noise(0.1, 0.08, 1800); },
  jump()   { tone(420, 0.09, 'square', 0.08, 700); },
  land()   { tone(150, 0.05, 'sine', 0.05, 110); },
  hurt()   { tone(300, 0.3, 'sawtooth', 0.15, 60); noise(0.25, 0.12, 400); },
  item()   { tone(680, 0.08, 'triangle', 0.12, 900); tone(1020, 0.12, 'triangle', 0.1, 1350); },
  door()   { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.16, 'triangle', 0.12), i * 90)); },
  win()    { [659, 784, 988, 1319].forEach((f, i) => setTimeout(() => tone(f, 0.2, 'square', 0.12), i * 110)); },
  boom()   { if (lastBoom >= 0) return; lastBoom = 0; noise(0.5, 0.26, 260); tone(90, 0.4, 'sawtooth', 0.14, 40); },
  tick()   { tone(1400, 0.03, 'sine', 0.05); },
};
function boomOnce() { SFX.boom(); }

/* =========================================================================
 * 全局状态
 * ========================================================================= */
const G = {
  scene: 'menu',            // menu | levels | play | pause | result | fail | clear
  li: 0, diff: DIFFS[1], diffIdx: 1,
  score: 0, levelScore: 0, timeLeft: 120, timeMax: 120, lives: 4,
  speed: 1, frame: 0, hurry: false,
  killed: 0, spawned: 0, spawnLeft: 0, spawnTimer: 0, spawnQueue: [],
  door: null, doorTimer: 0,
  combo: 0, comboTimer: 0, bestCombo: 0, itemsGot: 0,
  popups: [], shake: 0, flash: 0, freezeAll: 0, deathTimer: 0, deathBy: '',
  clearInfo: null, timeAcc: 0,
};
const IN = { left: false, right: false, jump: false, fire: false };
let player = null, shots = [], balls = [], items = [], foes = [], ebolts = [], parts = [], dynPlats = [];
let grid = null;            // ROWS×COLS：0 空 / 1 实心 / 2 单向
let plats = [];             // 静态单向台面 {y, x0, x1}
let levelTheme = LEVELS[0].theme;

/* ----------------------------- 关卡构建 ----------------------------- */
function buildLevel(li) {
  const L = LEVELS[li];
  grid = [];
  for (let r = 0; r < ROWS; r++) { grid.push(new Array(COLS).fill(0)); }
  for (let r = 1; r < GROUND_ROW; r++) { grid[r][0] = 1; grid[r][COLS - 1] = 1; }
  for (let r = GROUND_ROW; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = 1;
  for (const [r, c0, c1] of L.plats) for (let c = c0; c <= c1; c++) if (grid[r][c] === 0) grid[r][c] = 2;
  for (const [r, c0, c1] of (L.blocks || [])) for (let c = c0; c <= c1; c++) grid[r][c] = 1;

  plats = [];
  for (let r = 0; r < ROWS; r++) {
    let c = 0;
    while (c < COLS) {
      if (grid[r][c] === 2) {
        let c2 = c; while (c2 + 1 < COLS && grid[r][c2 + 1] === 2) c2++;
        plats.push({ y: r * T, x0: c * T, x1: (c2 + 1) * T, row: r, c0: c, c1: c2 });
        c = c2 + 1;
      } else c++;
    }
  }
}

function startLevel(li) {
  const L = LEVELS[li], D = G.diff;
  G.li = li;
  buildLevel(li);
  levelTheme = L.theme;
  setSeed(20260930 + li * 7919 + G.diffIdx * 104729);

  shots = []; balls = []; items = []; foes = []; ebolts = []; parts = []; dynPlats = [];
  G.timeMax = L.time * D.timeMul;
  G.levelScore = 0; G.timeLeft = G.timeMax; G.frame = 0; G.hurry = false;
  G.killed = 0; G.spawned = 0; G.spawnTimer = 1.1; G.door = null; G.doorTimer = 0;
  G.combo = 0; G.comboTimer = 0; G.bestCombo = 0; G.itemsGot = 0; G.popups = [];
  G.shake = 0; G.flash = 0; G.freezeAll = 0; G.timeAcc = 0; G.deathTimer = 0; G.deathBy = '';
  G.clearInfo = null;

  G.spawnQueue = [];
  refillQueue();

  player = makePlayer(L);
  G.scene = 'play';
}

/** 按关卡 mix 装满一波怪源并洗牌（确定性：走种子 LCG） */
function refillQueue() {
  const L = LEVELS[G.li];
  G.spawnQueue = [];
  for (const k of EORDER) for (let i = 0; i < (L.mix[k] || 0); i++) G.spawnQueue.push(k);
  for (let i = G.spawnQueue.length - 1; i > 0; i--) { const j = rint(i + 1); const t = G.spawnQueue[i]; G.spawnQueue[i] = G.spawnQueue[j]; G.spawnQueue[j] = t; }
  G.spawnLeft = G.spawnQueue.length;
}

function makePlayer(L) {
  return {
    x: L.spawn.col * T + (T - PW) / 2, y: L.spawn.row * T + (T - PH),
    w: PW, h: PH, vx: 0, vy: 0, dir: 1, onGround: false, wasGround: false,
    coyote: 0, buf: 0, jumpLock: 0,
    shotCd: 0, buff: { fire: 0, rapid: 0, stretch: 0 }, shield: false,
    inv: SPAWN_GRACE, dead: false, anim: 0, riding: null, blink: 0, prevJump: false, rideBall: null,
  };
}

function respawn() {
  const L = LEVELS[G.li];
  player.x = L.spawn.col * T + (T - PW) / 2; player.y = L.spawn.row * T + (T - PH);
  player.vx = player.vy = 0; player.inv = SPAWN_GRACE; player.blink = 0;
  player.dead = false; player.shield = false; player.prevJump = false; player.buf = 0; player.coyote = 0;
  player.buff = { fire: 0, rapid: 0, stretch: 0 };
  clearSpawnArea();
  for (const b of balls) if (!b.rolling) b.timer = Math.min(b.timer, 0.35); // 复活时冻球即将解开
  ebolts = [];
  G.combo = 0;
}
/** 复活保护：把压在复活点上的怪推到两侧，否则同一只怪能连吃三条命（玩家完全没反应时间） */
function clearSpawnArea() {
  const cx = player.x + player.w / 2, feet = player.y + player.h;
  for (const f of foes) {
    if (f.dead || f.leaving || f.frozen) continue;
    if (Math.abs((f.y + f.h) - feet) > 64) continue;
    const fcx = f.x + f.w / 2;
    if (Math.abs(fcx - cx) > RESPAWN_PUSH - f.w / 2) continue;
    const side = sign(fcx - cx) || (cx < VW / 2 ? 1 : -1);
    f.x = clamp(cx + side * RESPAWN_PUSH, T + 2, VW - T - 2 - f.w);
    f.vx = side * 140; f.vy = -170; f.onGround = false;
  }
}

/* =========================================================================
 * 碰撞：轴分离扫掠 AABB + ≤10px 拆子步；单向台只在向下且脚底原本在台面之上时接住
 * ========================================================================= */
function solidPx(px, py) {
  if (px < 0 || px >= VW) return true;
  if (py < 0) return false;
  if (py >= VH) return true;
  const c = Math.floor(px / T), r = Math.floor(py / T);
  if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return false;
  return grid[r][c] === 1;
}
function boxSolid(x, y, w, h) {
  const e = 0.01;
  return solidPx(x + e, y + e) || solidPx(x + w - e, y + e) || solidPx(x + e, y + h - e) || solidPx(x + w - e, y + h - e);
}
/** 所有单向台面（静态 + 雪台 + 雪球顶 + 雪盾台） */
function oneWaySurfaces(b) {
  const list = plats;
  const top = b.y, bot = b.y + b.h;
  const out = [];
  for (const p of list) if (p.y >= top - 1 && p.y <= bot + 2 && p.x1 > b.x && p.x0 < b.x + b.w) out.push(p);
  for (const d of dynPlats) if (d.y >= top - 1 && d.y <= bot + 2 && d.x + d.w > b.x && d.x < b.x + b.w) out.push(d);
  for (const bl of balls) {
    const sy = bl.y - bl.r * 0.62;
    if (sy >= top - 1 && sy <= bot + 2 && bl.x + bl.r > b.x && bl.x - bl.r < b.x + b.w) out.push({ y: sy, ball: bl });
  }
  return out;
}
function moveBody(b, dt) {
  b.onGround = false; b.rideBall = null;
  const steps = Math.max(1, Math.ceil(Math.max(Math.abs(b.vx * dt), Math.abs(b.vy * dt)) / 10));
  const sdt = dt / steps;
  for (let s = 0; s < steps; s++) {
    /* X 轴 */
    let nx = b.x + b.vx * sdt;
    if (b.vx > 0) {
      if (boxSolid(nx, b.y, b.w, b.h)) {
        nx = Math.floor((nx + b.w) / T) * T - b.w - 0.01;
        b.wallR = true;
        b.vx = 0;
      }
    } else if (b.vx < 0) {
      if (boxSolid(nx, b.y, b.w, b.h)) {
        /* 静止位置必须按「领先边（左边缘）所在列」算：用移动前的 b.x 会多退一整格，
           玩家贴左墙时就会在 40↔80 之间来回抽搐，永远贴不到墙。 */
        nx = (Math.floor((nx + 0.01) / T) + 1) * T + 0.01;
        b.wallL = true;
        b.vx = 0;
      }
    }
    b.x = nx;
    /* Y 轴 */
    const prevFeet = b.y + b.h;
    let ny = b.y + b.vy * sdt;
    if (b.vy >= 0) {
      if (boxSolid(b.x, ny, b.w, b.h)) {
        const row = Math.floor((ny + b.h) / T);
        ny = row * T - b.h - 0.01;
        b.vy = 0; b.onGround = true;
      } else {
        const ows = oneWaySurfaces({ x: b.x, y: ny, w: b.w, h: b.h });
        for (const p of ows) {
          if (p.y >= prevFeet - 1e-3 && p.y <= ny + b.h + 1e-3) {
            ny = p.y - b.h; b.vy = 0; b.onGround = true;
            if (p.ball) b.rideBall = p.ball;
            break;
          }
        }
      }
    } else {
      if (boxSolid(b.x, ny, b.w, b.h)) {
        /* 同理按领先边（头顶）所在行回到该行之上，用移动前的 b.y 会把人往下拽一整格 */
        ny = (Math.floor((ny + 0.01) / T) + 1) * T + 0.01;
        b.vy = 0;
      }
    }
    b.y = ny;
  }
  if (b.y > VH + 200) { b.y = VH - 200; b.vy = 0; }
}
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleBox(cx, cy, cr, bx, by, bw, bh) {
  const nx = clamp(cx, bx, bx + bw), ny = clamp(cy, by, by + bh);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy <= cr * cr;
}
/** 敌/球/弹在同一水平带内是否有实心阻挡（用于射线可见性） */
function rowClear(x0, x1, y) {
  const a = Math.min(x0, x1), b = Math.max(x0, x1);
  for (let x = Math.ceil(a / T); x * T <= b; x++) {
    const c = Math.floor(x * T / T);
    if (c < 0 || c >= COLS) continue;
    const r = Math.floor(y / T);
    if (r >= 0 && r < ROWS && grid[r][c] === 1) return false;
  }
  return true;
}

/* =========================================================================
 * 玩家
 * ========================================================================= */
function updatePlayer(dt) {
  const p = player, D = G.diff;
  if (p.dead) return;
  p.inv = Math.max(0, p.inv - dt);
  for (const k of ['fire', 'rapid', 'stretch']) if (p.buff[k] > 0) p.buff[k] = Math.max(0, p.buff[k] - dt);
  p.anim += dt;

  /* 水平：地面加速/摩擦，空中弱化 */
  const want = (IN.left ? -1 : 0) + (IN.right ? 1 : 0);
  const maxv = MOVE;
  if (want !== 0) {
    p.dir = want;
    p.vx += want * (p.onGround ? ACC : AIR_ACC) * dt;
    p.vx = clamp(p.vx, -maxv, maxv);
  } else if (p.onGround) {
    const s = FRIC * dt;
    p.vx = Math.abs(p.vx) <= s ? 0 : p.vx - sign(p.vx) * s;
  } else {
    p.vx *= (1 - 1.4 * dt);
  }
  if (p.rideBall) p.vx *= RIDE_SLOW_MUL;

  /* 跳跃：土狼时间 + 跳跃缓冲 + 松手截断；两次起跳之间必须释放一次按键（长按不再连跳） */
  p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
  if (p.onGround) p.jumpLock = 0;
  const held = IN.jump;
  if (held && !p.prevJump) p.buf = BUF; else p.buf = Math.max(0, p.buf - dt);
  p.prevJump = held;
  if (p.buf > 0 && (p.onGround || p.coyote > 0) && p.jumpLock === 0) {
    p.vy = -JUMP_V; p.buf = 0; p.coyote = 0; p.jumpLock = 6; p.onGround = false;
    if (p.rideBall) p.rideBall.rider = null;
    SFX.jump();
  }
  p.jumpLock = Math.max(0, p.jumpLock - 1);
  if (!held && p.vy < -120) { p.vy *= Math.pow(RISE_CUT, dt * 60); }
  p.vy = Math.min(MAX_FALL, p.vy + GRAV * dt);

  const wasGround = p.onGround;
  p.wallL = false; p.wallR = false;
  moveBody(p, dt);
  if (!wasGround && p.onGround) { SFX.land(); burst(p.x + p.w / 2, p.y + p.h, 4, '#dfeeff', 60); }

  /* 推冻球：面向 + 侧向接触 */
  for (const b of balls) {
    if (b.rolling || b.dead) continue;
    const overlapY = p.y + p.h > b.y - b.r * 0.6 && p.y < b.y + b.r;
    const near = Math.abs((p.x + p.w / 2) - b.x) < b.r + p.w / 2 - 2;
    if (overlapY && near && want !== 0 && Math.sign(b.x - (p.x + p.w / 2)) === want) {
      b.rolling = true; b.dir = want; b.timer = Math.max(b.timer, 3.2);
      b.vx = b.dir * ROLL_V; SFX.push(); popup(b.x, b.y - b.r - 8, '推！', '#fff0a8');
    }
  }

  /* 射击 */
  p.shotCd = Math.max(0, p.shotCd - dt);
  if (IN.fire && p.shotCd === 0) {
    const cap = p.buff.rapid > 0 ? MAX_SHOT_RAPID : MAX_SHOT;
    if (shots.length < cap) {
      fireShot();
      p.shotCd = p.buff.rapid > 0 ? G.diff.rate * 0.52 : G.diff.rate;
    }
  }

  /* 捡道具 */
  for (const it of items) {
    if (it.dead) continue;
    if (aabb(p, { x: it.x - ITEM_W / 2, y: it.y - ITEM_H / 2, w: ITEM_W, h: ITEM_H })) grabItem(it.kind);
  }

  /* 进门 */
  if (G.door && !p.dead) {
    const d = G.door;
    if (aabb(p, { x: d.x - 4, y: d.y - 4, w: d.w + 8, h: d.h + 8 })) levelComplete();
  }

  /* 受伤：只有敌人本体与火球会伤人，自己的雪球不伤己（无踩杀，站着不动必死） */
  if (p.inv <= 0) {
    for (const f of foes) {
      if (f.frozen || f.dead || f.leaving) continue;
      if (aabb(p, { x: f.x, y: f.y, w: f.w, h: f.h })) { hurt('touch'); break; }
    }
    if (p.inv <= 0) for (const e of ebolts) {
      if (e.dead) continue;
      if (circleBox(e.x, e.y, e.r, p.x, p.y, p.w, p.h)) { hurt('bolt'); break; }
    }
  }
}

function fireShot() {
  const p = player, fire = p.buff.fire > 0;
  /* 弹道高度取玩家身体中心：凡是「够得着我的」敌人也都「打得着它」，
     否则会出现贴着玩家头顶、既躲不掉又打不中的死局（蝙蝠尤其明显） */
  const cx = p.x + p.w / 2 + p.dir * (p.w / 2 + 6), cy = p.y + p.h / 2;
  shots.push({
    x: cx, y: cy, vx: p.dir * SHOT_V, life: SHOT_LIFE * (p.buff.stretch > 0 ? 1.8 : 1),
    r: fire ? SHOT_R + 2 : SHOT_R, fire, dir: p.dir, hitIds: {}, spin: 0,
  });
  if (fire) SFX.fire(); else SFX.shot();
}

function hurt(by) {
  const p = player;
  if (p.inv > 0 || p.dead) return;
  if (p.shield) {
    p.shield = false; p.inv = 1.0; G.flash = 0.16; G.shake = 6;
    SFX.pop(); popup(p.x + p.w / 2, p.y - 10, '护盾挡下！', '#ffd166');
    burst(p.x + p.w / 2, p.y + p.h / 2, 12, '#ffd166', 150);
    return;
  }
  p.dead = true; G.lives--; G.shake = 10; G.flash = 0.25;
  SFX.hurt();
  burst(p.x + p.w / 2, p.y + p.h / 2, 18, '#ffffff', 200);
  addPopup(p.x + p.w / 2, p.y, '被抓住了', '#ff9a9a');
  G.deathTimer = 0.85;
  G.deathBy = by;
}

/* =========================================================================
 * 雪球弹 / 冻球 / 雪台 / 道具 / 敌人弹
 * ========================================================================= */
function updateShots(dt) {
  for (const s of shots) {
    if (s.dead) continue;
    s.life -= dt; s.spin += dt * 12;
    if (s.life <= 0) { s.dead = true; burst(s.x, s.y, 4, '#dfeeff', 70); continue; }
    const nx = s.x + s.vx * dt;
    const hitWall = nx - s.r < 0 || nx + s.r > VW || solidPx(nx, s.y);
    if (hitWall) {
      /* 撞墙 → 在弹体高度凝结一块小雪台：踩着它再朝墙吐一发，就能一级一级往上搭 */
      s.dead = true;
      s.x = clamp(nx, s.r, VW - s.r);
      if (!s.fire) puffAt(s.x, s.y);
      burst(s.x, s.y, 5, '#eaf6ff', 90);
      continue;
    }
    s.x = nx;
    for (const f of foes) {
      if (f.dead || f.leaving || f.frozen) continue;
      if (circleBox(s.x, s.y, s.r, f.x, f.y, f.w, f.h)) {
        s.dead = true;
        if (s.fire) { killFoe(f, 'fire', 1); } else freezeFoe(f, s.x);
        break;
      }
    }
  }
  shots = shots.filter(s => !s.dead);
}

/** 撞墙凝结的小雪台：可站立单向面，3.6s 消融，全场最多 5 块 */
function puffAt(x, y) {
  const row = clamp(Math.floor(y / T), 1, ROWS - 1);
  const py = row * T;
  const w = PUFF_W;
  dynPlats.push({ x: clamp(Math.round(x - w / 2), 2, VW - w - 2), y: py, w, h: 10, t: PUFF_LIFE, max: PUFF_LIFE, kind: 'puff' });
  let n = 0, oldest = -1;
  for (let i = 0; i < dynPlats.length; i++) {
    if (dynPlats[i].kind !== 'puff') continue;
    n++;
    if (oldest < 0 || dynPlats[i].t < dynPlats[oldest].t) oldest = i;
  }
  if (n > PUFF_MAX) dynPlats.splice(oldest, 1);
}

function freezeFoe(f, sx) {
  f.frozen = true; f.timer = G.diff.freeze * ENEMIES[f.kind].thaw;
  balls.push({
    x: clamp(sx, 20, VW - 20), y: f.y + f.h - FREEZE_R * 0.62, r: FREEZE_R,
    vx: 0, vy: 0, dir: 0, rolling: false, frozen: true, timer: f.timer,
    kind: f.kind, dead: false, rider: null, spin: 0, maxTimer: f.timer,
  });
  f.dead = true;
  SFX.freeze();
  addPopup(f.x + f.w / 2, f.y - 6, '冻住！', '#a8e8ff');
  burst(f.x + f.w / 2, f.y + f.h / 2, 8, '#d8f4ff', 120);
}

function updateBalls(dt) {
  for (const b of balls) b.rider = (player.rideBall === b && !player.dead) ? player : null;
  for (const b of balls) {
    if (b.dead) continue;
    b.timer -= dt;
    if (b.timer <= 0) {                 // 冻壳破裂，敌人复活（更快、更凶）
      b.dead = true;
      reviveFoe(b);
      burst(b.x, b.y, 6, '#ffd7d7', 120);
      tone(220, 0.12, 'square', 0.08, 140);
      continue;
    }
    b.spin += b.vx * dt * 0.06;
    if (b.rolling) {
      b.r = Math.min(ROLL_R, b.r + ROLL_GROW * dt);
      b.vx = b.dir * (b.rider ? ROLL_V * BALL_SLOW_RIDE : ROLL_V);
      for (const f of foes) {
        if (f.dead || f.leaving || f.frozen) continue;
        if (circleBox(b.x, b.y, b.r, f.x, f.y, f.w, f.h)) {
          b.r = Math.min(ROLL_R, b.r + 3);
          killFoe(f, 'roll', 2);
          SFX.roll();
        }
      }
      if (G.frame % 8 === 0) burst(b.x - sign(b.vx) * b.r, b.y + b.r * 0.5, 1, '#eaf6ff', 40);
    } else b.vx = 0;
    /* 冻球与滚球共用一套扫掠物理：会掉下悬空处、撞墙即凝结成雪台 */
    b.vy = Math.min(MAX_FALL, b.vy + GRAV * dt);
    const rr = b.r * 0.62;
    const body = { x: b.x - rr, y: b.y - rr, w: rr * 2, h: rr * 2, vx: b.vx, vy: b.vy, wallL: false, wallR: false };
    moveBody(body, dt);
    b.vy = body.vy;
    b.x = body.x + rr;
    b.y = body.y + rr;
    if (b.rolling && (body.wallL || body.wallR)) { burstBall(b); continue; }
  }
  balls = balls.filter(b => !b.dead);
}

/** 滚动的雪球撞墙 → 变成可站立雪台，球里的敌人被压扁计分并可能掉道具 */
function burstBall(b) {
  b.dead = true;
  const w = b.r * 2 + SNOW_PLAT_EXTRA;
  const y = b.y - b.r * 0.62;           // 台面顶边取球顶：塌下去仍比原来的落脚高一级
  dynPlats.push({ x: clamp(b.x - w / 2, 2, VW - w - 2), y, w, h: 14, t: SNOW_PLAT_LIFE, max: SNOW_PLAT_LIFE, kind: 'snow' });
  killFoeKind(b.kind, b.x, y - 6, 'burst', 2);
  G.shake = 5; boomOnce();
  burst(b.x, y, 16, '#ffffff', 190);
  SFX.pop();
}

function reviveFoe(b) {
  const def = ENEMIES[b.kind];
  const f = mkFoe(b.kind);
  f.x = clamp(b.x - def.w / 2, T, VW - T - def.w);
  f.y = b.y - def.h + 6; f.vy = 0;
  f.angry = true; f.spMul = 1.25;
  foes.push(f);
  addPopup(f.x + f.w / 2, f.y - 6, '解冻！', '#ffb1ae');
}

/* 击杀（ball 内压扁用：只给分与掉落，不占 foes） */
function killFoeKind(kind, x, y, how, mul) {
  const def = ENEMIES[kind];
  addComboKill(x, y, def.score, mul, how);
  maybeDropItem(x, y);
  G.killed++;
}
function killFoe(f, how, mul) {
  if (f.dead) return;
  f.dead = true;
  const def = ENEMIES[f.kind];
  addComboKill(f.x + f.w / 2, f.y, def.score, mul, how);
  maybeDropItem(f.x + f.w / 2, f.y);
  burst(f.x + f.w / 2, f.y + f.h / 2, 10, def.color, 160);
  if (how === 'bomb' || how === 'burst') boomOnce(); else SFX.pop();
  G.killed++;
}
function addComboKill(x, y, base, mul, how) {
  G.combo = G.comboTimer > 0 ? Math.min(G.combo + 1, COMBO_MUL.length) : 1;
  G.comboTimer = COMBO_WIN;
  G.bestCombo = Math.max(G.bestCombo, G.combo);
  const gain = Math.round(base * COMBO_MUL[G.combo - 1] * mul * G.diff.scoreMul);
  G.score += gain; G.levelScore += gain;
  addPopup(x, y - 4, '+' + gain + (G.combo > 1 ? ' ×' + G.combo : ''), how === 'roll' ? '#a8ffb0' : '#fff3b0');
}
function maybeDropItem(x, y) {
  const chance = 0.30 + (G.hurry ? 0.08 : 0);
  if (rng() > chance) return;
  const roll = rng();
  let kind;
  if (roll < 0.14) kind = 'fire';
  else if (roll < 0.30) kind = 'rapid';
  else if (roll < 0.44) kind = 'stretch';
  else if (roll < 0.58) kind = 'bomb';
  else if (roll < 0.72) kind = 'shield';
  else kind = 'gem';
  items.push({ x: clamp(x, 20, VW - 20), y, vy: -40, kind, t: ITEM_LIFE, dead: false });
}
function grabItem(kind) {
  const it = items.find(i => !i.dead && i.kind === kind);
  if (it) it.dead = true;
  G.itemsGot++;
  if (kind === 'gem') {
    const gain = Math.round(500 * G.diff.scoreMul);
    G.score += gain; G.levelScore += gain; addPopup(player.x + 15, player.y - 10, '+' + gain, '#7cf6a4');
  } else if (kind === 'bomb') {
    G.freezeAll = 0.35; G.flash = 0.2;
    for (const f of foes) if (!f.frozen && !f.dead && !f.leaving) freezeFoe(f, f.x + f.w / 2);
    addPopup(player.x + 15, player.y - 10, '全屏冻结！', '#ff8b8b');
  } else if (kind === 'shield') {
    player.shield = true; addPopup(player.x + 15, player.y - 10, '护盾就绪', '#ffd166');
  } else {
    player.buff[kind] = ITEMS[kind].timed;
    addPopup(player.x + 15, player.y - 10, ITEMS[kind].cn, ITEMS[kind].color);
  }
  SFX.item();
}

function updateItems(dt) {
  for (const it of items) {
    if (it.dead) continue;
    it.t -= dt;
    if (it.t <= 0) { it.dead = true; continue; }
    const body = { x: it.x - 8, y: it.y - 8, w: 16, h: 16, vx: 0, vy: it.vy };
    body.vy = Math.min(500, body.vy + GRAV * 0.55 * dt);
    moveBody(body, dt);
    it.vy = body.onGround ? 0 : body.vy;
    it.x = clamp(body.x + 8, 10, VW - 10);
    it.y = body.y + 8;
  }
  items = items.filter(i => !i.dead);
}
function updateDynPlats(dt) {
  for (const d of dynPlats) d.t -= dt;
  dynPlats = dynPlats.filter(d => d.t > 0);
}

/* =========================================================================
 * 敌人
 * ========================================================================= */
function mkFoe(kind) {
  const def = ENEMIES[kind];
  return {
    kind, x: 0, y: 0, w: def.w, h: def.h, vx: 0, vy: 0, dir: rng() < 0.5 ? -1 : 1,
    onGround: false, frozen: false, timer: 0, dead: false, leaving: false, leaveT: 0,
    angry: false, spMul: 1, phase: rng() * Math.PI * 2, hopT: rrange(0.4, 1.2),
    warn: 0, shootCd: rrange(1.4, 2.6), anim: rng() * 10, fallFrom: 0,
  };
}
function spawnFoe(kind) {
  const def = ENEMIES[kind];
  const f = mkFoe(kind);
  f.x = PORTAL.x - def.w / 2 + rrange(-14, 14);
  f.y = PORTAL.y;
  f.fallFrom = PORTAL.y;
  foes.push(f);
  G.spawned++; G.spawnLeft--;
  burst(f.x + f.w / 2, f.y, 6, levelTheme.aurora, 90);
  tone(900, 0.08, 'sine', 0.06, 1500);
}
function foeSpeed(f) {
  const base = ENEMIES[f.kind].sp * G.diff.eMul * f.spMul * (G.hurry ? 1.22 : 1);
  return base;
}
function updateFoes(dt) {
  for (const f of foes) {
    if (f.dead) continue;
    if (f.leaving) {
      f.leaveT += dt; f.anim += dt; f.y -= 240 * dt;
      if (f.leaveT > 0.7) f.dead = true;
      continue;
    }
    f.anim += dt;
    const sp = foeSpeed(f);
    const pcx = player.x + player.w / 2, pcy = player.y + player.h / 2;
    const fcx = f.x + f.w / 2, fcy = f.y + f.h / 2;
    const toward = sign(pcx - fcx) || 1;

    if (f.kind === 'bat') {
      /* 飞行：横向追玩家，纵向对齐玩家身体中心（= 雪弹飞行线），
         对齐速度要快，否则它会压着玩家的水平线掉下来撞头，而那段时间里它打不着。
         扇翅抖动必须由控制器预先抵消：不减的话它会稳定停在弹道带外 0.75px，
         玩家看着它明明在线上、每一发却都擦着飞过去。 */
      f.vx = toward * sp;
      const targetY = player.y + player.h / 2;
      f.phase += dt * 3.4;
      const wob = Math.sin(f.phase) * 14;
      f.vy = clamp((targetY - fcy) * 2.6 - wob, -170, 170);
      f.x += f.vx * dt; f.y += (f.vy + wob) * dt;
      f.x = clamp(f.x, T + 2, VW - T - 2 - f.w);
      f.y = clamp(f.y, 6, GROUND_Y - f.h - 2);
      if (f.vx) f.dir = sign(f.vx);
    } else if (f.kind === 'hopper') {
      f.hopT -= dt;
      if (f.onGround) {
        f.vx = 0;                                  // 落地即停，起跳瞬间才给弹道速度
        if (f.hopT <= 0) {
          f.hopT = rrange(0.85, 1.45) / (G.hurry ? 1.15 : 1);
          const dd = descentDir(f);
          f.vy = -430; f.vx = (dd || toward) * sp; f.dir = dd || toward;
          tone(340, 0.05, 'sine', 0.04, 460);
        }
      }
      f.vy = Math.min(MAX_FALL, f.vy + GRAV * dt);
      const body = foeBody(f); moveBody(body, dt); writeFoe(f, body);
    } else {
      /* 地面怪 / 投掷怪：朝玩家走，撞墙反向；走到平台边缘会掉下去 */
      const dd = descentDir(f);             // 悬在玩家头顶打不到 → 沿台面走向最近的边缘落下
      let want = dd || toward;
      if (f.kind === 'thrower') {
        const sameBand = Math.abs(fcy - pcy) < 26 && rowClear(fcx, pcx, fcy);
        if (sameBand && Math.abs(pcx - fcx) < 320 && !dd) want = 0;
        f.shootCd -= dt;
        if (want === 0 && f.shootCd <= 0) {
          /* 预警 0.55s：这条线上玩家看得见、也来得及走出枪线 */
          f.warn += dt;
          if (f.warn >= 0.55) {
            f.warn = 0; f.shootCd = rrange(1.5, 2.4) / (G.hurry ? 1.2 : 1);
            throwBolt(f);
          }
        } else f.warn = 0;
      }
      f.vx = want * sp;
      if (want) f.dir = want;
      f.vy = Math.min(MAX_FALL, f.vy + GRAV * dt);
      f.wallL = false; f.wallR = false;
      const body = foeBody(f); moveBody(body, dt); writeFoe(f, body);
      if ((want < 0 && f.wallL) || (want > 0 && f.wallR)) { f.dir = -want; f.vx = 0; }
    }
    if (f.angry && f.onGround) f.spMul = Math.max(1.1, f.spMul - dt * 0.1);
  }
  foes = foes.filter(f => !f.dead);
}
/** 当前真正托住这个身体的面（与 moveBody 的单向台判据一致：脚底齐平 + 水平有任意重叠即算托住） */
function supportSurface(x0, x1, feet) {
  let best = null, bestY = 1e9;
  const take = (y, sx0, sx1) => { if (Math.abs(y - feet) < 4 && y < bestY && sx1 > x0 && sx0 < x1) { bestY = y; best = { y, x0: sx0, x1: sx1 }; } };
  for (const p of plats) take(p.y, p.x0, p.x1);
  for (const d of dynPlats) take(d.y, d.x, d.x + d.w);
  for (const b of balls) take(b.y - b.r * 0.62, b.x - b.r, b.x + b.r);
  if (!best) best = { y: GROUND_Y, x0: T, x1: VW - T };   // 地面（脚底贴合整行实心）
  return best;
}
/** 玩家在脚下 26px 以上 → 地面向导走向脚下面最近的边缘掉下去。
 *  否则敌人会永远悬在头顶：雪弹只会水平飞，够不着就是死局（Bot 与玩家都打不完配额）。
 *  判据必须用「托住我的面」而不是「我中心下方的面」，后者在边缘处会来回翻转方向卡死。 */

  const cx = f.x + f.w / 2, feet = f.y + f.h;

}
function foeBody(f) { return { x: f.x, y: f.y, w: f.w, h: f.h, vx: f.vx, vy: f.vy, onGround: false, wallL: false, wallR: false, rideBall: null }; }
function writeFoe(f, b) { f.x = b.x; f.y = b.y; f.vy = b.vy; f.onGround = b.onGround; f.wallL = b.wallL; f.wallR = b.wallR; }

  const d = f.dir || sign(player.x - f.x) || 1;
  ebolts.push({ x: f.x + f.w / 2 + d * 16, y: f.y + f.h * 0.4, vx: d * 250, r: 8, life: 3.2, dead: false });

}
function updateEBolts(dt) {
  for (const e of ebolts) {
    if (e.dead) continue;
    e.life -= dt;
    if (e.life <= 0) { e.dead = true; continue; }
    e.x += e.vx * dt;
    if (e.x < 6 || e.x > VW - 6 || solidPx(e.x, e.y)) {
      e.dead = true; burst(e.x, e.y, 5, '#ffb27a', 110); continue;
    }
    if (Math.abs(e.y - (player.y + player.h / 2)) > 200) { e.dead = true; }
  }

}

/* =========================================================================
 * 刷怪 / 门 / 结算
 * ========================================================================= */
function aliveCount() { return foes.filter(f => !f.dead && !f.leaving).length; }
function updateSpawner(dt) {
  const D = G.diff, L = LEVELS[G.li];
  if (G.killed >= L.quota) { openDoor(); return; }
  if (G.spawnLeft <= 0) refillQueue();      // 怪源不断，配额必然可完成（不会出现「刷完了还差几只」的死局）
  G.spawnTimer -= dt * (G.hurry ? 1.25 : 1);
  if (G.spawnTimer <= 0 && aliveCount() < D.maxAlive) {
    G.spawnTimer = D.spawnInt;
    spawnFoe(G.spawnQueue[G.spawnQueue.length - G.spawnLeft]);
  }
}
function openDoor() {
  if (G.door) return;
  const L = LEVELS[G.li];
  for (const f of foes) {
    if (!f.dead && !f.leaving) {
      f.leaving = true; f.leaveT = 0;      // 开门后残余敌人飘走，不再参与判定
      G.score += 60; G.levelScore += 60;
      burst(f.x + f.w / 2, f.y + f.h / 2, 8, '#ffffff', 140);
    }
  }
  balls.length = 0;
  const dw = 36, dh = 46;
  G.door = { x: L.door.col * T + (T - dw) / 2, y: (L.door.row + 1) * T - dh, w: dw, h: dh, t: 0 };
  G.doorTimer = 0;
  SFX.door();
  addPopup(G.door.x + dw / 2, G.door.y - 10, '门开了！', '#fff0a8');
}
function levelComplete() {
  const D = G.diff;
  const timeBonus = Math.round(G.timeLeft * 12);
  const lifeBonus = G.lives * 150;
  const base = 800 + timeBonus + lifeBonus;
  const gain = Math.round(base * D.scoreMul);
  G.score += gain;
  const cell = G.diffIdx * 3 + G.li;
  const prev = best[cell];
  const total = Math.max(best[cell], G.score);
  best[cell] = total; saveBest();
  if (G.li + 1 >= LEVELS.length) unlock = Math.max(unlock, LEVELS.length); else unlock = Math.max(unlock, G.li + 2);
  saveMeta();
  G.clearInfo = {
    li: G.li, gain, timeBonus, lifeBonus, base, cell, prev,
    killed: G.killed, items: G.itemsGot, combo: G.bestCombo, score: G.score, lives: G.lives,
  };
  SFX.win();
  G.scene = 'result';
}

/* =========================================================================
 * 主更新
 * ========================================================================= */
function update(dt) {
  G.frame++;
  if (G.scene !== 'play') { updateParts(dt); return; }
  G.timeAcc += dt;
  const L = LEVELS[G.li];
  G.timeLeft -= dt;
  const ratio = G.timeLeft / G.timeMax;
  const wasHurry = G.hurry;
  G.hurry = ratio <= HURRY;
  if (G.hurry && !wasHurry) addPopup(VW / 2, 120, '时间不多了！', '#ff9a9a');
  if (G.hurry && G.frame % 60 === 0 && G.timeLeft > 0) SFX.tick();
  if (G.timeLeft <= 0) {
    G.timeLeft = 0;
    G.clearInfo = { li: G.li, gain: 0, timeout: true, killed: G.killed, items: G.itemsGot, combo: G.bestCombo, score: G.score, lives: G.lives };
    G.scene = 'fail';
    return;
  }
  if (G.deathTimer > 0) {
    G.deathTimer -= dt;
    updateParts(dt); updateDynPlats(dt);
    if (G.deathTimer <= 0) {
      if (G.lives <= 0) { G.clearInfo = { li: G.li, dead: true, killed: G.killed, items: G.itemsGot, combo: G.bestCombo, score: G.score, lives: 0 }; G.scene = 'fail'; }
      else respawn();
    }
    return;
  }
  if (G.freezeAll > 0) G.freezeAll -= dt;
  if (G.comboTimer > 0) { G.comboTimer -= dt; if (G.comboTimer <= 0) G.combo = 0; }
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 30);
  if (G.flash > 0) G.flash = Math.max(0, G.flash - dt);
  if (G.door) G.door.t += dt;

  updatePlayer(dt);
  updateShots(dt);
  updateBalls(dt);
  updateFoes(dt);
  updateEBolts(dt);
  updateItems(dt);
  updateDynPlats(dt);
  updateSpawner(dt);
  updateParts(dt);
  for (const p of G.popups) { p.t -= dt; p.y -= dt * 26; }
  G.popups = G.popups.filter(p => p.t > 0);
  lastBoom = -1;
}
function addPopup(x, y, txt, color) { G.popups.push({ x, y, txt, color, t: 1.15 }); }
function popup(x, y, txt, color) { addPopup(x, y, txt, color); }
function burst(x, y, n, color, sp) {
  for (let i = 0; i < n; i++) {
    parts.push({ x, y, vx: rrange(-sp, sp), vy: rrange(-sp, sp * 0.4), t: rrange(0.25, 0.6), color, r: rrange(1.5, 3.5) });
  }
  if (parts.length > 260) parts.splice(0, parts.length - 260);
}
function updateParts(dt) {
  for (const p of parts) {
    p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 620 * dt;
  }
  parts = parts.filter(p => p.t > 0);
}

/* =========================================================================
 * 渲染

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');

let vkeys = [];

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  DPR = Math.min(2, window.devicePixelRatio || 1);
  portrait = h > w * 1.05;
  keyStrip = portrait ? Math.min(172, h * 0.26) : 0;
  cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR);
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  S = Math.min(w / VW, (h - keyStrip) / VH);
  S = Math.min(S, 1.9);
  OX = (w - VW * S) / 2; OY = (h - keyStrip - VH * S) / 2;

}
function buildVKeys(w, h) {

  const gap = 12;
  /* 四键均分一行，且单键宽度受「(屏宽 - 边距 - 间距)/4」约束：
     早先按键高等比算宽度，390px 竖屏上「右移」与「跳」会横向重叠，

  const x0 = (w - (kw * 4 + gap * 3)) / 2;

  defs.forEach((d, i) => vkeys.push({ id: d[0], label: d[1], x: x0 + i * (kw + gap), y: y0, w: kw, h: kh }));
}

  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);

function draw() {
  uiHits = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const w = cv.width / DPR, h = cv.height / DPR;
  const bg = ctx.createLinearGradient(0, 0, 0, h);

  ctx.beginPath(); ctx.rect(-2, -2, VW + 4, VH + 4); ctx.clip();

  if (G.scene === 'menu') drawMenu();

/* ----------------------------- 场景绘制 ----------------------------- */
function drawArena() {
  const th = levelTheme;
  const sky = ctx.createLinearGradient(0, 0, 0, VH);
  sky.addColorStop(0, th.sky1); sky.addColorStop(1, th.sky2);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VW, VH);
  /* 极光带 */
  for (let i = 0; i < 3; i++) {
    ctx.globalAlpha = 0.16 + 0.05 * i;
    ctx.fillStyle = th.aurora;
    const y = 60 + i * 46 + Math.sin(G.frame * 0.008 + i) * 16;
    ctx.beginPath();
    ctx.moveTo(0, y);
    for (let x = 0; x <= VW; x += 40) ctx.lineTo(x, y + Math.sin(x * 0.012 + G.frame * 0.014 + i) * 18);
    ctx.lineTo(VW, y + 26); ctx.lineTo(0, y + 26); ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = 'rgba(255,255,255,.06)';
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y);

  ctx.lineTo(VW, GROUND_Y); ctx.closePath(); ctx.fill();

  /* 瓦片 */
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = grid[r][c];

    ctx.fillStyle = 'rgba(120,180,220,.55)'; ctx.fillRect(d.x + 2, d.y + (d.kind === 'snow' ? 9 : 6), d.w - 4, 3);
    ctx.globalAlpha = 1;

  pg.addColorStop(0, 'rgba(255,255,255,.95)'); pg.addColorStop(.5, levelTheme.aurora); pg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(PORTAL.x, PORTAL.y, 30 + Math.sin(G.frame * 0.08) * 3, 0, Math.PI * 2); ctx.fill();

}
function drawSolidTile(c, r) {

  const cx = f.x + f.w / 2, by = f.y + f.h;
  ctx.save();
  if (f.leaving) { ctx.globalAlpha = clamp(1 - f.leaveT / 0.7, 0, 1); }
  ctx.fillStyle = def.color;
  if (f.kind === 'blob') {
    const sq = 1 + Math.sin(f.anim * 8) * 0.06;
    ctx.beginPath(); ctx.ellipse(cx, by - 14 * sq, 15 / sq, 14 * sq, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(cx - 5, by - 18, 4, 0, Math.PI * 2); ctx.arc(cx + 5, by - 18, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#22314f';
    ctx.beginPath(); ctx.arc(cx - 5 + f.dir, by - 18, 2, 0, Math.PI * 2); ctx.arc(cx + 5 + f.dir, by - 18, 2, 0, Math.PI * 2); ctx.fill();
  } else if (f.kind === 'bat') {
    const flap = Math.sin(f.anim * 12) * 6;
    ctx.beginPath(); ctx.ellipse(cx, by - 13, 12, 11, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(200,225,255,.9)';
    ctx.beginPath(); ctx.ellipse(cx - 16, by - 15 + flap, 10, 5, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 16, by - 15 - flap, 10, 5, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#22314f';
    ctx.fillRect(cx - 6, by - 16, 3, 4); ctx.fillRect(cx + 3, by - 16, 3, 4);
  } else if (f.kind === 'hopper') {
    ctx.beginPath(); ctx.ellipse(cx, by - 12, 14, f.onGround ? 12 : 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(cx - 5, by - 20, 4, 0, Math.PI * 2); ctx.arc(cx + 5, by - 20, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#22314f'; ctx.fillRect(cx - 6, by - 21, 3, 3); ctx.fillRect(cx + 4, by - 21, 3, 3);
    ctx.fillStyle = def.color; ctx.fillRect(cx - 12, by - 3, 8, 4); ctx.fillRect(cx + 4, by - 3, 8, 4);
  } else {
    /* 熔火灵：预警时闪红 */
    if (f.warn > 0 && Math.floor(G.frame / 3) % 2) ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.ellipse(cx, by - 16, 13, 16, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9c9';
    ctx.beginPath(); ctx.arc(cx, by - 24, 8, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#22314f'; ctx.fillRect(cx - 5, by - 20, 3, 4); ctx.fillRect(cx + 3, by - 20, 3, 4);
    if (f.warn > 0) {
      ctx.strokeStyle = 'rgba(255,139,61,.8)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(cx + f.dir * 16, by - 20); ctx.lineTo(cx + f.dir * 40, by - 20); ctx.stroke();
    }
  }
  if (f.angry) { txt('!', cx + 14, f.y + 2, 16, '#ff6b6b', 'center', true); }
  ctx.restore();
}

  for (const [rr, c0, c1] of L.plats) if (rr === r && c >= c0 && c <= c1) return 2;
  return 0;
}

/* =========================================================================
 * 输入
 * ========================================================================= */
function setDiff(i) {
  G.diffIdx = diffIdx = clamp(i, 0, 2);
  G.diff = DIFFS[G.diffIdx]; saveMeta();
}
function beginPlay(li) {
  audioInit();
  G.lives = G.diff.lives; G.score = 0;
  startLevel(li);
}
function onAction(id) {
  if (id.startsWith('diff')) { setDiff(+id.slice(4)); return; }
  switch (id) {
    case 'start': setDiff(diffIdx); beginPlay(0); break;
    case 'levels': G.scene = 'levels'; break;
    case 'back': G.scene = 'menu'; break;
    case 'resume': G.scene = 'play'; break;
    case 'retry': startLevel(G.li); G.lives = G.diff.lives; G.score = 0; break;
    case 'quit': G.scene = 'menu'; break;
    case 'next':
      if (G.clearInfo && G.clearInfo.li >= 2) G.scene = 'clear';
      else { const nl = clamp(G.li + 1, 0, 2); startLevel(nl); }
      break;
    case 'menu2': G.scene = 'menu'; break;
    case 'again': beginPlay(G.li); break;
    case 'menu3': G.scene = 'menu'; break;
    case 'menu4': G.scene = 'menu'; break;
    case 'sound0': case 'sound': muted = !muted; if (muted && AC) { try { AC.suspend(); } catch (e) { } } else if (AC) { try { AC.resume(); } catch (e) { } } break;
    case 'speed': G.speed = G.speed >= 3 ? 1 : G.speed + 1; break;
    case 'menu': G.scene = 'pause'; break;
    default:
      if (id.startsWith('lv')) { const i = +id.slice(2); if (i + 1 <= unlock) beginPlay(i); }
  }
}
function pressKey(id, down) {
  if (id in IN) IN[id] = down;
}
function onPointerDown(e) {
  audioInit();
  const cx = e.clientX, cy = e.clientY;
  const vk = vkeys.find(k => cx >= k.x && cx <= k.x + k.w && cy >= k.y && cy <= k.y + k.h);
  if (vk) { pressKey(vk.id, true); e.preventDefault && e.preventDefault(); return; }
  const p = toLogical(cx, cy);
  /* 从最后登记的命中区往前找：后画的（叠在上层的）按钮优先命中 */
  for (let i = uiHits.length - 1; i >= 0; i--) {
    const u = uiHits[i];
    if (p.x >= u.x && p.x <= u.x + u.w && p.y >= u.y && p.y <= u.y + u.h) { onAction(u.id); return; }
  }
}
function onPointerUp(e) {
  for (const k of vkeys) if (IN[k.id]) IN[k.id] = false;
}
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump',
  KeyX: 'fire', KeyJ: 'fire', KeyK: 'fire',
};
function onKey(e, down) {
  const k = e.code;
  if (KEYMAP[k]) { pressKey(KEYMAP[k], down); e.preventDefault && e.preventDefault(); return; }
  if (!down) return;
  if (k === 'Enter') {
    if (G.scene === 'menu') onAction('start');
    else if (G.scene === 'fail') onAction('again');
    else if (G.scene === 'result') onAction('next');
  }
  if (k === 'Escape') { if (G.scene === 'play') G.scene = 'pause'; else if (G.scene === 'pause') G.scene = 'play'; else if (G.scene === 'levels') G.scene = 'menu'; }
  if (k === 'KeyM') onAction('sound');
  if (k === 'Digit1' || k === 'Digit2' || k === 'Digit3') { if (G.scene === 'menu') setDiff(+k.slice(5) - 1); }
  if (k === 'F1') G.speed = 1;
  if (k === 'F2') G.speed = 2;
  if (k === 'F3') G.speed = 3;
}
window.addEventListener('keydown', e => onKey(e, true));
window.addEventListener('keyup', e => onKey(e, false));
cv.addEventListener('pointerdown', onPointerDown);
window.addEventListener('pointerup', onPointerUp);
window.addEventListener('pointercancel', onPointerUp);
window.addEventListener('blur', () => { for (const k in IN) IN[k] = false; if (G.scene === 'play') G.scene = 'pause'; });
window.addEventListener('resize', resize);

/* =========================================================================
 * 主循环
 * ========================================================================= */
const STEP = 1 / 60;
let lastFrame = null, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrame === null) { lastFrame = ts; return; }
  let dt = (ts - lastFrame) / 1000; lastFrame = ts;
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 12) {
    for (let s = 0; s < G.speed; s++) update(STEP);
    acc -= STEP;
  }
  if (acc > STEP * 12) acc = 0;
  draw();
}
function init() {
  loadBest(); loadMeta();
  setDiff(diffIdx);
  buildLevel(0);
  player = makePlayer(LEVELS[0]);
  G.deathTimer = 0;
  G.scene = 'menu';
  resize();
}

init();
requestAnimationFrame(frame);

</script>
