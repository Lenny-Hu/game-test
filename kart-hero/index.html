// ============================================================
// 菇侠卡丁车（SHROOM KART RUSH）
// 卡丁车竞速品类的原创化网页版：名称、角色、赛道、道具美术与音效
// 全部原创程序化绘制 / 实时合成，不使用任何原作名称、图形与音频，
// 仅玩法致敬品类。与「菇侠冒险」共享同一批原创角色。
//
// - Mode 7 伪 3D 车尾追尾视角的 6 车竞速，3 圈定胜负，3 条原创赛道 × 三档难度
// - 漂移蓄力三档小喷、蘑菇/绿壳/红壳/香蕉/星星/闪电 6 种道具
// - 一切影响玩法的随机走种子 LCG，固定 1/60s 步长，可逐位重放
// - 主菜单 / 选道 / 暂停 / 结算面板与 HUD、虚拟键全部画进 Canvas
// 测试：node _test.js（无头断言赛道几何、物理边界、道具效果、
//   同输入确定性重放、面板点击流、九格纪录，以及键盘输入驱动的
//   Bot 3 赛道 × 3 难度整局夺冠与原地不动垫底）
// ============================================================

// ---- 基础工具 ----
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
function angNorm(a) { while (a > Math.PI) a -= Math.PI * 2; while (a < -Math.PI) a += Math.PI * 2; return a; }
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };

// ---- 种子随机（LCG：一切影响玩法的随机必须走这里）----
let rngSeed = 1;
function setSeed(s) { rngSeed = (s >>> 0) || 1; }
function rng() { rngSeed = (Math.imul(rngSeed, 1664525) + 1013904223) >>> 0; return rngSeed / 4294967296; }

// ---- 音频（Web Audio 实时合成，无外部文件）----
let AC = null, muted = false;
function ensureAC() {
  if (AC) { if (AC.state === 'suspended') AC.resume().catch(() => {}); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(Math.max(20, f0), t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t0 + dur);
    g.gain.setValueAtTime(vol || 0.12, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch (e) { /* noop */ }
}
const SFX = {
  select: () => tone(500, 760, 0.07, 'square', 0.09),
  back:   () => tone(420, 240, 0.09, 'square', 0.09),
  count:  (hi) => tone(hi ? 880 : 440, hi ? 880 : 440, 0.16, 'square', 0.13),
  go:     () => { tone(660, 990, 0.22, 'square', 0.13); tone(990, 1320, 0.2, 'triangle', 0.1, 0.06); },
  lap:    () => { tone(700, 700, 0.07, 'square', 0.1); tone(930, 930, 0.09, 'square', 0.1, 0.08); },
  pickup: () => { tone(560, 900, 0.09, 'triangle', 0.13); tone(900, 1250, 0.08, 'triangle', 0.09, 0.06); },
  boost:  () => { tone(150, 420, 0.34, 'sawtooth', 0.14); tone(320, 900, 0.3, 'square', 0.07); },
  rescue: () => { tone(300, 620, 0.12, 'triangle', 0.11); tone(620, 940, 0.14, 'triangle', 0.1, 0.11); },
  drift:  () => tone(180, 120, 0.1, 'sawtooth', 0.05),
  shell:  () => tone(700, 200, 0.14, 'square', 0.1),
  bounce: () => tone(500, 300, 0.05, 'square', 0.07),
  hit:    () => tone(220, 60, 0.3, 'sawtooth', 0.14),
  star:   () => { tone(660, 660, 0.07, 'square', 0.1); tone(880, 880, 0.07, 'square', 0.1, 0.08); tone(1100, 1100, 0.1, 'square', 0.1, 0.16); },
  thunder:() => tone(900, 60, 0.4, 'sawtooth', 0.16),
  slip:   () => tone(400, 150, 0.2, 'triangle', 0.11),
  wall:   () => tone(160, 90, 0.12, 'square', 0.12),
  finish: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, f, 0.16, 'square', 0.12, i * 0.11)); },
  win:    () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, f, 0.18, 'triangle', 0.14, i * 0.1)); },
  lose:   () => { [440, 370, 311, 262].forEach((f, i) => tone(f, f, 0.22, 'sawtooth', 0.1, i * 0.14)); },
  record: () => { [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, 0.12, 'square', 0.11, i * 0.09)); },
};

// ---- 引擎循环音（Web Audio 实时合成，无音频文件）----
// 两个失谐振荡器过低通：基频随速度爬升 = 「踩油门有声音」的主要反馈，加速时再抬一截并打开低通
let ENG = null;
function engineStart() {
  if (!AC || ENG) return;
  try {
    const g = AC.createGain(), f = AC.createBiquadFilter();
    const o1 = AC.createOscillator(), o2 = AC.createOscillator();
    f.type = 'lowpass'; f.frequency.value = 700;
    o1.type = 'sawtooth'; o1.frequency.value = 52;
    o2.type = 'square'; o2.frequency.value = 26; o2.detune.value = 9;
    g.gain.value = 0.0001;
    o1.connect(f); o2.connect(f); f.connect(g); g.connect(AC.destination);
    o1.start(); o2.start();
    ENG = { g, f, o1, o2 };
  } catch (e) { ENG = null; }
}
function engineStop() {
  if (!ENG) return;
  try { ENG.o1.stop(); ENG.o2.stop(); } catch (e) { /* noop */ }
  ENG = null;
}
function engineTick() {
  if (G.scene !== 'race' || G.paused || !AC || muted) { engineStop(); return; }
  engineStart();
  if (!ENG) return;
  const p = G.player, t = AC.currentTime;
  const boost = p.boostT > 0 || p.starT > 0;
  const r = clamp(Math.hypot(p.vx, p.vy) / PW.VMAX, 0, 1.35);
  const revs = 44 + r * 92 + (boost ? 34 : 0);
  ENG.o1.frequency.setTargetAtTime(revs, t, 0.05);
  ENG.o2.frequency.setTargetAtTime(revs * 0.5, t, 0.05);
  ENG.f.frequency.setTargetAtTime(560 + r * 1450 + (boost ? 850 : 0), t, 0.06);
  const vol = (G.raceState === 'racing' ? 0.03 + r * 0.05 : 0.016) * (boost ? 1.3 : 1);
  ENG.g.gain.setTargetAtTime(vol, t, 0.09);
}

// ---- 赛道定义：控制点闭环（Catmull-Rom 样条 → 等距路点）----

  candy:  { ground: '#e6b469', ground2: '#dda85c', grid: 'rgba(255,255,255,0.06)', road: '#a9743f', roadEdge: '#7c5027', kerb: '#ffe9c7', kerbAlt: '#ff5d8f', line: 'rgba(255,244,214,0.45)', wall: 'rgba(0,0,0,0)', sky: '#f0c477' },

// ---- 道具表 ----
const ITEM_LIST = ['mushroom', 'green', 'banana', 'red', 'star', 'lightning'];
const ITEM_NAME = { mushroom: '冲刺蘑菇', green: '绿龟壳', banana: '香蕉皮', red: '追踪红壳', star: '无敌星', lightning: '闪电' };
// 按名次加权（落后者拿强道具，致敬品类经典规则）
const ITEM_W = {
  1: { mushroom: 26, green: 30, banana: 26, red: 6,  star: 0,  lightning: 0  },
  2: { mushroom: 30, green: 28, banana: 22, red: 10, star: 2,  lightning: 0  },

};
function rollItem(rank) {
  const w = ITEM_W[clamp(rank, 1, 6)];
  let sum = 0; for (const k in w) sum += w[k];
  let r = rng() * sum;
  for (const k of ITEM_LIST) { r -= w[k]; if (r < 0) return k; }
  return 'mushroom';
}

// ---- 样条与赛道构建 ----
function catmullRom(p0, p1, p2, p3, t) {
  const t2 = t * t, t3 = t2 * t;
  return [
    0.5 * (2 * p1[0] + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
    0.5 * (2 * p1[1] + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3),
  ];
}
function buildTrack(idx) {
  const def = TRACKS[idx];
  const cp = def.cp, m = cp.length;
  const dense = [];
  const SEGS = 26;
  for (let j = 0; j < m; j++) {
    const p0 = cp[(j - 1 + m) % m], p1 = cp[j], p2 = cp[(j + 1) % m], p3 = cp[(j + 2) % m];
    for (let s = 0; s < SEGS; s++) dense.push(catmullRom(p0, p1, p2, p3, s / SEGS));
  }
  // 累计长度 → 等距重采样（步长约 15px）
  let total = 0;
  const cum = [0];
  for (let i = 1; i <= dense.length; i++) {
    const a = dense[i - 1], b = dense[i % dense.length];
    total += Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (i < dense.length) cum.push(total);
  }
  const n = Math.round(total / 15);
  const step = total / n;
  const pts = [];
  let di = 0;
  for (let i = 0; i < n; i++) {
    const target = i * step;
    while (di < dense.length - 2 && cum[di + 1] < target) di++;
    const a = dense[di], b = dense[(di + 1) % dense.length];
    const segLen = (cum[di + 1] !== undefined ? cum[di + 1] : total) - cum[di] || 1e-6;
    const t = clamp((target - cum[di]) / segLen, 0, 1);
    pts.push({ x: lerp(a[0], b[0], t), y: lerp(a[1], b[1], t) });
  }
  // 方向 / 法线 / 曲率半径
  const dir = [], nrm = [], ang = [], radius = [];
  for (let i = 0; i < n; i++) {
    const a = pts[(i - 1 + n) % n], b = pts[(i + 1) % n];
    const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy) || 1e-6;
    dir.push({ x: dx / L, y: dy / L });
    nrm.push({ x: -dy / L, y: dx / L });
    ang.push(Math.atan2(dy, dx));
  }
  for (let i = 0; i < n; i++) {
    const d = Math.abs(angNorm(ang[(i + 1) % n] - ang[i]));
    radius.push(d < 1e-5 ? 1e9 : step / d);
  }
  // 视觉高差（纯函数、不消耗 rng，故不影响确定性与 Bot 弹道）：
  // 只用整数谐波 → 闭环接缝处连续；物理仍在 x/y 平面上跑，高差只参与投影，负责起伏的纵深观感
  // 视觉起伏（仅影响渲染，不参与判定、不消耗 rng）：取环路整数倍频，接缝处天然连续；
  // 幅值刻意压小——追尾视角里地形起伏会整屏推拉镜头，超过 ±16 世界单位就会把车顶出画面底边
  const hgt = new Float64Array(n);
  const hs = def.decoSeed;
  for (let i = 0; i < n; i++) {
    const u = i / n * Math.PI * 2;
    hgt[i] = Math.sin(u * 3 + hs) * 8 + Math.sin(u * 5 + hs * 1.7) * 5 + Math.sin(u * 8 + hs * 0.6) * 2.5;
  }
  // 包围盒（小地图用）
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const p of pts) { minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y); }
  const T = {
    idx, name: def.name, halfW: def.halfW, par: def.par, theme: def.theme,
    n, step, wp: pts, dir, nrm, ang, radius, hgt,
    bounds: { minX, minY, maxX, maxY },
    length: total,
  };
  // 道具盒布点：曲率平缓处，每 ≥44 路点一行，避开起点 46 格
  const boxes = [];
  let last = -999;
  for (let i = 46; i < n - 20; i++) {
    if (i - last < 44) continue;
    let gentle = true;
    for (let j = -3; j <= 3; j++) if (radius[(i + j + n) % n] < 240) gentle = false;
    if (!gentle) continue;
    last = i;
    for (const off of [-0.44, 0, 0.44]) {
      boxes.push({
        x: pts[i].x + nrm[i].x * off * def.halfW,
        y: pts[i].y + nrm[i].y * off * def.halfW,
        wp: i, off, alive: true, t: 0,
      });
    }
  }
  T.boxes = boxes;
  return T;
}
// 全局最近路点（装饰审计 / 测试用；游戏内用带 hint 的窗口搜索）
function nearestWPGlobal(T, x, y) {
  let bi = 0, bd = 1e18;
  for (let i = 0; i < T.n; i++) { const d = dist2(x, y, T.wp[i].x, T.wp[i].y); if (d < bd) { bd = d; bi = i; } }
  return { idx: bi, d: Math.sqrt(bd) };
}
function nearestWP(T, x, y, hint, span) {
  const n = T.n; let bi = -1, bd = 1e18;
  for (let o = -span; o <= span; o++) {
    const i = ((hint + o) % n + n) % n;
    const d = dist2(x, y, T.wp[i].x, T.wp[i].y);
    if (d < bd) { bd = d; bi = i; }
  }
  return { idx: bi, d: Math.sqrt(bd) };
}
// 相对路点 i 的横向 / 纵向投影
function projectOn(T, i, x, y) {
  const p = T.wp[i], d = T.dir[i];
  const dx = x - p.x, dy = y - p.y;
  return { fwd: dx * d.x + dy * d.y, lat: dx * T.nrm[i].x + dy * T.nrm[i].y };
}

// ---- 持久化：难度 / 解锁 / 纪录（难度×赛道 九格）----
let bests = {};     // key: diffIdx*3+trackIdx → {score,time}
function loadBest() {
  bests = {};
  try { const raw = localStorage.getItem(BEST_KEY); if (raw) { const o = JSON.parse(raw); for (const k in o) bests[k] = o[k]; } } catch (e) { bests = {}; }
}
function saveBest() { try { localStorage.setItem(BEST_KEY, JSON.stringify(bests)); } catch (e) { /* noop */ } }
function loadDiff() {
  try { const d = localStorage.getItem(DIFF_KEY); if (d && DIFFS[d]) G.diff = d; } catch (e) { /* noop */ }
}
function saveDiff() { try { localStorage.setItem(DIFF_KEY, G.diff); } catch (e) { /* noop */ } }
let unlocked = 0;   // 已解锁的最大赛道序号
function loadUnlock() {

}
function saveUnlock() { try { localStorage.setItem(UNLOCK_KEY, String(unlocked)); } catch (e) { /* noop */ } }
const fmtTime = (t) => {
  if (t == null) return '--:--.--';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2);

// ---- 全局状态与输入 ----
const G = {
  scene: 'menu',            // menu | tracks | race | result
  diff: 'normal',
  trackIdx: 0,
  paused: false,
  speed: 1,
  track: null,
  karts: [],
  player: null,
  shells: [],
  bananas: [],
  parts: [],
  skids: [],
  decos: [],
  countdown: 0,
  raceState: 'idle',        // idle | count | racing | ending
  raceTime: 0,
  finishOrder: [],
  endTimer: 0,
  result: null,
  frame: 0,
  goFlash: 0,
  wrongWay: 0,
  rankFlash: 0,
  lastRank: 1,
  msg: null,                // {text,t}
};
const IN = { gas: false, brake: false, left: false, right: false, drift: false, item: false };
let itemWasDown = false;
let camX = 0, camY = 0;
// ---- 追尾相机（Mode 7 伪 3D；纯视觉，不参与任何判定，不消耗 rng）----
// CAM_H/CAM_DIST ≈ 0.94 决定玩家车落在屏幕 80% 高度处；焦距按屏幕尺寸自适应，竖屏手机也能铺满路宽
const CAM_H = 90, CAM_DIST = 96, CAM_NEAR = 14, CAM_FAR = 1250;
const CAM_MAX_LAG = 0.42;                 // 相机与车头的最大滞后（rad）：超过就强制追上，杜绝被甩到侧面
let camAng = 0, camRoll = 0, camFocal = 330, horizonY = 320;
function screenFocal() { return Math.max(CW * 0.254, CH * 0.40); }
// 世界坐标 → 屏幕坐标（h 为该点离地高度，地面为 0）
// 除了深度远近还要按视场角横向剔除：赛道是闭环，环路另一侧在深度上完全合法却跑到画面外几千像素，
// 不剔除的话跨过去的四边形会拉成贯穿屏幕的黑色尖刺
// loose=true 跳过视场角剔除，只用于路面截面（中心线 + 左右端点）：近处路面比视场宽得多，边缘一被剔掉
// 整块四边形就不画，车头底下会冒出「路面漏成草地」的洞；路面改由 drawRoad 按整个截面的屏幕跨度来剔除
function proj(wx, wy, h, loose) {
  const dx = wx - camX, dy = wy - camY;
  const ca = Math.cos(camAng), sa = Math.sin(camAng);
  const Z = dx * ca + dy * sa;
  if (Z < CAM_NEAR || Z > CAM_FAR) return null;
  const X = -dx * sa + dy * ca;
  if (!loose && Math.abs(X) * camFocal > CW * Z) return null;
  const iz = camFocal / Z;
  return { x: CW / 2 + X * iz, y: horizonY + (CAM_H - (h || 0)) * iz, z: Z, s: iz };
}

// ---- 卡丁车 ----
function makeKart(chIdx, isPlayer) {
  return {
    ch: chIdx, isPlayer: !!isPlayer,
    x: 0, y: 0, heading: 0,
    vx: 0, vy: 0,
    speedF: 0, speedL: 0,
    wp: 0, lap: 0, prog: 0, place: 1,
    finished: false, finishTime: null, finishPlace: 0,
    item: null, aiItemT: 0,
    boostT: 0, starT: 0, shrinkT: 0, spinT: 0, invulnT: 0,
    driftOn: false, driftT: 0, driftDir: 0, driftSpark: 0,
    offroad: false, bumpT: 0, stuckT: 0, snapFlash: 0,
    ai: false, laneOff: 0, phase: 0, aiStuckT: 0, aiSpeedMul: 1,
    inp: { gas: false, brake: false, left: false, right: false, drift: false },
    totalSpin: 0, maxBoost: 0, shellsFired: 0, itemsUsed: 0,
  };
}
function kartVmax(k) {
  const D = DIFFS[G.diff];
  let v = PW.VMAX * (k.isPlayer ? 1 : D.aiMul * k.aiSpeedMul);
  if (k.shrinkT > 0) v *= PW.SHRINK_VMAX;
  if (k.starT > 0) v = Math.max(v, PW.STAR_VMAX);
  if (k.boostT > 0) v = Math.max(v, PW.BOOST_VMAX);
  return v;
}

// ---- 开跑 ----
function startRace(trackIdx) {
  G.trackIdx = trackIdx;
  const diffIdx = DIFF_ORDER.indexOf(G.diff);
  setSeed(20260928 + trackIdx * 7919 + diffIdx * 104729);
  G.track = buildTrack(trackIdx);
  const T = G.track;
  G.karts = []; G.shells = []; G.bananas = []; G.parts = []; G.skids = [];
  G.finishOrder = []; G.raceTime = 0; G.endTimer = 0; G.result = null;
  G.raceState = 'count'; G.countdown = 3.4; G.goFlash = 0; G.frame = 0;
  G.paused = false; G.wrongWay = 0; G.msg = null; G.lastRank = 1;
  // 复活点/出生格：起点线（wp0）后方 6 格起，两列三排
  for (let r = 0; r < N_RACERS; r++) {
    const k = makeKart(r, r === 0);
    const row = Math.floor(r / 2), col = r % 2;
    const gi = (T.n - 8 - row * 7 + T.n) % T.n;
    const p = T.wp[gi];
    const side = (col === 0 ? -1 : 1) * T.halfW * 0.42;
    k.x = p.x + T.nrm[gi].x * side;
    k.y = p.y + T.nrm[gi].y * side;
    k.heading = T.ang[gi];
    k.wp = gi;
    if (!k.isPlayer) {
      k.ai = true;
      k.laneOff = (rng() - 0.5) * T.halfW * 1.1;
      k.phase = rng() * Math.PI * 2;
      k.aiSpeedMul = 1;
    }
    G.karts.push(k);
  }
  G.player = G.karts[0];
  // 装饰物：路外 60~280px 随机散布（种子确定）
  G.decos = [];
  const types = DECO_TYPES[T.theme];
  for (let i = 4; i < T.n; i += 7) {
    if (rng() < 0.42) continue;
    const side = rng() < 0.5 ? -1 : 1;
    const off = T.halfW + PW.WALL_OFF + 26 + rng() * 220;
    G.decos.push({
      x: T.wp[i].x + T.nrm[i].x * off * side,
      y: T.wp[i].y + T.nrm[i].y * off * side,
      type: types[Math.floor(rng() * types.length)],
      s: 0.75 + rng() * 0.7,
      seed: rng(),
      wp: i,
    });
  }
  for (const b of T.boxes) { b.alive = true; b.t = 0; }
  // 相机初始就落在车尾正后方，避免开赛第一帧从世界原点甩过来
  camAng = G.player.heading;
  camX = G.player.x - Math.cos(camAng) * CAM_DIST;
  camY = G.player.y - Math.sin(camAng) * CAM_DIST;
  camRoll = 0; camFocal = screenFocal();
  G.scene = 'race';
  updateProgressAll();
}

// ---- 物理：单卡一步（玩家与 AI 共用同一模型）----
function kartPhysics(k, dt) {
  const T = G.track, inp = k.inp;
  if (k.spinT > 0) {
    k.spinT -= dt;
    k.heading += PW.SPIN_RATE * dt * (k.spinDir || 1);
    k.vx *= Math.exp(-3.2 * dt); k.vy *= Math.exp(-3.2 * dt);
    k.x += k.vx * dt; k.y += k.vy * dt;
    if (k.spinT <= 0) { k.spinT = 0; k.invulnT = Math.max(k.invulnT, PW.SPIN_INVULN); }
  } else {
    const spd = Math.hypot(k.vx, k.vy);
    const fwdSign = k.speedF >= -5 ? 1 : -1;
    // 漂移状态机
    const wantDrift = !k.finished && inp.drift && k.speedF > PW.DRIFT_MIN_SPD && (inp.left || inp.right) && k.spinT <= 0;
    if (!k.driftOn && wantDrift) {
      k.driftOn = true; k.driftT = 0;
      k.driftDir = inp.left ? -1 : 1;
    }
    if (k.driftOn && (!inp.drift || k.speedF < PW.DRIFT_EXIT_SPD || k.finished)) {
      // 松手结算小喷
      let tier = 0;
      if (k.driftT >= PW.DRIFT_T[2]) tier = 3; else if (k.driftT >= PW.DRIFT_T[1]) tier = 2; else if (k.driftT >= PW.DRIFT_T[0]) tier = 1;
      if (tier > 0) {
        k.boostT = Math.max(k.boostT, PW.DRIFT_BOOST[tier - 1]);
        k.maxBoost = Math.max(k.maxBoost, tier);
        if (k.isPlayer) { SFX.boost(); spawnBoostFx(k, tier); }
      }
      k.driftOn = false; k.driftT = 0;
    }
    if (k.driftOn) {
      k.driftT += dt;
      k.driftSpark += dt;
      if (k.isPlayer && k.driftSpark > 0.25 && k.driftT > PW.DRIFT_T[0]) { k.driftSpark = 0; SFX.drift(); }
    }
    // 转向
    let steer = (inp.left ? -1 : 0) + (inp.right ? 1 : 0);
    if (k.driftOn && steer === 0) steer = k.driftDir * 0.55;
    const steerEff = PW.STEER * clamp(k.speedF / 95, 0, 1) * (k.driftOn ? PW.STEER_DRIFT_MUL : 1) * (k.shrinkT > 0 ? 1.18 : 1);
    k.heading += steer * steerEff * dt * (k.speedF < -5 ? -1 : 1);
    // 分解到车身坐标系
    const ch = Math.cos(k.heading), sh = Math.sin(k.heading);
    let fwd = k.vx * ch + k.vy * sh;
    let lat = -k.vx * sh + k.vy * ch;
    const vmax = k.offroad ? Math.min(kartVmax(k), PW.OFF_VMAX) : kartVmax(k);
    if (!k.finished || fwd > 170) {
      if (inp.gas && fwd < vmax) fwd += (PW.ACCEL + (k.boostT > 0 ? PW.BOOST_ACCEL : 0)) * dt;
      if (inp.brake) {
        if (fwd > 10) fwd -= PW.BRAKE * dt;
        else fwd = Math.max(fwd - PW.ACCEL * 0.6 * dt, -PW.REV_MAX);
      }
    } else if (k.finished) {
      fwd -= PW.COAST_DRAG * dt;
    }
    if (!inp.gas && !inp.brake && fwd > 0) fwd = Math.max(0, fwd - PW.COAST_DRAG * dt);
    fwd *= Math.exp(-PW.DRAG_K * dt * 0.35);
    if (fwd > vmax) fwd = Math.max(vmax, fwd - 420 * dt);
    if (k.offroad && fwd > PW.OFF_VMAX) fwd = Math.max(PW.OFF_VMAX, fwd - PW.GRASS_DRAG * dt);
    // 侧向抓地（漂移时抓地低 → 甩尾）
    lat *= Math.exp(-(k.driftOn ? PW.GRIP_DRIFT : PW.GRIP) * dt);
    k.speedF = fwd; k.speedL = lat;
    k.vx = fwd * ch - lat * sh;
    k.vy = fwd * sh + lat * ch;
    k.x += k.vx * dt; k.y += k.vy * dt;
  }
  // 计时器
  if (k.boostT > 0) k.boostT = Math.max(0, k.boostT - dt);
  if (k.starT > 0) {
    k.starT = Math.max(0, k.starT - dt);
    if (k.starT === 0 && k.isPlayer) G.msg = null;
  }
  if (k.shrinkT > 0) k.shrinkT = Math.max(0, k.shrinkT - dt);
  if (k.invulnT > 0) k.invulnT = Math.max(0, k.invulnT - dt);
  if (k.bumpT > 0) k.bumpT = Math.max(0, k.bumpT - dt);
  if (k.snapFlash > 0) k.snapFlash = Math.max(0, k.snapFlash - dt);
  // 出界 / 撞墙
  const near = nearestWP(T, k.x, k.y, k.nearHint === undefined ? k.wp : k.nearHint, 12);
  k.nearHint = near.idx;
  const pr = projectOn(T, near.idx, k.x, k.y);
  const ad = Math.abs(pr.lat);
  k.offroad = ad > T.halfW;
  const WALL = T.halfW + PW.WALL_OFF;
  if (ad > WALL) {
    const s = pr.lat > 0 ? 1 : -1;
    const nx = T.nrm[near.idx].x * s, ny = T.nrm[near.idx].y * s;
    k.x = T.wp[near.idx].x + T.dir[near.idx].x * pr.fwd + nx * (WALL - 3);
    k.y = T.wp[near.idx].y + T.dir[near.idx].y * pr.fwd + ny * (WALL - 3);
    const vn = k.vx * nx + k.vy * ny;
    if (vn > 0) { k.vx -= 1.35 * vn * nx; k.vy -= 1.35 * vn * ny; }
    k.vx *= PW.WALL_LOSS; k.vy *= PW.WALL_LOSS;
    k.speedF *= PW.WALL_LOSS;
    if (k.bumpT <= 0) {
      k.bumpT = 0.25;
      if (k.driftOn) { k.driftOn = false; k.driftT = 0; }
      if (k.isPlayer) { SFX.wall(); spawnSparks(k.x + nx * 14, k.y + ny * 14, 6); }
    }
  }
  // 脱困：越出赛道时先闪几下再自动摆回赛道中线。
  // 两档触发：越过路肩（deep）不看车速、攒得更快——撞晕甩到草地上时玩家多半没踩油门，
  // 若还要求低速+油门，就真的一直卡在墙根；只是压到路肩外则维持原节奏（低速才帮，别抢正常跑线的自由）。
  // 油门意图只决定「回位后给不给那一脚推力」，不决定回不回位——放任不动的玩家会被摆回中线但得不到前进（§11 原地不动必败）
  const wantGas = k.isPlayer ? k.inp.gas : true;
  const edge = T.halfW - 8, deep = T.halfW + PW.RESCUE_DEEP;
  if (!k.finished && G.raceState === 'racing' && ad > edge &&
      (ad > deep || (k.spinT <= 0 && Math.hypot(k.vx, k.vy) < PW.RESCUE_SPD))) {
    k.stuckT += dt * (ad > deep ? 1.7 : 1);
    if (k.stuckT >= PW.RESCUE_T) snapToTrack(k, near.idx, pr.fwd, wantGas);
  } else if (k.spinT <= 0) {
    k.stuckT = Math.max(0, k.stuckT - dt * 2.5);
  }
  // 进度推进（越过 wp[wp+1] 的垂直平面即前进）
  for (let guard = 0; guard < 4; guard++) {
    const nxt = (k.wp + 1) % T.n;
    const d = projectOn(T, nxt, k.x, k.y);
    if (d.fwd >= 0 && Math.abs(d.lat) < T.halfW + PW.WALL_OFF + 24) {
      k.wp = nxt;
      if (nxt === 0) {
        k.lap++;
        if (k.lap >= LAPS && !k.finished) finishKart(k);
        else if (!k.finished && k.isPlayer) { SFX.lap(); flashMsg('第 ' + Math.min(k.lap + 1, LAPS) + ' 圈'); }
      }
    } else break;
  }
  const pf = projectOn(T, k.wp, k.x, k.y);
  k.prog = k.lap * T.n + k.wp + clamp(pf.fwd / T.step, 0, 1.2);
  // 逆行提示（仅玩家）
  if (k.isPlayer && !k.finished && G.raceState === 'racing') {
    const dv = k.vx * T.dir[k.wp].x + k.vy * T.dir[k.wp].y;
    G.wrongWay = (dv < -70 && Math.hypot(k.vx, k.vy) > 90) ? 0.6 : Math.max(0, G.wrongWay - dt);
  }
  // 尾焰 / 漂移烟 / 胎痕
  if (k.boostT > 0 && G.frame % 2 === 0) spawnBoostTrail(k);
  if (k.driftOn && Math.abs(k.speedL) > 40 && G.skids.length < 900) {
    const ch = Math.cos(k.heading), sh = Math.sin(k.heading);
    G.skids.push({ x: k.x - ch * 13 - sh * 9, y: k.y - sh * 13 + ch * 9, t: 3 });
    G.skids.push({ x: k.x - ch * 13 + sh * 9, y: k.y - sh * 13 - ch * 9, t: 3 });
  }
}

function finishKart(k) {
  k.finished = true;
  k.finishTime = G.raceTime;
  k.finishPlace = G.finishOrder.length + 1;
  G.finishOrder.push(k);
  if (k.isPlayer) {
    SFX.finish();
    if (k.finishPlace === 1) SFX.win(); else SFX.lose();
    G.raceState = 'ending';
    spawnConfetti(k.x, k.y);
  }
}
function flashMsg(text) { G.msg = { text, t: 1.6 }; }

// ---- 道具逻辑 ----
function useItem(k) {
  if (!k.item || k.spinT > 0) return false;
  const it = k.item;
  k.item = null;
  k.itemsUsed++;
  if (it === 'mushroom') {
    k.boostT = Math.max(k.boostT, PW.MUSH_BOOST_T);
    k.maxBoost = Math.max(k.maxBoost, 4);
    if (k.isPlayer) SFX.boost();
    spawnBoostFx(k, 3);
  } else if (it === 'green' || it === 'red') {
    spawnShell(k, it);
  } else if (it === 'banana') {
    dropBanana(k);
  } else if (it === 'star') {
    k.starT = PW.STAR_T;
    k.invulnT = Math.max(k.invulnT, PW.STAR_T);
    k.spinT = 0;
    if (k.isPlayer) { SFX.star(); flashMsg('无敌星！'); }
  } else if (it === 'lightning') {
    if (k.isPlayer) SFX.thunder();
    for (const o of G.karts) {
      if (o !== k && !o.finished && o.starT <= 0) {
        o.shrinkT = PW.SHRINK_T;
        o.spinT = 0;
        o.vx *= 0.5; o.vy *= 0.5; o.speedF *= 0.5;
      }
    }
  }
  return true;
}
function spawnShell(k, type) {
  const ch = Math.cos(k.heading), sh = Math.sin(k.heading);
  // 红壳：找前方进度最高且比自己靠前的最近目标
  let target = null;
  if (type === 'red') {
    let bd = 1e9;
    for (const o of G.karts) {
      if (o === k || o.finished) continue;
      if (o.prog <= k.prog) continue;
      const gap = o.prog - k.prog;
      if (gap < bd) { bd = gap; target = o; }
    }
  }
  G.shells.push({
    type, owner: k, target,
    x: k.x + ch * 30, y: k.y + sh * 30,
    vx: ch * (type === 'red' ? RED_SPD : SHELL_SPD),
    vy: sh * (type === 'red' ? RED_SPD : SHELL_SPD),
    life: SHELL_LIFE, bounces: 0, age: 0, hint: k.wp, spin: 0,
  });
  k.shellsFired++;
  if (k.isPlayer) SFX.shell();
}
function dropBanana(k) {
  const ch = Math.cos(k.heading), sh = Math.sin(k.heading);
  G.bananas.push({ x: k.x - ch * 36, y: k.y - sh * 36, owner: k, t: 0, rot: rng() * Math.PI });
  if (k.isPlayer) SFX.slip();
}
function killShell(s, boom) {
  s.dead = true;
  if (boom) spawnSparks(s.x, s.y, 8);
}
function spinOut(k) {
  if (k.starT > 0 || k.invulnT > 0 || k.finished) return false;
  k.spinT = PW.SPIN_T;
  k.spinDir = rng() < 0.5 ? -1 : 1;
  k.totalSpin++;
  k.item = null;
  k.driftOn = false; k.driftT = 0; k.boostT = 0;
  if (k.isPlayer) { SFX.hit(); flashMsg('打转了！'); }
  spawnSparks(k.x, k.y, 10);
  return true;
}
// 脱困回位：只把「横向偏移」拉回赛道中线，沿轨弧位原样保留（clamp 在一个路点间距内），
// 所以既不会绕过计圈逻辑，也不可能被用来抄近道。
// 刻意不消耗 rng()——脱困是恢复机制，不该把整局随机序列带偏
function snapToTrack(k, idx, fwd, pop) {
  const T = G.track, w = T.wp[idx], d = T.dir[idx];
  const f = clamp(fwd, 0, T.step);
  k.x = w.x + d.x * f;
  k.y = w.y + d.y * f;
  k.heading = T.ang[idx];
  k.speedF = pop ? PW.RESCUE_POP : 0; k.speedL = 0;
  k.vx = Math.cos(k.heading) * k.speedF;
  k.vy = Math.sin(k.heading) * k.speedF;
  k.spinT = 0; k.driftOn = false; k.driftT = 0; k.stuckT = 0;
  k.nearHint = idx;
  k.invulnT = Math.max(k.invulnT, PW.RESCUE_INVULN);
  k.snapFlash = 0.6;
  if (k.isPlayer) { SFX.rescue(); flashMsg('回到赛道'); }
  spawnSparks(k.x, k.y, 8);
}

// ---- AI 决策 ----
function aiThink(k, dt) {
  const T = G.track, inp = k.inp, D = DIFFS[G.diff];
  inp.gas = inp.brake = inp.left = inp.right = inp.drift = false;
  if (k.spinT > 0) return;
  if (k.finished) {
    // 冲线后减速绕场
    const nxt = (k.wp + 6) % T.n;
    const want = Math.atan2(T.wp[nxt].y - k.y, T.wp[nxt].x - k.x);
    const diff = angNorm(want - k.heading);
    inp.left = diff < -0.06; inp.right = diff > 0.06;
    inp.gas = k.speedF < 170;
    return;
  }
  // 橡皮筋：与玩家进度差决定 AI 速度倍率
  const lapN = T.n;
  const gapLaps = (G.player.prog - k.prog) / lapN;
  k.aiSpeedMul = 1 + D.catchup * clamp(gapLaps, -1, 1) * (k.isPlayer ? 0 : 1);
  // 卡死自救
  k.aiStuckT = (k.speedF < 45) ? k.aiStuckT + dt : 0;
  const stuck = k.aiStuckT > 1.4;
  if (stuck) k.aiStuckT = 0;
  // 瞄准点：前视路点 + 车道偏移
  const look = stuck ? 3 : 5 + Math.floor(Math.abs(k.speedF) / 52);
  const ti = (k.wp + look) % T.n;
  const lane = stuck ? 0 : k.laneOff + Math.sin(G.raceTime * 0.8 + k.phase) * 13;
  const tx = T.wp[ti].x + T.nrm[ti].x * lane;
  const ty = T.wp[ti].y + T.nrm[ti].y * lane;
  let want = Math.atan2(ty - k.y, tx - k.x);
  let diff = angNorm(want - k.heading);
  const j = Math.sin(G.raceTime * 1.7 + k.phase * 3) * 0.05 * D.jit;
  inp.left = diff < -0.05 + j;
  inp.right = diff > 0.05 + j;
  // 弯速控制：前探最小曲率半径 → 目标速度
  let minR = 1e9;
  for (let s = 1; s <= 26; s += 2) {
    const r = T.radius[(k.wp + s) % T.n];
    if (r < minR) minR = r;
  }
  const vmaxEff = PW.VMAX * D.aiMul * k.aiSpeedMul * (k.shrinkT > 0 ? PW.SHRINK_VMAX : 1);
  const target = Math.min(vmaxEff, Math.sqrt(AI_LAT * Math.max(60, minR)));
  inp.gas = k.speedF < target || stuck;
  inp.brake = !inp.gas && k.speedF > target * 1.13;
  // 道具使用
  aiUseItem(k, dt);
}
function aiUseItem(k, dt) {
  if (!k.item) { k.aiItemT = 0; return; }
  k.aiItemT += dt;
  if (k.aiItemT < 0.9) return;
  const it = k.item;
  let fire = false;
  if (it === 'star' || it === 'lightning') fire = true;
  else if (it === 'mushroom') fire = k.speedF > 240 && rng() < 0.05;
  else if (it === 'banana') {
    // 领先且身后 500px 内有人 → 丢
    let threat = false;
    for (const o of G.karts) {
      if (o === k || o.finished) continue;
      const gap = k.prog - o.prog;
      if (gap > 0 && gap < 40 && dist2(o.x, o.y, k.x, k.y) < 500 * 500) threat = true;
    }
    fire = (k.place <= 2 && threat) || rng() < 0.006;
  } else { // 龟壳：前方扇形内有人
    let aimed = false;
    for (const o of G.karts) {
      if (o === k || o.finished || o.starT > 0) continue;
      const dx = o.x - k.x, dy = o.y - k.y;
      const d = Math.hypot(dx, dy);
      if (d < 640 && Math.abs(angNorm(Math.atan2(dy, dx) - k.heading)) < 0.42) aimed = true;
    }
    fire = aimed || rng() < 0.004;
  }
  if (fire) { useItem(k); k.aiItemT = 0; }
}

// ---- 玩家输入（键盘 IN → 卡丁车）----
let driftWasDown = false;
function playerInput(k) {
  const inp = k.inp;
  if (k.finished) { inp.gas = inp.brake = inp.left = inp.right = inp.drift = false; return; }
  inp.gas = IN.gas || (lastTouch && !IN.brake); inp.brake = IN.brake;
  inp.left = IN.left; inp.right = IN.right;
  inp.drift = IN.drift;
  if (IN.item && !itemWasDown) useItem(k);
  itemWasDown = IN.item;
}

// ---- 碰撞与实体更新 ----
function updateShells(dt) {
  const T = G.track;
  for (const s of G.shells) {
    if (s.dead) continue;
    s.age += dt; s.life -= dt; s.spin += dt * 9;
    if (s.life <= 0) { killShell(s, false); continue; }
    if (s.type === 'red') {
      // 目标失效则换最近的前方目标
      if (!s.target || s.target.finished || s.target.starT > 0 || s.target === s.owner) {
        s.target = null;
        let bd = 1e9;
        for (const o of G.karts) {
          if (o === s.owner || o.finished || o.starT > 0) continue;
          if (o.prog <= s.owner.prog) continue;
          const gap = o.prog - s.owner.prog;
          if (gap < bd) { bd = gap; s.target = o; }
        }
      }
      if (s.target) {
        const want = Math.atan2(s.target.y - s.y, s.target.x - s.x);
        const cur = Math.atan2(s.vy, s.vx);
        const nd = angNorm(want - cur);
        const turn = clamp(nd, -5.2 * dt, 5.2 * dt);
        const na = cur + turn;
        const spd = Math.hypot(s.vx, s.vy);
        s.vx = Math.cos(na) * spd; s.vy = Math.sin(na) * spd;
      }
    }
    s.x += s.vx * dt; s.y += s.vy * dt;
    // 墙壁反弹（绿壳弹，红壳撞墙消失）
    const near = nearestWP(T, s.x, s.y, s.hint, 14);
    s.hint = near.idx;
    const pr = projectOn(T, near.idx, s.x, s.y);
    const WALL = T.halfW + 6;
    if (Math.abs(pr.lat) > WALL) {
      if (s.type === 'red') { killShell(s, true); continue; }
      s.bounces++;
      if (s.bounces > SHELL_BOUNCE_MAX) { killShell(s, true); continue; }
      const sg = pr.lat > 0 ? 1 : -1;
      const nx = T.nrm[near.idx].x * sg, ny = T.nrm[near.idx].y * sg;
      const vn = s.vx * nx + s.vy * ny;
      if (vn > 0) { s.vx -= 2 * vn * nx; s.vy -= 2 * vn * ny; }
      s.x -= nx * (Math.abs(pr.lat) - WALL + 2);
      s.y -= ny * (Math.abs(pr.lat) - WALL + 2);
      if (s.owner.isPlayer) SFX.bounce();
    }
    // 命中判定
    for (const k of G.karts) {
      if (k === s.owner && s.age < 0.35) continue;
      if (k.finished) continue;
      if (dist2(k.x, k.y, s.x, s.y) < (KART_R + SHELL_R) * (KART_R + SHELL_R)) {
        if (k.starT > 0) { killShell(s, true); continue; }
        if (spinOut(k)) killShell(s, true);
        else killShell(s, false);
      }
    }
  }
  G.shells = G.shells.filter(s => !s.dead);
}
function updateBananas(dt) {
  for (const b of G.bananas) {
    b.t += dt;
    if (b.dead) continue;
    for (const k of G.karts) {
      if (k.finished) continue;
      if (k === b.owner && b.t < 1.0) continue;
      if (dist2(k.x, k.y, b.x, b.y) < (KART_R + BANANA_R) * (KART_R + BANANA_R)) {
        if (k.starT > 0) { b.dead = true; spawnSparks(b.x, b.y, 5); continue; }
        if (spinOut(k)) { b.dead = true; if (k.isPlayer) SFX.slip(); }
      }
    }
  }
  G.bananas = G.bananas.filter(b => !b.dead);
}
function updateBoxes(dt) {
  for (const b of G.track.boxes) {
    if (!b.alive) { b.t -= dt; if (b.t <= 0) b.alive = true; continue; }
    b.t += dt;
    for (const k of G.karts) {
      if (k.finished || k.item) continue;
      if (dist2(k.x, k.y, b.x, b.y) < BOX_R * BOX_R) {
        b.alive = false; b.t = BOX_RESPAWN;
        k.item = rollItem(k.place);
        if (k.isPlayer) { SFX.pickup(); flashMsg(ITEM_NAME[k.item]); }
        spawnSparks(b.x, b.y, 6);
        break;
      }
    }
  }
}
function kartCollisions() {
  const ks = G.karts;
  for (let i = 0; i < ks.length; i++) {
    for (let j = i + 1; j < ks.length; j++) {
      const a = ks[i], b = ks[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy);
      const minD = KART_R * 2 * (a.shrinkT > 0 || b.shrinkT > 0 ? 0.72 : 1);
      if (d < minD && d > 1e-6) {
        const nx = dx / d, ny = dy / d, ov = (minD - d) / 2;
        a.x -= nx * ov; a.y -= ny * ov;
        b.x += nx * ov; b.y += ny * ov;
        // 动量交换
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          a.vx += vn * nx * 0.6; a.vy += vn * ny * 0.6;
          b.vx -= vn * nx * 0.6; b.vy -= vn * ny * 0.6;
          a.speedF = Math.hypot(a.vx, a.vy) * (a.speedF < 0 ? -1 : 1);
          b.speedF = Math.hypot(b.vx, b.vy) * (b.speedF < 0 ? -1 : 1);
        }
        // 星星撞飞
        if (a.starT > 0 && b.starT <= 0) spinOut(b);
        else if (b.starT > 0 && a.starT <= 0) spinOut(a);
      }
    }
  }
}
function updateProgressAll() {
  for (const k of G.karts) {
    const pf = projectOn(G.track, k.wp, k.x, k.y);
    k.prog = k.lap * G.track.n + k.wp + clamp(pf.fwd / G.track.step, 0, 1.2);
  }
}
function computeRanks() {
  const sorted = G.karts.slice().sort((a, b) => {
    if (a.finished && b.finished) return a.finishPlace - b.finishPlace;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return b.prog - a.prog;
  });
  for (let i = 0; i < sorted.length; i++) {
    const k = sorted[i];
    const np = i + 1;
    if (!k.finished && k.isPlayer && np !== k.place) {
      if (np < k.place) { G.rankFlash = 1; SFX.select(); }
      k.place = np;
    } else k.place = np;
  }
  return sorted;
}

// ---- 粒子（纯视觉，可 Math.random）----
function spawnSparks(x, y, cnt) {
  for (let i = 0; i < cnt; i++) {
    const a = Math.random() * Math.PI * 2, s = 40 + Math.random() * 120;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.35 + Math.random() * 0.3, max: 0.5, col: ['#ffd23e', '#ff8c42', '#fff'][i % 3], r: 2 + Math.random() * 2.5 });
  }
}
function spawnBoostFx(k, tier) {
  const cols = ['#7de3ff', '#ffb347', '#ff6b6b', '#ffe066'];
  for (let i = 0; i < 8 + tier * 4; i++) {
    const a = k.heading + Math.PI + (Math.random() - 0.5) * 1.2, s = 60 + Math.random() * 140;
    G.parts.push({ x: k.x, y: k.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.3 + Math.random() * 0.3, max: 0.5, col: cols[clamp(tier, 1, 4) - 1 + (Math.random() < 0.4 ? 1 : 0)] || cols[0], r: 2.5 + Math.random() * 3 });
  }
}
function spawnBoostTrail(k) {
  const a = k.heading + Math.PI + (Math.random() - 0.5) * 0.5;
  G.parts.push({ x: k.x + Math.cos(k.heading) * -18, y: k.y + Math.sin(k.heading) * -18, vx: Math.cos(a) * 30, vy: Math.sin(a) * 30, t: 0.25, max: 0.25, col: k.starT > 0 ? '#ffe066' : '#7de3ff', r: 3.5 });
}
function spawnConfetti(x, y) {
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 220;
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0.8 + Math.random() * 0.8, max: 1.6, col: ['#ff6b6b', '#ffd23e', '#4ecdc4', '#ab6fd8', '#7de3ff'][i % 5], r: 2 + Math.random() * 3 });
  }
}
function updateParts(dt) {
  for (const p of G.parts) { p.t -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; }
  G.parts = G.parts.filter(p => p.t > 0);
  if (G.parts.length > 400) G.parts.splice(0, G.parts.length - 400);
  for (const s of G.skids) s.t -= dt;
  if (G.skids.length > 900) G.skids.splice(0, G.skids.length - 900);
  G.skids = G.skids.filter(s => s.t > 0);
}

// ---- 结算 ----
function computeResults() {
  const T = G.track;
  const sorted = computeRanks();
  const rows = sorted.map(k => ({
    ch: k.ch, name: CHARS[k.ch].name, isPlayer: k.isPlayer,
    place: k.finished ? k.finishPlace : k.place,
    time: k.finished ? k.finishTime : null,
    finished: k.finished,
  })).sort((a, b) => a.place - b.place);
  const p = G.player;
  const place = rows.find(r => r.isPlayer).place;
  const D = DIFFS[G.diff];
  const parTotal = T.par * LAPS * D.timeMul;
  const timeBonus = p.finished ? Math.max(0, Math.ceil((parTotal - p.finishTime) * 2)) : 0;
  const score = Math.round((PLACE_PTS[place - 1] + timeBonus) * D.scoreMul);
  // 纪录（难度×赛道 九格）
  const key = DIFF_ORDER.indexOf(G.diff) * TRACKS.length + G.trackIdx;
  const old = bests[key];
  const isNew = !old || score > old.score;
  if (isNew) {
    bests[key] = { score, time: p.finished ? Math.round(p.finishTime * 100) / 100 : (old ? old.time : null) };
    if (old && old.time != null && p.finished) bests[key].time = Math.min(old.time, Math.round(p.finishTime * 100) / 100);
    saveBest();
  }
  // 夺冠解锁下一赛道
  let unlockedNext = false;
  if (place === 1 && G.trackIdx + 1 > unlocked && G.trackIdx + 1 < TRACKS.length) {
    unlocked = G.trackIdx + 1;
    saveUnlock();
    unlockedNext = true;
  }
  G.result = { rows, place, score, timeBonus, isNew, unlockedNext, time: p.finishTime };
  if (isNew) SFX.record();
  G.scene = 'result';
}

// ---- 主更新 ----
function update(dt) {
  G.frame++;
  if (G.scene !== 'race' || G.paused) return;
  if (G.raceState === 'count') {
    const before = Math.ceil(G.countdown - 0.4);
    G.countdown -= dt;
    const after = Math.ceil(G.countdown - 0.4);
    if (after !== before && after >= 1 && after <= 3) SFX.count(false);
    if (G.countdown <= 0) {
      G.raceState = 'racing';
      G.goFlash = 0.8;
      SFX.go();
    }
    // 倒计时期间允许轰油门原地转，但不位移
    for (const k of G.karts) {
      k.inp.gas = k.inp.brake = k.inp.left = k.inp.right = k.inp.drift = false;
    }
    return;
  }
  if (G.raceState === 'racing' || G.raceState === 'ending') {
    G.raceTime += dt;
    if (G.goFlash > 0) G.goFlash -= dt;
    if (G.msg) { G.msg.t -= dt; if (G.msg.t <= 0) G.msg = null; }
    if (G.rankFlash > 0) G.rankFlash -= dt;
    for (const k of G.karts) {
      if (k.isPlayer) playerInput(k);
      else aiThink(k, dt);
      kartPhysics(k, dt);
    }
    updateShells(dt);
    updateBananas(dt);
    updateBoxes(dt);
    kartCollisions();
    computeRanks();
    updateParts(dt);
    // 追尾相机（Mode 7 伪 3D；纯视觉）
    const p = G.player;
    const spd = Math.hypot(p.vx, p.vy);
    // 目标朝向：车头为主，掺入实际速度方向 → 漂移甩尾时相机滞后，侧滑感更明显（掺入量与滞后量都有上限）
    let wantAng = p.heading;
    if (spd > 40) {
      const slip = clamp(angNorm(Math.atan2(p.vy, p.vx) - p.heading), -0.6, 0.6);
      wantAng = p.heading + slip * 0.34;
    }
    // 被道具打转时车头疯转，相机若跟着转会被甩到侧面 → 冻结朝向，让车在画面里自旋
    if (p.spinT > 0) wantAng = camAng;
    let lag = angNorm(wantAng - camAng);
    const rate = 11 + Math.min(Math.abs(lag), 1.6) * 16;   // 滞后越大追得越急
    camAng += lag * (1 - Math.exp(-rate * dt));
    lag = angNorm(wantAng - camAng);
    if (Math.abs(lag) > CAM_MAX_LAG) camAng += lag - Math.sign(lag) * CAM_MAX_LAG;
    const cca = Math.cos(camAng), ssa = Math.sin(camAng);
    const kf = 1 - Math.exp(-(spd > 60 ? 11 : 6) * dt);
    camX = lerp(camX, p.x - cca * CAM_DIST + p.vx * 0.16, kf);
    camY = lerp(camY, p.y - ssa * CAM_DIST + p.vy * 0.16, kf);
    // 急转/打转时相机追位会贴近车头或甩到一侧，导致车突然变大、滑到画面边缘 →
    // 在视线坐标系里把「沿视线距离」和「横向偏移」都钳进正常区间：距离保住尺度稳定，横向保住甩尾感但不过界
    const rdx = p.x - camX, rdy = p.y - camY;
    const vz = clamp(rdx * cca + rdy * ssa, 80, 112);
    const vx = clamp(-rdx * ssa + rdy * cca, -CAM_DIST * 0.3, CAM_DIST * 0.3);
    camX = p.x - (vz * cca - vx * ssa);
    camY = p.y - (vz * ssa + vx * cca);
    // 侧倾：横向滑移速度为主，转向输入为辅（入弯时地平线跟着歪，是速度感的关键）
    const wantRoll = clamp(p.speedL / 640, -0.2, 0.2)
      + ((p.inp.right ? 1 : 0) - (p.inp.left ? 1 : 0)) * 0.05;
    camRoll = lerp(camRoll, clamp(wantRoll, -0.26, 0.26), 1 - Math.exp(-7 * dt));
    // 焦距按屏幕尺寸自适应（保证车落在约 80% 屏高），提速时视野外扩
    camFocal = screenFocal() * (1 - clamp(spd / PW.BOOST_VMAX, 0, 1) * 0.15);
    // 终局条件
    if (G.raceState === 'ending') {
      G.endTimer += dt;
      const allDone = G.finishOrder.length >= N_RACERS;
      if (allDone || G.endTimer > 2.4) computeResults();
    } else {
      if (G.finishOrder.length >= N_RACERS - 1 && !G.player.finished) computeResults();
      else if (G.raceTime > 300) computeResults();
    }
  }
}

// 绘制

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let CW = 1200, CH = 800, dpr = 1;
let lastTouch = false, KEYS = null;

function resize() {
  dpr = window.devicePixelRatio || 1;
  CW = window.innerWidth; CH = window.innerHeight;
  cvs.width = Math.round(CW * dpr); cvs.height = Math.round(CH * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  KEYS = lastTouch ? layoutKeys() : null;
}

// ---- 车手头像（程序化小脑袋：HUD 名次表与结算面板用，与路面视角无关）----
function drawDriver(x, y, r, ch, t) {
  const C = CHARS[ch];
  ctx.save();
  ctx.translate(x, y);
  if (C.id === 'shroom' || C.id === 'chest' || C.id === 'turtle') {
    // 脸
    ctx.fillStyle = C.skin;
    ctx.beginPath(); ctx.arc(0, r * 0.18, r * 0.62, 0, Math.PI * 2); ctx.fill();
    // 帽/头
    ctx.fillStyle = C.cap;
    ctx.beginPath(); ctx.arc(0, -r * 0.1, r * 0.85, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, -r * 0.12, r * 0.92, r * 0.62, 0, Math.PI, Math.PI * 2); ctx.fill();
    if (C.id === 'shroom') {
      ctx.fillStyle = C.capDot;
      ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.42, r * 0.2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.3, -r * 0.5, r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.05, -r * 0.18, r * 0.14, 0, Math.PI * 2); ctx.fill();
    } else if (C.id === 'chest') {
      ctx.fillStyle = C.capDot;
      ctx.beginPath(); ctx.arc(0, -r * 0.34, r * 0.2, 0, Math.PI * 2); ctx.fill();
    } else {
      // 龟壳纹
      ctx.strokeStyle = C.capDot; ctx.lineWidth = r * 0.14;
      ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.3); ctx.lineTo(r * 0.5, -r * 0.3); ctx.stroke();
    }
    // 眼睛
    ctx.fillStyle = '#222';
    const bl = (Math.sin(t * 2.2) > 0.97) ? 0.12 : 1;
    ctx.beginPath(); ctx.ellipse(-r * 0.22, r * 0.2, r * 0.09, r * 0.15 * bl, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.22, r * 0.2, r * 0.09, r * 0.15 * bl, 0, 0, Math.PI * 2); ctx.fill();
  } else if (C.id === 'bat') {
    ctx.fillStyle = C.skin;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.68, 0, Math.PI * 2); ctx.fill();
    // 耳朵
    ctx.fillStyle = C.cap;
    ctx.beginPath(); ctx.moveTo(-r * 0.5, -r * 0.4); ctx.lineTo(-r * 0.75, -r * 1.05); ctx.lineTo(-r * 0.12, -r * 0.62); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r * 0.5, -r * 0.4); ctx.lineTo(r * 0.75, -r * 1.05); ctx.lineTo(r * 0.12, -r * 0.62); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#3a2352';
    ctx.beginPath(); ctx.ellipse(-r * 0.22, 0, r * 0.1, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.22, 0, r * 0.1, r * 0.14, 0, 0, Math.PI * 2); ctx.fill();
    // 小獠牙
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-r * 0.12, r * 0.34); ctx.lineTo(-r * 0.04, r * 0.34); ctx.lineTo(-r * 0.08, r * 0.52); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(r * 0.04, r * 0.34); ctx.lineTo(r * 0.12, r * 0.34); ctx.lineTo(r * 0.08, r * 0.52); ctx.closePath(); ctx.fill();
  } else if (C.id === 'bee') {
    ctx.fillStyle = C.skin;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3a2f00';
    ctx.fillRect(-r * 0.7, -r * 0.18, r * 1.4, r * 0.2);
    ctx.fillRect(-r * 0.55, r * 0.22, r * 1.1, r * 0.16);
    // 触角
    ctx.strokeStyle = '#3a2f00'; ctx.lineWidth = r * 0.1;
    ctx.beginPath(); ctx.moveTo(-r * 0.2, -r * 0.6); ctx.quadraticCurveTo(-r * 0.35, -r * 1.05, -r * 0.55, -r * 0.95); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.2, -r * 0.6); ctx.quadraticCurveTo(r * 0.35, -r * 1.05, r * 0.55, -r * 0.95); ctx.stroke();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-r * 0.24, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.24, -r * 0.05, r * 0.1, 0, Math.PI * 2); ctx.fill();
    // 翅膀
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    const wf = Math.sin(t * 30) * 0.3;
    ctx.beginPath(); ctx.ellipse(-r * 0.85, -r * 0.3, r * 0.5, r * 0.24, -0.5 + wf, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(r * 0.85, -r * 0.3, r * 0.5, r * 0.24, 0.5 - wf, 0, Math.PI * 2); ctx.fill();
  } else { // crab
    ctx.fillStyle = C.skin;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.66, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = C.cap;
    // 眼柄
    ctx.strokeStyle = C.cap; ctx.lineWidth = r * 0.14;
    ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.4); ctx.lineTo(-r * 0.42, -r * 0.85); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r * 0.3, -r * 0.4); ctx.lineTo(r * 0.42, -r * 0.85); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.92, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.92, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(-r * 0.42, -r * 0.92, r * 0.07, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.42, -r * 0.92, r * 0.07, 0, Math.PI * 2); ctx.fill();
    // 钳子
    ctx.fillStyle = C.capDot;
    ctx.beginPath(); ctx.arc(-r * 0.85, r * 0.25, r * 0.28, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(r * 0.85, r * 0.25, r * 0.28, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---- 车尾视角卡丁车（追尾相机专用；调用方已 translate 到地面接触点）----
// 基准尺寸按真车比例：含外扩后轮宽 26、含尾翼高 30（路面 halfW=65 → 车约占路宽 20%）
function drawKartRear(k, t, sc, o) {
  const C = CHARS[k.ch];
  const shrink = k.shrinkT > 0 ? PW.SHRINK_SCALE : 1;
  ctx.save();
  ctx.scale(sc * shrink, sc * shrink);
  // 脱困预警与回位瞬间：整辆车闪几下，把「马上把你摆回赛道」这件事画出来
  if (k.stuckT > PW.RESCUE_WARN || k.snapFlash > 0) ctx.globalAlpha = Math.sin(t * 26) > 0 ? 0.26 : 0.95;
  // 落地阴影不随侧倾旋转，先画
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath(); ctx.ellipse(0, 0, 14, 3.6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(o.lean || 0);
  // 无敌光环
  if (k.starT > 0) {
    const hue = (t * 420) % 360;
    ctx.strokeStyle = 'hsla(' + hue + ',95%,64%,0.9)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, -15, 16, 17, 0, 0, Math.PI * 2); ctx.stroke();
  }
  // 加速尾焰（朝观察者喷出：外焰暖橙 + 内芯亮青，才有「推着车走」的推力感）
  if (o.boost) {
    const fl = 9 + Math.sin(t * 44) * 3.6;
    for (const sgn of [-1, 1]) {
      const ex = sgn * 5.6;
      let g = ctx.createLinearGradient(0, -5, 0, -5 + fl);
      g.addColorStop(0, 'rgba(255,196,84,0.95)');
      g.addColorStop(0.55, 'rgba(255,107,107,0.6)');
      g.addColorStop(1, 'rgba(255,107,107,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ex - 3.1, -5); ctx.lineTo(ex, -5 + fl); ctx.lineTo(ex + 3.1, -5);
      ctx.closePath(); ctx.fill();
      g = ctx.createLinearGradient(0, -5, 0, -5 + fl * 0.62);
      g.addColorStop(0, k.starT > 0 ? 'rgba(255,242,190,0.98)' : 'rgba(196,240,255,0.98)');
      g.addColorStop(1, 'rgba(125,227,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(ex - 1.3, -5); ctx.lineTo(ex, -5 + fl * 0.62); ctx.lineTo(ex + 1.3, -5);
      ctx.closePath(); ctx.fill();
    }
  }
  // 后轮
  for (const sgn of [-1, 1]) {
    ctx.fillStyle = '#15171f';
    roundRect(sgn * 9.5 - 3.5, -12, 7, 12, 2); ctx.fill();
    ctx.fillStyle = '#2b2f3c';
    ctx.fillRect(sgn * 9.5 - 1.2, -10.8, 2.4, 9.6);
  }
  // 后扩散器
  ctx.fillStyle = C.dark;
  roundRect(-8.5, -8, 17, 5, 1.6); ctx.fill();
  // 刹车灯
  for (const sgn of [-1, 1]) {
    ctx.fillStyle = o.brake ? '#ff3b30' : '#8f2d2a';
    ctx.beginPath(); ctx.arc(sgn * 5.5, -5.5, o.brake ? 1.7 : 1.3, 0, Math.PI * 2); ctx.fill();
    if (o.brake) {
      ctx.fillStyle = 'rgba(255,59,48,0.32)';
      ctx.beginPath(); ctx.arc(sgn * 5.5, -5.5, 3.4, 0, Math.PI * 2); ctx.fill();
    }
  }
  // 车身主体 + 右侧暗部（体积感）
  ctx.fillStyle = C.body;
  roundRect(-7.5, -20, 15, 12, 3); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  roundRect(3.5, -20, 4, 12, 2); ctx.fill();
  ctx.fillStyle = C.dark;
  roundRect(-4, -23, 8, 4, 1.6); ctx.fill();
  // 尾翼立柱 + 翼面
  ctx.fillStyle = C.dark;
  for (const sgn of [-1, 1]) ctx.fillRect(sgn * 7 - 1, -27, 2, 6);
  ctx.fillStyle = C.cap;
  roundRect(-13, -30, 26, 3, 1.5); ctx.fill();
  // 驾驶员头盔
  ctx.fillStyle = C.skin;
  ctx.beginPath(); ctx.arc(0, -24, 4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.cap;
  ctx.beginPath(); ctx.arc(0, -24, 4, Math.PI, Math.PI * 2); ctx.fill();
  ctx.fillStyle = C.capDot;
  ctx.beginPath(); ctx.arc(-1.4, -25, 1.05, 0, Math.PI * 2); ctx.fill();
  // 打转星星
  if (k.spinT > 0) {
    for (let i = 0; i < 3; i++) {
      const a = t * 9 + i * Math.PI * 2 / 3;
      drawStarShape(Math.cos(a) * 13, -32 + Math.sin(a) * 4, 2.4, '#ffe066');
    }
  }
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawStarShape(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const rr = i % 2 === 0 ? r : r * 0.45;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    else ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}

// ---- 装饰物（绕原点绘制：调用方负责投影位置与缩放，故可直接当广告牌用）----
function drawDeco(d, x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(d.s * sc, d.s * sc);
  if (d.type === 'tree') {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(3, 5, 16, 10, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7a4a21'; ctx.fillRect(-3.5, -4, 7, 14);
    ctx.fillStyle = '#2e7d32'; ctx.beginPath(); ctx.arc(0, -14, 17, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3e9c43'; ctx.beginPath(); ctx.arc(-6, -18, 10, 0, Math.PI * 2); ctx.fill();
  } else if (d.type === 'mushroom') {
    ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(2, 6, 13, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe9cf'; ctx.fillRect(-5, -2, 10, 12);
    ctx.fillStyle = '#e33b2f'; ctx.beginPath(); ctx.arc(0, -4, 14, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff4e0';
    ctx.beginPath(); ctx.arc(-6, -8, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, -6, 2.6, 0, Math.PI * 2); ctx.fill();
  } else if (d.type === 'flower') {
    ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.beginPath(); ctx.ellipse(1, 3, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    const cols = ['#ff8fab', '#ffd23e', '#c77dff'];
    ctx.fillStyle = cols[Math.floor(d.seed * cols.length)];
    for (let i = 0; i < 5; i++) {
      const a = i * Math.PI * 2 / 5 + d.seed * 6;
      ctx.beginPath(); ctx.arc(Math.cos(a) * 6, Math.sin(a) * 6 - 3, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#fff2b2'; ctx.beginPath(); ctx.arc(0, -3, 3, 0, Math.PI * 2); ctx.fill();
  } else if (d.type === 'lolly') {
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(2, 8, 9, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f7ede2'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -8); ctx.stroke();
    const cols = ['#ff5d8f', '#ffb703', '#5bc0eb'];
    ctx.fillStyle = cols[Math.floor(d.seed * cols.length)];
    ctx.beginPath(); ctx.arc(0, -14, 10, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.arc(0, -14, 5.5, d.seed * 6, d.seed * 6 + 2.4); ctx.stroke();
  } else if (d.type === 'cane') {
    ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.beginPath(); ctx.ellipse(2, 8, 8, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -8); ctx.arc(6, -8, 6, Math.PI, 0, true); ctx.stroke();
    ctx.strokeStyle = '#e63946'; ctx.lineWidth = 6; ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, -8); ctx.arc(6, -8, 6, Math.PI, 0, true); ctx.stroke();
    ctx.setLineDash([]);
  } else if (d.type === 'choco') {
    ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(2, 6, 13, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#6b4226'; roundRect(-12, -10, 24, 18, 5); ctx.fill();
    ctx.fillStyle = '#8a5a33'; roundRect(-12, -10, 24, 8, 5); ctx.fill();
    ctx.strokeStyle = '#4e2f1a'; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(-4, 8); ctx.moveTo(4, -10); ctx.lineTo(4, 8); ctx.stroke();
  } else if (d.type === 'crystal') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 8, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    const hue = 190 + d.seed * 90;
    ctx.fillStyle = 'hsla(' + hue + ',85%,65%,0.9)';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(9, 6); ctx.lineTo(0, 10); ctx.lineTo(-9, 6); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'hsla(' + hue + ',95%,82%,0.9)';
    ctx.beginPath(); ctx.moveTo(0, -22); ctx.lineTo(4, 2); ctx.lineTo(0, 10); ctx.lineTo(-4, 2); ctx.closePath(); ctx.fill();
  } else if (d.type === 'starbush') {
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(2, 6, 12, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2f3a6e'; ctx.beginPath(); ctx.arc(0, -4, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#3d4b8f'; ctx.beginPath(); ctx.arc(-5, -9, 7, 0, Math.PI * 2); ctx.fill();
    drawStarShape(4, -12, 4, '#ffe066');
  } else if (d.type === 'moonrock') {
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.beginPath(); ctx.ellipse(2, 5, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#565f8f'; ctx.beginPath(); ctx.arc(0, -3, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#414a75';
    ctx.beginPath(); ctx.arc(-5, -5, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -1, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(1, -9, 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

// ---- 道具实体绘制（绕投影原点绘制，sc 为屏幕缩放；地面接触点在原点）----
function drawBox(b, t, x, y, sc) {
  if (!b.alive) return;
  const bob = Math.sin(t * 3 + b.wp * 0.4) * 3;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.translate(0, -14 - bob);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 14 + bob, 12, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(Math.sin(t * 2 + b.wp) * 0.25);
  const hue = (t * 120 + b.wp * 20) % 360;
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  roundRect(-11, -11, 22, 22, 4); ctx.fill();
  ctx.strokeStyle = 'hsl(' + hue + ',90%,58%)'; ctx.lineWidth = 2.6;
  roundRect(-11, -11, 22, 22, 4); ctx.stroke();
  ctx.fillStyle = 'hsl(' + hue + ',90%,48%)';
  ctx.font = 'bold 15px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('?', 0, 1);
  ctx.restore();
}
function drawShell(s, t, x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.translate(0, -9);
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  ctx.beginPath(); ctx.ellipse(0, 9, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(s.spin * (s.type === 'red' ? 0.4 : 1));
  ctx.fillStyle = s.type === 'red' ? '#e63946' : '#43a047';
  ctx.beginPath(); ctx.arc(0, 0, SHELL_R, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = s.type === 'red' ? '#b02534' : '#2e7d32';
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, SHELL_R, a, a + Math.PI / 7);
  }
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -SHELL_R * 0.45, SHELL_R * 0.42, Math.PI, Math.PI * 2); ctx.fill();
  if (s.type === 'red') {
    ctx.strokeStyle = 'rgba(255,80,80,' + (0.5 + 0.5 * Math.sin(t * 14)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, SHELL_R + 4, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.restore();
}
function drawBanana(b, x, y, sc) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sc, sc);
  ctx.translate(0, -6);
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(0, 6, 10, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(b.rot);
  ctx.strokeStyle = '#ffd23e'; ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(0, 4, 9, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke();
  ctx.strokeStyle = '#a8760a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8.5, -1.5); ctx.lineTo(-10, -4); ctx.stroke();
  ctx.restore();
}

// ---- Mode 7 伪 3D 渲染：追尾相机 + 透视路面 + 广告牌精灵 ----
// ---- 地面条带副色（3D 视角下需要比俯视更强的明暗差才有速度感）----
const GND_B = { meadow: '#63a53d', candy: '#d79f4e', night: '#1a2140' };
const STAR_FIELD = (() => {
  const a = [];
  for (let i = 0; i < 90; i++) a.push({ x: Math.random(), y: Math.random() * 0.7, r: 0.7 + Math.random() * 1.5, p: Math.random() * 6.28 });
  return a;
})();
function lerpPt(a, b, t) { return { x: a.x + (b.x - a.x) * t, y: a.y + (b.y - a.y) * t }; }
function quad(a, b, c, d, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.lineTo(c.x, c.y); ctx.lineTo(d.x, d.y);
  ctx.closePath(); ctx.fill();
  // 同色描边：相邻四边形共用一条边，抗锯齿会在接缝处留下发丝亮的横线，路面就成了「梯子」。
  // 用同一颜色描 1px 把缝填掉
  ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke();
}
// 视差横向偏移：把相机朝向角映射成可循环的像素位移
function parallaxX(factor) {
  const span = CW * 2.2;
  let px = (-camAng * factor) % span;
  if (px > 0) px -= span;
  return px;
}
function drawHills(col, amp, wl, off, baseY) {
  const X0 = -CW * 0.7, X1 = CW * 1.7;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(X0, baseY + 8);
  for (let x = X0; x <= X1; x += 10) {
    const u = (x + off) / wl;
    ctx.lineTo(x, baseY - (Math.abs(Math.sin(u)) * 0.74 + Math.abs(Math.sin(u * 0.37 + 1.1)) * 0.4) * amp);
  }
  ctx.lineTo(X1, baseY + 8);
  ctx.closePath(); ctx.fill();
}
function drawSky(th, sk, t) {
  const W2 = CW * 2.4, X0 = CW / 2 - W2 / 2;
  const top = horizonY - CH * 1.5;
  const g = ctx.createLinearGradient(0, top, 0, horizonY);
  g.addColorStop(0, sk.top); g.addColorStop(0.62, sk.mid); g.addColorStop(1, sk.hz);
  ctx.fillStyle = g;
  ctx.fillRect(X0, top, W2, horizonY - top + 2);
  if (G.track.theme === 'night') {
    const off = parallaxX(90);
    ctx.fillStyle = '#fff';
    for (const s of STAR_FIELD) {
      const x = X0 + (((s.x * W2 + off) % W2 + W2) % W2);
      ctx.globalAlpha = 0.4 + 0.6 * Math.abs(Math.sin(t * 1.4 + s.p));
      ctx.beginPath(); ctx.arc(x, top + (horizonY - top) * s.y * 0.92, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // 日/月（随朝向角视差移动，转头时它会跟着走）
  const sx = CW / 2 + parallaxX(150) + CW * 0.3, sy = horizonY - CH * 0.22;
  const gg = ctx.createRadialGradient(sx, sy, 4, sx, sy, 96);
  gg.addColorStop(0, sk.sunGlow); gg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(sx, sy, 96, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = sk.sun; ctx.beginPath(); ctx.arc(sx, sy, 27, 0, Math.PI * 2); ctx.fill();
  if (G.track.theme === 'night') {           // 月亮缺角
    ctx.fillStyle = sk.mid;
    ctx.beginPath(); ctx.arc(sx + 10, sy - 6, 22, 0, Math.PI * 2); ctx.fill();
  }
  // 云：两层视差
  ctx.fillStyle = sk.cloud;
  for (const lay of [[110, 0.3, 22], [185, 0.16, 32]]) {
    const off = parallaxX(lay[0]);
    for (let i = 0; i < 7; i++) {
      const bx = X0 + (((i * W2 / 7 + off) % W2 + W2) % W2);
      const by = top + (horizonY - top) * lay[1] + Math.sin(i * 2.1) * 16;
      const r = lay[2];
      ctx.beginPath();
      ctx.arc(bx, by, r, 0, Math.PI * 2);
      ctx.arc(bx + r * 1.05, by + 5, r * 0.76, 0, Math.PI * 2);
      ctx.arc(bx - r * 1.0, by + 6, r * 0.68, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  drawHills(sk.hillFar, 58, 250, parallaxX(120), horizonY);
  drawHills(sk.hillNear, 34, 158, parallaxX(215), horizonY);
  // 地面基底（路面条带之前先铺满地平线以下，避免旋转/条带缝隙露底）
  ctx.fillStyle = th.ground;
  ctx.fillRect(-CW * 0.8, horizonY - 1, CW * 2.6, CH * 2.4);

// 世界地面视觉高度（取最近路点的 hgt；误差仅数像素且平滑，肉眼不可见）
function groundH(T, x, y, hint) {
  const r = nearestWP(T, x, y, hint === undefined ? G.player.wp : hint, 26);
  return r.idx >= 0 ? T.hgt[r.idx] : 0;
}
function drawFinishRow(a, b, row) {
  if (!a.ll || !a.lr || !b.ll || !b.lr) return;
  const N = 8;
  for (let c = 0; c < N; c++) {
    const t0 = c / N, t1 = (c + 1) / N;
    quad(lerpPt(a.ll, a.lr, t0), lerpPt(b.ll, b.lr, t0), lerpPt(b.ll, b.lr, t1), lerpPt(a.ll, a.lr, t1),
      ((c + row) & 1) ? '#f8f9fb' : '#22242c');

}
function drawRoad(T, th, t) {
  const n = T.n, hw = T.halfW, kw = hw + 14;
  const far2 = (CAM_FAR + 260) * (CAM_FAR + 260);
  // 先取可见路点截面，再在相邻连续路点之间插入中点截面：边界折线顶点翻倍，
  // 弯道外沿不再呈阶梯状（中点必须在世界空间求好后投影，屏幕空间取中点等于没细分）
  const raw = [];
  for (let i = 0; i < n; i++) {
    const w = T.wp[i], ddx = w.x - camX, ddy = w.y - camY;
    if (ddx * ddx + ddy * ddy > far2) continue;
    raw.push({ x: w.x, y: w.y, nx: T.nrm[i].x, ny: T.nrm[i].y, h: T.hgt[i], key: i });
  }
  const list = [];
  for (let a = 0; a < raw.length; a++) {
    const r = raw[a];
    list.push(r);
    const s = raw[(a + 1) % raw.length];
    if (!s || s.key !== r.key + 1) continue;      // 跨可见窗口接缝不细分
    let mx = (r.x + s.x) * 0.5, my = (r.y + s.y) * 0.5;
    let mnx = (r.nx + s.nx) * 0.5, mny = (r.ny + s.ny) * 0.5;
    const ml = Math.hypot(mnx, mny) || 1;
    list.push({ x: mx, y: my, nx: mnx / ml, ny: mny / ml, h: (r.h + s.h) * 0.5, key: r.key + 0.5, mid: 1 });
  }
  const pv = [];
  for (const r of list) {
    const cc = proj(r.x, r.y, r.h, 1);
    if (!cc) continue;
    const kl = proj(r.x + r.nx * kw, r.y + r.ny * kw, r.h, 1);
    const kr = proj(r.x - r.nx * kw, r.y - r.ny * kw, r.h, 1);
    const ll = proj(r.x + r.nx * hw, r.y + r.ny * hw, r.h, 1);
    const lr = proj(r.x - r.nx * hw, r.y - r.ny * hw, r.h, 1);
    // 剔除按「整个截面的屏幕跨度」判定，不能只看中心线：甩尾与急弯时中心线偏出视场、路面却还压在
    // 屏幕上，按中心线剔就整块不画——表现为跑过的赛道后面突然空白一块
    let x0 = cc.x, x1 = cc.x;
    for (const q of [kl, kr, ll, lr]) {
      if (!q) continue;
      if (q.x < x0) x0 = q.x;
      if (q.x > x1) x1 = q.x;
    }
    if (x1 < -CW * 0.5 || x0 > CW * 1.5) continue;
    pv.push({ cc, key: r.key, i: Math.floor(r.key), kl, kr, ll, lr });
  }
  const segs = [];
  for (let j = 0; j + 1 < pv.length; j++) {
    const a = pv[j], b = pv[j + 1];
    if (b.key !== a.key + 0.5) continue;               // 只与紧邻的下一个截面成面
    segs.push({ a, b, i: a.i, z: Math.max(a.cc.z, b.cc.z) });
  }
  segs.sort((p, q) => q.z - p.z);          // 远→近：画家算法，近处自然遮住远处
  // 两遍绘制：先把所有地面条带铺完，再铺路面。
  // 单遍「一段地面 + 一段路面」交替画会在弯道内侧露出拉链齿——弯道会让远处那段路面折回到近段条带的
  // y 区间里，被整幅宽的地面矩形啃掉一半。条带全部先画就没这个层次冲突（起伏很小，不会反过来穿帮）
  for (const s of segs) {
    const a = s.a, b = s.b;
    const yFar = Math.min(a.cc.y, b.cc.y), yNear = Math.max(a.cc.y, b.cc.y);
    ctx.fillStyle = ((s.i >> 2) & 1) ? th.ground : GND_B[T.theme];
    ctx.fillRect(-CW * 0.8, yFar, CW * 2.6, yNear - yFar + 1);
  }
  for (const s of segs) {
    const a = s.a, b = s.b, i = s.i;
    const band = (i >> 2) & 1;
    // 红白路肩（每 2 段换色）
    if (a.kl && a.kr && b.kl && b.kr) quad(a.kl, b.kl, b.kr, a.kr, ((i >> 1) & 1) ? th.kerb : th.kerbAlt);
    // 柏油
    if (a.ll && a.lr && b.ll && b.lr) quad(a.ll, b.ll, b.lr, a.lr, th.road);
    // 中线虚线
    if (band) {
      ctx.strokeStyle = th.line;
      ctx.lineWidth = Math.max(1, 3.6 * a.cc.s);
      ctx.beginPath(); ctx.moveTo(a.cc.x, a.cc.y); ctx.lineTo(b.cc.x, b.cc.y); ctx.stroke();
    }
    if (i === 0 || i === 1) drawFinishRow(a, b, i);
  }
}
// 远处雾霭：把地平线附近的路面融进天空，纵深立刻拉开
function drawHaze(sk) {
  const h = Math.max(40, CH * 0.1);
  const g = ctx.createLinearGradient(0, horizonY, 0, horizonY + h);
  g.addColorStop(0, sk.hz); g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = g;
  ctx.fillRect(-CW * 0.8, horizonY - 2, CW * 2.6, h);
  ctx.globalAlpha = 1;
}
// 广告牌：装饰/道具/对手/粒子/胎痕统一投影 + 深度排序
function drawBillboards(T, t) {
  const list = [];
  const add = (x, y, h, kind, o) => {
    const p = proj(x, y, h);
    if (!p) return;
    // 落在「相机→车头」这段死区里的东西会因透视急剧放大成一坨（刚喷出的尾焰粒子首当其冲），
    // 而这一段本来就被自己的车挡住，直接不画
    if (p.z < 78) return;
    if (p.x < -CW * 0.8 || p.x > CW * 1.8) return;
    list.push({ p, kind, o });
  };
  for (const d of G.decos) add(d.x, d.y, T.hgt[d.wp], 'deco', d);
  for (const b of T.boxes) if (b.alive) add(b.x, b.y, T.hgt[b.wp], 'box', b);
  for (const s of G.shells) add(s.x, s.y, groundH(T, s.x, s.y), 'shell', s);
  for (const b of G.bananas) add(b.x, b.y, groundH(T, b.x, b.y), 'banana', b);
  for (const k of G.karts) if (!k.isPlayer) add(k.x, k.y, groundH(T, k.x, k.y, k.wp), 'kart', k);
  for (const p of G.parts) add(p.x, p.y, groundH(T, p.x, p.y) + p.r, 'part', p);
  for (const s of G.skids) add(s.x, s.y, groundH(T, s.x, s.y), 'skid', s);
  list.sort((a, b) => b.p.z - a.p.z);
  for (const e of list) {
    const p = e.p, sc = p.s;
    if (e.kind === 'deco') drawDeco(e.o, p.x, p.y, sc);
    else if (e.kind === 'box') drawBox(e.o, t, p.x, p.y, sc);
    else if (e.kind === 'shell') drawShell(e.o, t, p.x, p.y, sc);
    else if (e.kind === 'banana') drawBanana(e.o, p.x, p.y, sc);
    else if (e.kind === 'kart') {
      const k = e.o;
      // 侧对相机时横向压扁：否则所有对手都像正对车尾
      const rel = Math.abs(angNorm(k.heading - camAng));
      const squash = 0.42 + 0.58 * Math.abs(Math.cos(rel));
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(squash, 1);
      drawKartRear(k, t, sc, { boost: k.boostT > 0 || k.starT > 0, brake: k.inp.brake, lean: 0 });
      ctx.restore();
    } else if (e.kind === 'part') {
      const pt = e.o;
      ctx.globalAlpha = clamp(pt.t / pt.max, 0, 1);
      ctx.fillStyle = pt.col;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.9, pt.r * sc), 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    } else {
      const al = clamp(e.o.t / 3, 0, 1) * 0.32;
      if (al > 0.02) {
        ctx.globalAlpha = al;
        ctx.fillStyle = '#12141c';
        ctx.beginPath(); ctx.ellipse(p.x, p.y, Math.max(1, 3 * sc), Math.max(0.6, 1.3 * sc), 0, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }
}
// 玩家车按真实投影绘制（会随甩尾/打转在画面里横移），但不随地平线一起倾斜——相机侧倾时车身保持正立更自然
function drawPlayerKart(t, shX, shY) {
  const p = G.player, T = G.track;
  const spd = Math.hypot(p.vx, p.vy);
  const dx = p.x - camX, dy = p.y - camY;
  const ca = Math.cos(camAng), sa = Math.sin(camAng);
  // 玩家车必须始终可见：不做近裁剪，深度/横向偏移温和钳制，甩尾与打转时不至于畸变
  const Z = clamp(dx * ca + dy * sa, 60, CAM_FAR);
  const X = clamp(-dx * sa + dy * ca, -CAM_DIST * 0.42, CAM_DIST * 0.42);
  const iz = camFocal / Z;
  const bob = Math.sin(t * 21) * (0.5 + spd / 320) * 1.1 - clamp(p.speedF / 400, 0, 1) * 1.5;
  const px = clamp(CW / 2 + X * iz, CW * 0.18, CW * 0.82) + shX;
  const py = clamp(horizonY + (CAM_H - groundH(T, p.x, p.y, p.wp) - bob) * iz, horizonY + 30, CH - 12) + shY;
  let lean = clamp(p.speedL / 860, -0.2, 0.2) + ((p.inp.right ? 1 : 0) - (p.inp.left ? 1 : 0)) * 0.055;
  if (p.spinT > 0) lean += Math.sin(t * 17) * 0.22;
  ctx.save();
  ctx.translate(px, py);
  drawKartRear(p, t, iz, { boost: p.boostT > 0 || p.starT > 0, brake: p.inp.brake && spd > 20, lean });
  ctx.restore();
  // 漂移蓄力火花（三档颜色）
  if (p.driftOn && p.driftT > PW.DRIFT_T[0]) {
    const tier = p.driftT >= PW.DRIFT_T[2] ? 3 : (p.driftT >= PW.DRIFT_T[1] ? 2 : 1);
    const cols = ['#7de3ff', '#ffb347', '#ff6b6b'];
    ctx.fillStyle = cols[tier - 1];
    for (let i = 0; i < tier + 2; i++) {
      const jx = px + (Math.random() - 0.5) * 22 * iz, jy = py - 3 * iz - Math.random() * 5 * iz;
      ctx.beginPath(); ctx.arc(jx, jy, (2 + Math.random() * 3.4) * iz * 0.5, 0, Math.PI * 2); ctx.fill();
    }
  }
}
// 速度线 + 加速暗角：从消失点向外辐射
function drawSpeedFX(t) {
  const p = G.player;
  const spd = Math.hypot(p.vx, p.vy);
  const boost = p.boostT > 0 || p.starT > 0;
  const norm = clamp(spd / (boost ? PW.BOOST_VMAX : PW.VMAX), 0, 1);
  if (!(norm > 0.6 || boost)) return;
  const n = boost ? 28 : 14;
  ctx.save();
  ctx.strokeStyle = boost ? 'rgba(255,242,190,0.55)' : 'rgba(255,255,255,0.2)';
  ctx.lineWidth = boost ? 2.8 : 1.5;
  const rBase = Math.min(CW, CH) * (boost ? 0.24 : 0.34);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + t * 1.2;
    const len = (boost ? 170 : 80) * (0.45 + ((i * 37) % 23) / 23);
    const r0 = rBase, r1 = rBase + len;
    ctx.beginPath();
    ctx.moveTo(CW / 2 + Math.cos(a) * r0, horizonY + Math.sin(a) * r0 * 0.7);
    ctx.lineTo(CW / 2 + Math.cos(a) * r1, horizonY + Math.sin(a) * r1 * 0.7);
    ctx.stroke();
  }
  ctx.restore();
  if (boost) {
    const g = ctx.createRadialGradient(CW / 2, horizonY + CH * 0.18, Math.min(CW, CH) * 0.2, CW / 2, horizonY + CH * 0.18, Math.max(CW, CH) * 0.66);
    g.addColorStop(0, 'rgba(255,214,102,0)');
    g.addColorStop(1, 'rgba(255,150,40,0.22)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }
}
function drawWorld(t) {
  const T = G.track, th = THEMES[T.theme], sk = SKY[T.theme];
  horizonY = Math.round(CH * 0.42);
  if (G.scene === 'result' && !G.result) return;
  // 震屏：由 bumpT / spinT 推导，不需要玩法侧配合
  const p = G.player;
  let shX = 0, shY = 0;
  const amp = Math.min(9, (p.bumpT > 0 ? p.bumpT * 30 : 0) + (p.spinT > 0 ? 3.2 : 0));
  if (amp > 0.1) { shX = (Math.random() - 0.5) * amp * 2; shY = (Math.random() - 0.5) * amp * 2; }
  // 底色兜底（旋转后画布四角不露空）
  ctx.fillStyle = sk.top; ctx.fillRect(0, 0, CW, CH);
  ctx.save();
  ctx.translate(shX, shY);
  ctx.translate(CW / 2, horizonY); ctx.rotate(camRoll); ctx.translate(-CW / 2, -horizonY);
  drawSky(th, sk, t);
  drawRoad(T, th, t);
  drawBillboards(T, t);

  if (T.theme === 'night') {
    const g = ctx.createRadialGradient(CW / 2, CH * 0.55, Math.min(CW, CH) * 0.3, CW / 2, CH * 0.55, Math.max(CW, CH) * 0.78);

    ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  }
  drawPlayerKart(t, shX, shY);
  drawSpeedFX(t);
}

// ---- HUD ----
function drawMinimap() {
  const T = G.track;
  const bw = T.bounds.maxX - T.bounds.minX, bh = T.bounds.maxY - T.bounds.minY;
  const MW = 148, MH = Math.round(MW * bh / bw) + 20;
  const mx = CW - MW - 16, my = CH - MH - 14;
  ctx.fillStyle = 'rgba(16,19,28,0.88)';
  roundRect(mx - 8, my - 8, MW + 16, MH + 16, 10); ctx.fill();
  const sc = MW / bw;
  const ox = mx - T.bounds.minX * sc, oy = my + 10 - T.bounds.minY * sc;
  ctx.strokeStyle = 'rgba(255,255,255,0.75)';
  ctx.lineWidth = Math.max(3, T.halfW * 2 * sc * 0.5);

  const every = Math.max(1, Math.floor(T.n / 90));
  for (let i = 0; i <= T.n; i += every) {

  // 右上按钮
  drawHudButtons();
  // 消息
  if (G.msg) {
    ctx.globalAlpha = clamp(G.msg.t, 0, 1);
    ctx.fillStyle = '#ffe066';
    ctx.font = 'bold 30px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(G.msg.text, CW / 2, CH * 0.22);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  // 逆行警告
  if (G.wrongWay > 0) {
    ctx.fillStyle = 'rgba(230,57,70,' + (0.6 + 0.4 * Math.sin(t * 10)) + ')';
    ctx.font = 'bold 34px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('⚠ 逆行！', CW / 2, CH * 0.32);
    ctx.textAlign = 'left';
  }
  // 倒计时
  if (G.raceState === 'count') {
    const c = Math.ceil(G.countdown - 0.4);
    ctx.textAlign = 'center';
    if (c >= 1 && c <= 3) {
      const frac = (G.countdown - 0.4) - Math.floor(G.countdown - 0.4);
      ctx.save();
      ctx.translate(CW / 2, CH * 0.38);
      ctx.scale(1 + (1 - frac) * 0.5, 1 + (1 - frac) * 0.5);
      ctx.fillStyle = c === 1 ? '#7dffa8' : '#ffe066';
      ctx.font = 'bold 110px sans-serif';
      ctx.fillText(String(c), 0, 0);
      ctx.restore();
    } else if (G.countdown <= 0.4) {
      ctx.fillStyle = '#7dffa8';
      ctx.font = 'bold 92px sans-serif';
      ctx.fillText('GO!', CW / 2, CH * 0.38);
    }
    ctx.textAlign = 'left';
  }
  if (G.goFlash > 0) {
    ctx.fillStyle = '#7dffa8';
    ctx.font = 'bold 92px sans-serif'; ctx.textAlign = 'center';
    ctx.globalAlpha = clamp(G.goFlash / 0.8, 0, 1);
    ctx.fillText('GO!', CW / 2, CH * 0.38);
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
  drawMinimap();
}

function drawKeys() {

  for (const id in KEYS) {

function keyHit(px, py) {
  if (!KEYS) return null;
  for (const id in KEYS) {
    const b = KEYS[id];
    if (dist2(px, py, b.x, b.y) < (b.r + 12) * (b.r + 12)) return b.key;
  }
  return null;
}

// ---- 选道面板 ----
function drawTracks(t) {
  const g = ctx.createLinearGradient(0, 0, 0, CH);
  g.addColorStop(0, '#173028');
  g.addColorStop(1, '#1d2440');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CW, CH);
  const cx = CW / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 30px sans-serif';
  ctx.fillText('选择赛道', cx, 56);
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.font = '13px sans-serif';
  ctx.fillText('难度：' + DIFFS[G.diff].label + ' · 夺冠解锁下一赛道', cx, 80);
  const portrait = CW < 760;
  const cardW = portrait ? Math.min(CW - 60, 320) : 250;
  const cardH = portrait ? 150 : 300;
  const gap = portrait ? 18 : 34;
  const totalH = portrait ? cardH * 3 + gap * 2 : cardH;
  const y0 = portrait ? 104 : (CH - cardH) / 2 + 10;
  const x0 = portrait ? cx - cardW / 2 : cx - (cardW * 3 + gap * 2) / 2;
  const diffIdx = DIFF_ORDER.indexOf(G.diff);
  for (let i = 0; i < TRACKS.length; i++) {
    const x = portrait ? x0 : x0 + i * (cardW + gap);
    const y = portrait ? y0 + i * (cardH + gap) : y0;
    const locked = i > unlocked;
    const th = THEMES[TRACKS[i].theme];
    panel(x, y, cardW, cardH, locked ? 0.7 : 0.82);
    // 缩略图：迷你赛道线
    const T0 = TRACKS[i];
    ctx.save();
    const mw = cardW - 30, mh = portrait ? 66 : 130;
    const bx0 = x + 15, by0 = y + 14;
    const T = getTrackGeom(i);
    const bw = T.bounds.maxX - T.bounds.minX, bh = T.bounds.maxY - T.bounds.minY;
    const ms = Math.min(mw / bw, mh / bh);
    const ox = bx0 + (mw - bw * ms) / 2 - T.bounds.minX * ms;
    const oy = by0 + (mh - bh * ms) / 2 - T.bounds.minY * ms;
    ctx.beginPath();
    const every = Math.max(1, Math.floor(T.n / 120));
    for (let j = 0; j <= T.n; j += every) {
      const p = T.wp[j % T.n];
      const X = ox + p.x * ms, Y = oy + p.y * ms;
      if (j === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
    }
    ctx.closePath();
    ctx.lineJoin = 'round';
    ctx.strokeStyle = locked ? 'rgba(255,255,255,0.25)' : th.kerb;
    ctx.lineWidth = Math.max(3, T.halfW * 2 * ms * 0.55);
    ctx.stroke();
    ctx.strokeStyle = locked ? 'rgba(255,255,255,0.4)' : th.road;
    ctx.lineWidth = Math.max(2, T.halfW * 2 * ms * 0.36);
    ctx.stroke();
    ctx.restore();
    // 文案
    ctx.textAlign = 'center';
    ctx.fillStyle = locked ? 'rgba(255,255,255,0.5)' : '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(T0.name, x + cardW / 2, by0 + mh + 28);
    const rec = bests[diffIdx * TRACKS.length + i];
    ctx.font = '12px sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('基准 ' + T0.par + 's/圈 · ' + LAPS + ' 圈', x + cardW / 2, by0 + mh + 48);

    if (locked) {

  ctx.textAlign = 'left';

}

  btn(px + 20, byy, bw2, 44, '再来一局', 'retry', { fs: 15, g0: '#ffb347', g1: '#ff6b6b' });
  const canNext = win && G.trackIdx + 1 < TRACKS.length;
  btn(px + pw / 2 - bw2 / 2, byy, bw2, 44, canNext ? '下一赛道' : '换赛道', canNext ? 'next' : 'tracks', { fs: 15, g0: canNext ? '#5ad8cd' : '#4a5170', g1: canNext ? '#2fa89c' : '#3a4059' });
  btn(px + pw - 20 - bw2, byy, bw2, 44, '主菜单', 'menu', { fs: 15, g0: '#5a6076', g1: '#464c60' });
  ctx.textAlign = 'left';
}

// ---- 场景分发 ----
function drawScene() {
  const t = G.frame / 60;
  uiBtns = [];
  if (G.scene === 'menu') drawMenu(t);
  else if (G.scene === 'tracks') drawTracks(t);
  else if (G.scene === 'race') {
    drawWorld(t);
    drawHUD(t);
    if (KEYS) drawKeys();
    if (G.paused) drawPause(t);
  } else if (G.scene === 'result') {
    drawWorld(t);
    drawResult(t);
  }
}

// ---- UI 动作与命中 ----
function doAct(act) {
  ensureAC();
  if (act === 'mute') { muted = !muted; if (!muted) SFX.select(); return; }
  if (act === 'speed') { G.speed = G.speed % 3 + 1; SFX.select(); return; }
  if (act === 'menu') { G.paused = false; G.scene = 'menu'; SFX.back(); return; }
  if (act.indexOf('diff:') === 0) { G.diff = act.slice(5); saveDiff(); SFX.select(); return; }
  if (act === 'start') { SFX.select(); G.scene = 'tracks'; return; }
  if (act === 'back') { SFX.back(); G.scene = 'menu'; return; }
  if (act.indexOf('track:') === 0) {
    const i = +act.slice(6);
    if (i <= unlocked && i < TRACKS.length) { startRace(i); }
    return;
  }
  if (act === 'resume') { G.paused = false; SFX.select(); return; }
  if (act === 'restart' || act === 'retry') { SFX.select(); startRace(G.trackIdx); return; }
  if (act === 'tracks') { SFX.back(); G.scene = 'tracks'; return; }
  if (act === 'next') {
    const nx = G.trackIdx + 1;
    if (nx < TRACKS.length && nx <= unlocked) { SFX.select(); startRace(nx); }
    else { G.scene = 'tracks'; }
    return;
  }
}
function uiHit(px, py) {
  const lists = (G.scene === 'race') ? [uiBtns, hudBtns] : [uiBtns, cornerBtns];
  for (const list of lists) {
    for (const b of list) {
      if (px >= b.x && px <= b.x + b.w && py >= b.y && py <= b.y + b.h) { doAct(b.act); return true; }
    }
  }
  return false;
}
function doConfirm() {
  if (G.scene === 'menu') { doAct('start'); return true; }
  if (G.scene === 'tracks') { doAct('track:' + clamp(G.trackIdx, 0, unlocked)); return true; }
  if (G.scene === 'race' && G.paused) { doAct('resume'); return true; }
  if (G.scene === 'result') { doAct('retry'); return true; }
  return false;
}

// ---- 键盘输入 ----
const KEYMAP = {
  ArrowUp: 'gas', KeyW: 'gas', ArrowDown: 'brake', KeyS: 'brake',
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ShiftLeft: 'drift', ShiftRight: 'drift', KeyZ: 'drift', KeyK: 'drift',
  KeyX: 'item', KeyJ: 'item', Space: 'item',
};
window.addEventListener('keydown', e => {
  ensureAC();
  const k = KEYMAP[e.code] || (e.key === ' ' ? 'item' : null);
  if (k) {
    e.preventDefault();
    IN[k] = true;
    if (lastTouch) { lastTouch = false; resize(); }   // 接回键盘时收起虚拟键
    return;
  }
  if (e.code === 'Escape' || e.key === 'Escape') {
    if (G.scene === 'race') G.paused = !G.paused;
    else if (G.scene === 'tracks') G.scene = 'menu';
    else if (G.scene === 'result') G.scene = 'tracks';
    return;
  }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
  if (e.key === 'Enter') { e.preventDefault(); doConfirm(); return; }
  if (G.scene === 'menu' && ['1', '2', '3'].indexOf(e.key) >= 0) { G.diff = DIFF_ORDER[+e.key - 1]; saveDiff(); SFX.select(); }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code] || (e.key === ' ' ? 'item' : null);
  if (k) { e.preventDefault(); IN[k] = false; }
});
// ---- 指针输入（多点触控：虚拟键 + 面板点击；触屏模式自动油门）----
const ptrKeys = new Map();
window.addEventListener('pointerdown', e => {
  ensureAC();
  if (e.pointerType === 'touch' && !lastTouch) { lastTouch = true; resize(); }
  const px = e.clientX, py = e.clientY;
  if (G.scene === 'race' && !G.paused) {
    const kk = keyHit(px, py);
    if (kk && KEYS) { ptrKeys.set(e.pointerId, kk); IN[kk] = true; e.preventDefault(); return; }
    uiHit(px, py);
    return;
  }
  if (uiHit(px, py)) return;
  if (G.scene !== 'race') doConfirm();
});
function releasePtr(e) {
  const kk = ptrKeys.get(e.pointerId);
  if (kk) { IN[kk] = false; ptrKeys.delete(e.pointerId); }
}
window.addEventListener('pointerup', releasePtr);
window.addEventListener('pointercancel', releasePtr);
window.addEventListener('blur', () => { IN.gas = IN.brake = IN.left = IN.right = IN.drift = IN.item = false; ptrKeys.clear(); engineStop(); });
window.addEventListener('resize', resize);
// 切后台会停掉 rAF，引擎循环音就再也拿不到 engineTick 的调音——直接停掉，否则会留下一个不变的长鸣
document.addEventListener('visibilitychange', () => { lastFrame = null; if (document.hidden) engineStop(); });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---- 主循环 ----
let lastFrame = null, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrame === null) { lastFrame = ts; return; }
  let dt = (ts - lastFrame) / 1000; lastFrame = ts;
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 12) {
    for (let s = 0; s < G.speed; s++) update(STEP);
    acc -= STEP;
  }
  if (acc > STEP * 12) acc = 0;
  engineTick();
  drawScene();
}

function init() {
  loadBest(); loadDiff(); loadUnlock();
  G.scene = 'menu';
  resize();
}

init();
requestAnimationFrame(frame);
</script>
</body>
