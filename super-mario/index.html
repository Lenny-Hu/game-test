// ---- 音效（Web Audio 实时合成，无外部音频资产）----
let AC = null, muted = false;
function ensureAC() {
  if (AC || typeof window === 'undefined') return;
  const Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) return;
  try { AC = new Ctor(); } catch (e) { AC = null; }
}
function tone(freq, dur, type, vol, slide, delay) {
  if (muted || !AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol == null ? 0.16 : vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function noise(dur, vol) {
  if (muted || !AC) return;
  const n = Math.floor(AC.sampleRate * dur), buf = AC.createBuffer(1, n, AC.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = AC.createBufferSource(), g = AC.createGain();
  s.buffer = buf; g.gain.value = vol == null ? 0.2 : vol;
  s.connect(g); g.connect(AC.destination); s.start();
}

// 模拟层：世界构建 + 瓦片碰撞 + 玩家/敌人/道具/火球 + 结算
// ============================================================

// ---- 全局状态 ----
const G = {
  scene: 'menu',            // menu | levels | play | pause | clear | over | win
  diff: 'normal',
  levelIdx: 0,
  unlock: 1,
  grid: [],                 // grid[row][col]
  cols: 0,
  camX: 0,
  player: null,
  enemies: [], items: [], fires: [],
  parts: [], pops: [], bumps: [],
  flagCol: 0, flagTopRow: 0, flagRow: 0,
  spawnX: 0, spawnY: 0, checkX: 0, checkY: 0, checkTaken: false,
  score: 0, coinCount: 0, lives: 3,
  timeLeft: 0, timeWarn: 0,
  combo: 0,
  clearT: 0, overT: 0,
  t: 0, speed: 1,
  best: {},
  lastResult: null,
  ui: [],
  started: false,
};

// ---- 输入（键盘 / 触屏虚拟键统一写这里，Bot 也直接写这里）----
const IN = { left: false, right: false, jump: false, run: false, fire: false };
let jumpWasDown = false;

// ---- 瓦片读写 ----
function tileChar(cx, cy) {
  if (cx < 0) return '#';                 // 左边界墙
  if (cx >= G.cols || cy < 0 || cy >= ROWS) return '.';
  return G.grid[cy][cx];
}
function setTile(cx, cy, ch) { if (cx >= 0 && cx < G.cols && cy >= 0 && cy < ROWS) G.grid[cy][cx] = ch; }
function solidAt(x, y) { return isSolidCh(tileChar(Math.floor(x / TILE), Math.floor(y / TILE))); }

// ---- 关卡构建：块序列拼接为网格，并抽出出生点/敌人/旗杆 ----
function buildLevel(idx) {
  const lv = LEVELS[idx];
  setSeed(20260927 + idx * 7919);          // 装饰相位与敌人起跳时机确定
  const rows = [];
  for (let r = 0; r < ROWS; r++) rows.push('');
  for (const name of lv.parts) {
    const ck = CHUNKS[name];
    if (!ck) throw new Error('missing chunk ' + name);
    for (let r = 0; r < ROWS; r++) rows[r] += ck[r];
  }
  G.grid = rows.map(s => s.split(''));
  G.cols = rows[0].length;
  G.enemies = []; G.items = []; G.fires = []; G.parts = []; G.pops = []; G.bumps = [];
  G.flagCol = -1; G.flagTopRow = ROWS - 1; G.flagBotRow = -1; G.flagY = null; G.flagContactRow = ROWS - 3;
  let sx = 2 * TILE, sy = (ROWS - 3) * TILE;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < G.cols; c++) {
    const ch = G.grid[r][c];
    if (ch === 'S') { sx = c * TILE + (TILE - 24) / 2; sy = (r + 1) * TILE - PLAYER_SMALL_H; G.grid[r][c] = '.'; }
    else if (ch === 'g' || ch === 'k' || ch === 'h') { spawnEnemy(ch, c * TILE + (TILE - ENEMY[ch].w) / 2, r * TILE + (TILE - ENEMY[ch].h)); G.grid[r][c] = '.'; }
    else if (ch === 'm' || ch === 'f') {
      // 路面道具：不需要顶砖就能吃到，供关卡直接摆放补给
      const tp = ch === 'm' ? 'mushroom' : 'flower', it = ITEM[tp];
      G.items.push({ type: tp, x: c * TILE + (TILE - it.w) / 2, y: (r + 1) * TILE - it.h, w: it.w, h: it.h,
        vx: ch === 'm' ? it.spd : 0, vy: 0, emerge: 0, riseTo: (r + 1) * TILE - it.h,
        state: ch === 'm' ? 'move' : 'still', dir: 1, onGround: true });
      G.grid[r][c] = '.';
    }
    else if (ch === 'F') { if (G.flagCol < 0) G.flagCol = c; G.flagTopRow = Math.min(G.flagTopRow, r); G.flagBotRow = Math.max(G.flagBotRow, r); }
  }
  if (G.flagBotRow < 0) G.flagBotRow = ROWS - 3;
  G.flagContactRow = G.flagBotRow;
  G.spawnX = sx; G.spawnY = sy;
  // 检查点：从关卡中点向两侧找一根「脚下实心 + 身位净空 + 前后无坑 + 附近没有敌人」的列。
  // 复活点若贴着巡逻敌人，出生瞬间就被身后的敌人撞死，会形成无法挣脱的重复死亡。
  const geoOk = k => k >= 6 && k <= G.cols - 8 &&
    isSolidCh(tileChar(k, GROUND_TOP)) &&
    !isSolidCh(tileChar(k, GROUND_TOP - 1)) && !isSolidCh(tileChar(k, GROUND_TOP - 2));
  const spotOk = k => {
    for (let c = k - 4; c <= k + 10; c++) if (!isSolidCh(tileChar(c, GROUND_TOP))) return false;
    for (const e of G.enemies) if (Math.abs(e.x / TILE - k) < 13) return false;
    return true;
  };
  const mid = Math.floor(G.cols / 2);
  let cc = -1;
  for (let d = 0; d <= 60 && cc < 0; d++) {
    const cand = d === 0 ? [mid] : [mid + d, mid - d];
    for (const k of cand) if (geoOk(k) && spotOk(k)) { cc = k; break; }
  }
  if (cc < 0) for (let d = 0; d <= 24 && cc < 0; d++) {
    const cand = d === 0 ? [mid] : [mid + d, mid - d];
    for (const k of cand) if (geoOk(k)) { cc = k; break; }
  }
  G.checkX = cc >= 0 ? cc * TILE + (TILE - 24) / 2 : sx;
  G.checkY = GROUND_TOP * TILE - PLAYER_SMALL_H;
  G.checkTaken = false;

  return lv;
}

function makePlayer(x, y) {
  return {
    x, y, w: 24, h: PLAYER_SMALL_H, vx: 0, vy: 0, dir: 1,
    onGround: false, coyote: 0, jbuf: 0, jumpHeld: false,
    state: 'small', invuln: 0, star: 0, dead: false, deadT: 0,
    anim: 0, fireCd: 0, run: 0, prevBottom: y + PLAYER_SMALL_H, skid: 0, checkpointed: false,
  };
}
const PLAYER_SMALL_H = 28, PLAYER_BIG_H = 46;

function spawnEnemy(kind, x, y) {
  const d = ENEMY[kind];
  G.enemies.push({
    kind, x, y, w: d.w, h: d.h, vx: 0, vy: 0, dir: -1,
    state: 'walk', restT: 0, hopT: d.hop ? 0.6 + rng() * 0.5 : 0, onGround: false,
    dead: false, deadT: 0, squash: 0, anim: rng() * 6, hitCd: 0,
  });
}

// ---- AABB ----
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ---- 分轴碰撞：单次位移须 ≤ 12px（调用方负责拆分）----
function moveX(o, dx) {
  o.x += dx;
  const top = Math.floor((o.y + 1) / TILE), bot = Math.floor((o.y + o.h - 1) / TILE);
  if (dx > 0) {
    const col = Math.floor((o.x + o.w - 1) / TILE);
    for (let r = top; r <= bot; r++) if (isSolidCh(tileChar(col, r))) { o.x = col * TILE - o.w - 0.01; return col; }
  } else if (dx < 0) {
    const col = Math.floor(o.x / TILE);
    for (let r = top; r <= bot; r++) if (isSolidCh(tileChar(col, r))) { o.x = (col + 1) * TILE + 0.01; return col; }
  }
  return null;
}
function moveY(o, dy) {
  o.y += dy;
  const l = Math.floor((o.x + 1) / TILE), r = Math.floor((o.x + o.w - 1) / TILE);
  if (dy > 0) {
    const row = Math.floor((o.y + o.h - 1) / TILE);
    let hit = false;
    for (let c = l; c <= r; c++) if (isSolidCh(tileChar(c, row))) { o.y = row * TILE - o.h - 0.01; hit = true; }
    return hit ? { side: 'down', row, cols: [] } : null;
  }
  if (dy < 0) {
    const row = Math.floor(o.y / TILE);
    const cols = [];
    for (let c = l; c <= r; c++) if (isSolidCh(tileChar(c, row))) cols.push(c);
    if (!cols.length) return null;
    o.y = (row + 1) * TILE + 0.01;
    return { side: 'up', row, cols };
  }
  return null;
}
// 以固定上限逐步推进，避免穿透
function sweepX(o, dx) { let hitCol = null; const n = Math.ceil(Math.abs(dx) / 10) || 1; for (let i = 0; i < n; i++) { const h = moveX(o, dx / n); if (h !== null) hitCol = h; } return hitCol; }
function sweepY(o, dy) { const n = Math.ceil(Math.abs(dy) / 10) || 1; let res = null; for (let i = 0; i < n; i++) { const r = moveY(o, dy / n); if (r) res = r; } return res; }

// ---- 飘字 / 粒子 ----
function popup(x, y, text, col) { G.pops.push({ x, y, text, col: col || '#fff', t: 0 }); }
function burst(x, y, col, n, spd) {
  for (let i = 0; i < (n || 8); i++) {
    const a = Math.random() * Math.PI * 2, s = (spd || 180) * (0.35 + Math.random() * 0.75);
    G.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 90, t: 0, life: 0.45 + Math.random() * 0.35, col, r: 2 + Math.random() * 3 });
  }
}
function score(n, x, y, col) { const v = Math.round(n * DIFFS[G.diff].scoreMul); G.score += v; if (x != null) popup(x, y, '+' + v, col); return v; }

// ---- 顶砖 ----
function hitBlock(col, row, p) {
  const ch = tileChar(col, row);
  if (ch !== '?' && ch !== '!' && ch !== 'b' && ch !== 'T') { G.bumps.push({ col, row, t: 0 }); return; }
  const bx = col * TILE + TILE / 2, by = row * TILE;
  if (ch === '?') {
    setTile(col, row, 'u'); G.bumps.push({ col, row, t: 0 });
    addCoinCount(1); score(SC_BLOCKCOIN); popup(bx, by - 8, '金币', '#ffe066'); SFX.coin();
    G.parts.push({ x: bx, y: by - 6, vx: 0, vy: -330, t: 0, life: 0.5, col: '#ffd54a', r: 9, coin: true });
  } else if (ch === 'T') {
    setTile(col, row, 'u'); G.bumps.push({ col, row, t: 0 }); spawnItem('star', col, row); SFX.power();
  } else if (ch === '!') {
    setTile(col, row, 'u'); G.bumps.push({ col, row, t: 0 });
    spawnItem(p.state === 'small' ? 'mushroom' : 'flower', col, row); SFX.power();
  } else if (ch === 'b') {
    if (p.state === 'small') { G.bumps.push({ col, row, t: 0 }); SFX.bump(); return; }
    setTile(col, row, '.'); SFX.brick(); score(SC_BRICK);
    for (let i = 0; i < 6; i++) {
      const a = -Math.PI / 2 + (i - 2.5) * 0.5;
      G.parts.push({ x: bx, y: by + 8, vx: Math.cos(a) * 190, vy: Math.sin(a) * 240, t: 0, life: 0.7, col: '#b5713f', r: 5, brick: true });
    }
  }
}

function addCoinCount(n) {
  G.coinCount += n;
  while (G.coinCount >= COIN_LIFE) { G.coinCount -= COIN_LIFE; G.lives++; popup(G.player.x, G.player.y - 20, '1UP!', '#7ef29a'); SFX.unlock(); }
}

// ---- 道具生成：先从块顶冒出 0.5s，再进入活动态 ----
function spawnItem(type, col, row) {
  const w = type === 'flower' ? ITEM.flower.w : ITEM[type].w, h = type === 'flower' ? ITEM.flower.h : ITEM[type].h;
  G.items.push({
    type, x: col * TILE + (TILE - w) / 2, y: row * TILE + TILE, w, h,
    vx: 0, vy: 0, emerge: 0.5, riseTo: row * TILE - h - 0.01, state: 'emerge', dir: 1, onGround: false,
  });
}

// ---- 玩家状态切换（变大/变小需保持脚底位置）----
function setPlayerState(p, st) {
  const wantH = st === 'small' ? PLAYER_SMALL_H : PLAYER_BIG_H;
  if (wantH === p.h) { p.state = st; return; }
  const feet = p.y + p.h;
  p.state = st; p.h = wantH; p.y = feet - wantH;
}

// ---- 玩家更新 ----
function updatePlayer(p, dt) {
  p.prevBottom = p.y + p.h;
  if (p.dead) {
    p.deadT += dt; p.vy += GRAV * dt * 0.7; p.y += p.vy * dt;
    if (p.deadT > 1.7) loseLife();
    return;
  }
  const wantL = IN.left && !IN.right, wantR = IN.right && !IN.left;
  const maxSpd = IN.run ? RUN_MAX : WALK_MAX;
  const acc = p.onGround ? ACC : AIR_ACC;
  if (wantL && !wantR) { if (p.vx > -maxSpd) p.vx = Math.max(p.vx - acc * dt, -maxSpd); p.dir = -1; p.skid = p.onGround && p.vx > 160 ? 0.2 : 0; }
  else if (wantR && !wantL) { if (p.vx < maxSpd) p.vx = Math.min(p.vx + acc * dt, maxSpd); p.dir = 1; p.skid = p.onGround && p.vx < -160 ? 0.2 : 0; }
  else if (p.onGround) {
    const f = FRICTION * dt;
    if (Math.abs(p.vx) <= f) p.vx = 0; else p.vx -= Math.sign(p.vx) * f;
  } else p.vx *= (1 - 0.25 * dt);
  if (p.vx > maxSpd) p.vx = Math.max(maxSpd, p.vx - 1100 * dt);
  if (p.vx < -maxSpd) p.vx = Math.min(-maxSpd, p.vx + 1100 * dt);

  // 跳跃：缓冲 + 土狼 + 松手截断
  if (IN.jump && !jumpWasDown) p.jbuf = JBUF;
  jumpWasDown = IN.jump;
  p.jbuf = Math.max(0, p.jbuf - dt);
  p.coyote = p.onGround ? COYOTE : Math.max(0, p.coyote - dt);
  if (p.jbuf > 0 && p.coyote > 0) {
    p.vy = -JUMP_V; p.onGround = false; p.coyote = 0; p.jbuf = 0; p.jumpHeld = true;
    p.state === 'small' ? SFX.jump() : SFX.bigjump();
  }
  if (!IN.jump && p.jumpHeld && p.vy < -JUMP_CUT) { p.vy = -JUMP_CUT; p.jumpHeld = false; }
  if (p.vy >= 0) p.jumpHeld = false;

  // 火球
  p.fireCd = Math.max(0, p.fireCd - dt);
  if (IN.fire && p.state === 'fire' && p.fireCd <= 0 && G.fires.length < 2) {
    p.fireCd = 0.28;
    G.fires.push({ x: p.x + (p.dir > 0 ? p.w : -12), y: p.y + p.h * 0.38, w: 14, h: 14, vx: p.dir * FIRE_SPD, vy: 120, bounces: 0, t: 0 });
    SFX.fire();
  }

  p.vy += GRAV * dt;
  if (p.vy > MAX_FALL) p.vy = MAX_FALL;

  sweepX(p, p.vx * dt);
  const land = sweepY(p, p.vy * dt);
  const wasGround = p.onGround;
  p.onGround = false;
  if (land) {
    if (land.side === 'down') {
      p.onGround = true;
      if (p.vy > 640) burst(p.x + p.w / 2, p.y + p.h, '#cfcfcf', 4, 90);
      p.vy = 0;
      if (!wasGround) G.combo = 0;
    } else {
      p.vy = 0;
      const mid = p.x + p.w / 2;
      let c0 = land.cols[0];
      for (const c of land.cols) if (Math.abs(c * TILE + TILE / 2 - mid) < Math.abs(c0 * TILE + TILE / 2 - mid)) c0 = c;
      hitBlock(c0, land.row, p);
    }
  }
  // 金币拾取
  const cl = Math.floor(p.x / TILE), cr = Math.floor((p.x + p.w - 1) / TILE);
  const ct = Math.floor(p.y / TILE), cb = Math.floor((p.y + p.h - 1) / TILE);
  for (let r = ct; r <= cb; r++) for (let c = cl; c <= cr; c++) if (tileChar(c, r) === 'C') {
    setTile(c, r, '.'); addCoinCount(1); score(SC_COIN); SFX.coin();
    burst(c * TILE + TILE / 2, r * TILE + TILE / 2, '#ffd54a', 5, 120);
  }
  // 旗杆
  if (G.flagCol >= 0 && p.x + p.w >= G.flagCol * TILE + 6) triggerFlag(p);
  // 深渊
  if (p.y > VH + 60) { killPlayer(true); return; }
  // 检查点
  if (!p.checkpointed && G.checkX > 0 && p.x >= G.checkX) {
    p.checkpointed = true; G.checkTaken = true;
    G.spawnX = G.checkX; G.spawnY = G.checkY;
    popup(p.x, p.y - 24, '检查点', '#9fe8ff');
  }

  p.invuln = Math.max(0, p.invuln - dt);
  p.star = Math.max(0, p.star - dt);
  p.anim += dt * (Math.abs(p.vx) / 60 + 1);
  p.skid = Math.max(0, p.skid - dt);
  if (G.timeLeft <= 60) G.timeWarn = 1;
}

function triggerFlag(p) {
  if (G.scene !== 'play') return;
  const top = Math.floor(p.y / TILE);
  G.flagContactRow = Math.max(0, top);
  G.scene = 'clear'; G.clearT = 0; p.vx = 0; p.vy = 0; p.flagSlide = true;
  SFX.clear();
}

function killPlayer(silentFall) {
  const p = G.player;
  if (p.dead || p.invuln > 0 && !silentFall) return;
  p.dead = true; p.deadT = 0; p.vy = silentFall ? 0 : -540; p.vx = 0; p.star = 0;
  if (!silentFall) SFX.die(); else SFX.hurt();
}

function hurtPlayer() {
  const p = G.player;
  if (p.dead || p.invuln > 0 || p.star > 0) return;
  if (p.state === 'small') { killPlayer(false); return; }
  setPlayerState(p, 'small');
  p.invuln = HIT_INVULN; SFX.hurt();
  popup(p.x, p.y - 16, '缩小了', '#ffd0d0');
}

function loseLife() {
  G.lives--;
  if (G.lives < 0) { G.scene = 'over'; G.overT = 0; saveBest(); return; }
  respawn();
}
function respawn() {
  const p = makePlayer(G.spawnX, G.spawnY);
  p.checkpointed = G.checkTaken;
  p.invuln = SPAWN_GRACE;                       // 复活保护：避免出生点旁的游荡敌人瞬间收命
  G.player = p; G.camX = Math.max(0, p.x - VW * 0.38);
  G.timeLeft = curLevel().time * DIFFS[G.diff].timeMul;
  G.combo = 0; G.fires = [];
}

// ---- 敌人更新 ----
function updateEnemy(e, dt) {
  const em = DIFFS[G.diff].enemyMul;
  e.anim += dt * 6;
  if (e.dead) { e.deadT += dt; e.y += 260 * dt; if (e.deadT > 0.45) e.remove = true; return; }
  if (e.squash > 0) { e.squash -= dt; if (e.squash <= 0) e.remove = true; return; }
  e.hitCd = Math.max(0, e.hitCd - dt);

  if (e.state === 'shell' || e.state === 'slide') {
    e.vy += GRAV * dt; if (e.vy > MAX_FALL) e.vy = MAX_FALL;
    if (sweepX(e, e.vx * dt) !== null) {
      if (e.state === 'slide') { SFX.bump(); burst(e.x + e.w / 2, e.y + e.h / 2, '#ffe08a', 5, 150); }
      e.vx = -e.vx; e.dir = -e.dir;
    }
    const land = sweepY(e, e.vy * dt);
    if (land && land.side === 'down') { e.onGround = true; e.vy = 0; }
    if (e.state === 'shell') {
      e.restT += dt;
      if (e.restT > SHELL_IDLE) { e.state = 'walk'; e.vx = ENEMY[e.kind].spd * em * -1; e.dir = -1; e.h = ENEMY[e.kind].h; e.y -= (ENEMY[e.kind].h - SHELL_H); }
    }
    // 滑行中的壳撞到的敌人立毙（不含其他壳，避免互相踢皮球）
    if (e.state === 'slide') {
      for (const o of G.enemies) {
        if (o === e || o.dead || o.squash > 0) continue;
        if (o.state === 'shell' || o.state === 'slide') continue;
        if (aabb(e, o)) killEnemy(o, 'shell');
      }
    }
    if (e.y > VH + 80) e.remove = true;
    return;
  }

  // 行走
  const d = ENEMY[e.kind];
  e.vx = d.spd * em * e.dir;               // dir=-1 向左走
  e.vy += GRAV * dt; if (e.vy > MAX_FALL) e.vy = MAX_FALL;
  if (d.hop > 0) {
    e.hopT -= dt;
    if (e.hopT <= 0 && e.onGround) { e.vy = -520 * (0.9 + 0.1 * em); e.hopT = d.hop / Math.max(0.5, em); }
  }
  const hitC = sweepX(e, e.vx * dt);
  if (hitC !== null) {
    e.dir = -e.dir;
  } else if (e.kind === 'k' && e.onGround) {
    // 团团龟在坑沿回头
    const aheadX = e.dir < 0 ? e.x - 2 : e.x + e.w + 2;
    if (!isSolidCh(tileChar(Math.floor(aheadX / TILE), Math.floor((e.y + e.h + 4) / TILE)))) e.dir = -e.dir;
  }
  const land = sweepY(e, e.vy * dt);
  e.onGround = false;
  if (land && land.side === 'down') { e.onGround = true; e.vy = 0; }
  if (e.y > VH + 80) e.remove = true;
}
const SHELL_H = 22;

// ---- 火球更新 ----
function updateFire(f, dt) {
  f.t += dt;
  f.vy += GRAV * 0.85 * dt;
  if (sweepX(f, f.vx * dt) !== null) { f.remove = true; burst(f.x + 7, f.y + 7, '#ffb74d', 5, 130); }
  const land = sweepY(f, f.vy * dt);
  if (land) {
    if (land.side === 'down') { f.vy = -FIRE_BOUNCE; f.bounces++; }
    else { f.remove = true; burst(f.x + 7, f.y + 7, '#ffb74d', 4, 120); }
  }
  if (f.bounces > 5 || f.t > FIRE_LIFE || f.x < G.camX - 40 || f.x > G.camX + VW + 40) f.remove = true;
}

// ---- 道具更新 ----
function updateItem(it, dt) {
  if (it.state === 'emerge') {
    it.emerge -= dt;
    it.y = Math.max(it.riseTo, it.y - (TILE + it.h) / 0.5 * dt);
    if (it.emerge <= 0) {
      it.y = it.riseTo;
      it.state = it.type === 'flower' ? 'still' : (it.type === 'star' ? 'starMove' : 'move');
      if (it.type === 'mushroom') it.vx = ITEM.mushroom.spd;
      if (it.type === 'star') { it.vx = ITEM.star.vx; it.vy = -300; }
    }
    return;
  }
  if (it.state === 'move') {
    it.vy += GRAV * dt; if (it.vy > MAX_FALL) it.vy = MAX_FALL;
    if (sweepX(it, it.vx * dt) !== null) it.vx = -it.vx;
    const land = sweepY(it, it.vy * dt);
    if (land && land.side === 'down') { it.vy = 0; it.onGround = true; }
  } else if (it.state === 'starMove') {
    it.vy += GRAV * dt; if (it.vy > MAX_FALL) it.vy = MAX_FALL;
    if (sweepX(it, it.vx * dt) !== null) it.vx = -it.vx;
    const land = sweepY(it, it.vy * dt);
    if (land && land.side === 'down') { it.vy = -ITEM.star.spd; }
  }
  if (it.y > VH + 60) it.remove = true;
}

// ---- 玩家与敌人/道具接触 ----
function contactPass(dt) {
  const p = G.player;
  if (p.dead) return;
  for (const e of G.enemies) {
    if (e.dead || e.squash > 0 || e.hitCd > 0) continue;
    if (!aabb(p, e)) continue;
    const feet = p.prevBottom, head = p.y;
    const canStomp = p.vy > 30 && feet <= e.y + Math.max(12, p.vy * dt + 12);
    if (p.star > 0) { killEnemy(e, 'star'); continue; }
    if (e.state === 'shell' || e.state === 'slide') {
      if (canStomp && e.state === 'slide') { e.state = 'shell'; e.vx = 0; e.restT = 0; SFX.stomp(); score(100, e.x, e.y - 6); p.vy = -STOMP_BOUNCE * 0.8; continue; }
      if (canStomp) { e.state = 'shell'; e.vx = 0; continue; }
      if (e.state === 'slide') { hurtPlayer(); e.hitCd = 0.3; continue; }
      // 踢壳
      const kd = p.x + p.w / 2 < e.x + e.w / 2 ? 1 : -1;
      e.state = 'slide'; e.vx = kd * SHELL_SPD; e.dir = kd; e.restT = 0;
      e.x += kd * 6; SFX.kick(); score(150, e.x, e.y - 6, '#ffe08a');
      continue;
    }
    if (canStomp) { stompEnemy(e, p); continue; }
    hurtPlayer();
  }
  for (const it of G.items) {
    if (it.remove || it.state === 'emerge') continue;
    if (!aabb(p, it)) continue;
    it.remove = true;
    if (it.type === 'mushroom') {
      if (p.state === 'small') setPlayerState(p, 'big');
      p.invuln = Math.max(p.invuln, 0.4); score(SC_POWER, it.x, it.y - 8, '#ffd08a'); SFX.power();
      popup(it.x, it.y - 30, '菇侠变大！', '#ffd08a');
    } else if (it.type === 'flower') {
      setPlayerState(p, p.state === 'small' ? 'big' : p.state);
      p.state = 'fire'; score(SC_POWER + 500, it.x, it.y - 8, '#ff8a65'); SFX.flower();
      popup(it.x, it.y - 30, '火花力量！按 X 发射', '#ff8a65');
    } else {
      p.star = DIFFS[G.diff].star; score(SC_STAR_PICK, it.x, it.y - 8, '#fff176'); SFX.star();
      popup(it.x, it.y - 30, '无敌星星！', '#fff176');
    }
    burst(it.x + it.w / 2, it.y + it.h / 2, '#ffe08a', 10, 200);
  }
  for (const f of G.fires) {
    if (f.remove) continue;
    for (const e of G.enemies) {
      if (e.dead || e.squash > 0 || !aabb(f, e)) continue;
      killEnemy(e, 'fire'); f.remove = true; break;
    }
  }
}

function stompEnemy(e, p) {
  p.vy = -STOMP_BOUNCE; p.jumpHeld = false;
  G.combo = Math.min(G.combo + 1, 4);
  const mul = [1, 2, 4, 8, 8][G.combo - 1] || 1;
  const base = ENEMY[e.kind].pts * mul;
  if (e.state === 'walk' && ENEMY[e.kind].shell) {
    e.state = 'shell'; e.vx = 0; e.restT = 0; e.y += e.h - SHELL_H; e.h = SHELL_H;
    SFX.stomp(); score(base, e.x, e.y - 6);
    popup(e.x + e.w / 2 - 10, e.y - 26, G.combo > 1 ? '连击 x' + mul : '踩壳！', '#ffe08a');
    burst(e.x + e.w / 2, e.y + e.h, '#d7c9a7', 5, 120);
  } else {
    e.squash = 0.4; e.vx = 0; SFX.stomp(); score(base, e.x, e.y - 6);
    if (G.combo > 1) popup(e.x + e.w / 2 - 10, e.y - 26, '连击 x' + mul, '#ffe08a');
    burst(e.x + e.w / 2, e.y + e.h - 4, '#c9b28a', 5, 110);
  }
}

function killEnemy(e, how) {
  if (e.dead) return;
  e.dead = true; e.deadT = 0;
  const pts = ENEMY[e.kind].pts * (how === 'shell' ? 2 : 1);
  score(pts, e.x, e.y - 6, how === 'shell' ? '#ffd54a' : '#fff');
  burst(e.x + e.w / 2, e.y + e.h / 2, how === 'shell' ? '#ffd54a' : '#cfcfcf', 7, 170);
  if (how === 'shell') { SFX.shell(); e.vy = -320; } else SFX.stomp();
}

// ---- 关卡流程 ----
function curLevel() { return LEVELS[G.levelIdx]; }
function startLevel(idx) {
  G.levelIdx = idx;
  buildLevel(idx);
  G.lives = DIFFS[G.diff].lives;
  G.timeWarn = 0;
  G.combo = 0;
  G.lastSecShown = -1;
  respawn();
  G.scene = 'play';
  G.started = true;
}
function beginRun() {
  G.score = 0; G.coinCount = 0;
  startLevel(Math.max(0, Math.min(G.levelIdx, G.unlock - 1)));
}
function nextLevel() {
  if (G.levelIdx + 1 >= LEVELS.length) { G.scene = 'win'; saveBest(); return; }
  G.levelIdx++;
  startLevel(G.levelIdx);
}
function saveBest() {
  const k = G.diff + '_' + G.levelIdx;
  if ((G.best[k] | 0) < G.score) { G.best[k] = G.score; }
  try { localStorage.setItem(BEST_KEY, JSON.stringify(G.best)); localStorage.setItem(UNLOCK_KEY, String(G.unlock)); } catch (e) {}
  return G.best[k] | 0;
}
function loadBest() { try { G.best = JSON.parse(localStorage.getItem(BEST_KEY) || '{}') || {}; } catch (e) { G.best = {}; } }
function loadUnlock() { let v = 1; try { v = localStorage.getItem(UNLOCK_KEY) | 0; } catch (e) {} G.unlock = Math.min(Math.max(1, v), LEVELS.length); }
function loadDiff() { let v = ''; try { v = localStorage.getItem(DIFF_KEY); } catch (e) {} if (DIFFS[v]) G.diff = v; }
function saveDiff() { try { localStorage.setItem(DIFF_KEY, G.diff); } catch (e) {} }

function finishClear() {
  const timeBonus = Math.max(0, Math.floor(G.timeLeft)) * SC_TIME;
  const flagBonus = Math.max(0, (G.flagBotRow - G.flagContactRow)) * SC_FLAG_PER_ROW;
  const before = G.score;
  G.score += Math.round((timeBonus + flagBonus) * DIFFS[G.diff].scoreMul);
  G.unlock = Math.max(G.unlock, Math.min(LEVELS.length, G.levelIdx + 2));
  const best = saveBest();
  G.lastResult = {
    level: curLevel().name, timeBonus, flagBonus, gained: G.score - before, total: G.score,
    coins: G.coinCount, lives: G.lives, best,
  };
  G.scene = 'result';
}

const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, U = 1, OX = 0, OY = 0, AVAIL_H = 0;
let PORTRAIT = false, BAR_H = 0, KEYS = null;   // KEYS：手机虚拟键屏幕坐标
let lastTouch = false;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  PORTRAIT = H > W * 1.08;
  const showKeys = PORTRAIT || lastTouch;
  BAR_H = showKeys ? Math.min(150, H * 0.24) : 0;
  AVAIL_H = H - BAR_H;
  U = Math.min(W / VW, AVAIL_H / VH);
  if (U * VH > AVAIL_H - 4 && AVAIL_H > 320) U = Math.min(U, (AVAIL_H - 4) / VH);
  OX = (W - VW * U) / 2; OY = (AVAIL_H - VH * U) / 2;
  buildKeys(showKeys);
}
function d2sx(x) { return OX + x * U; }
function d2sy(y) { return OY + y * U; }

function buildKeys(show) {
  if (!show) { KEYS = null; return; }
  const band = H - BAR_H;
  const s = Math.min(BAR_H * 0.52, W * 0.15);
  const pad = Math.max(12, W * 0.035);
  const sj = s * 1.22, sm = s * 0.82;
  const cy = band + (BAR_H - s) / 2;
  KEYS = {
    left:  { x: pad, y: cy, w: s, h: s, label: '◀' },
    right: { x: pad + s + pad * 0.8, y: cy, w: s, h: s, label: '▶' },
    jump:  { x: W - pad - sj, y: band + BAR_H - sj - 6, w: sj, h: sj, label: '跳' },
    run:   { x: W - pad - sj - 8 - sm, y: band + BAR_H - sm - 6, w: sm, h: sm, label: '冲' },
    fire:  { x: W - pad - sj - 8 - sm, y: band + 6, w: sm, h: sm, label: '弹' },
  };
}

// ---- 绘图小工具 ----
function rr(x, y, w, h, r) {
  const k = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + k, y); ctx.lineTo(x + w - k, y); ctx.quadraticCurveTo(x + w, y, x + w, y + k);
  ctx.lineTo(x + w, y + h - k); ctx.quadraticCurveTo(x + w, y + h, x + w - k, y + h);
  ctx.lineTo(x + k, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - k);
  ctx.lineTo(x, y + k); ctx.quadraticCurveTo(x, y, x + k, y);
  ctx.closePath();
}
function txt(s, x, y, size, col, align, weight) {

}

function themeOf(sky) { return SKYTHEME[sky] || SKYTHEME.day; }
function hash1(n) { let x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); }
function drawSky(sky) {
  const g = SKYCOL[sky] || SKYCOL.day, th = themeOf(sky);
  const grad = ctx.createLinearGradient(0, 0, 0, VH);
  grad.addColorStop(0, g[0]); grad.addColorStop(0.62, g[1]); grad.addColorStop(1, g[2]);
  ctx.fillStyle = grad; ctx.fillRect(0, 0, VW, VH);
  const par = G.camX * 0.22;
  // 星空（夜色主题，位置由 hash1 决定，不吃随机）
  if (th.stars) {
    for (let i = 0; i < 90; i++) {
      let sx = i * 149 + hash1(i * 3.3) * 120 - G.camX * 0.12;
      sx = ((sx % VW) + VW) % VW;
      const sy = 14 + hash1(i * 7.7) * 236, tw = 0.45 + 0.55 * Math.abs(Math.sin(G.t * 1.4 + i));
      ctx.fillStyle = 'rgba(255,255,255,' + (tw * th.stars).toFixed(3) + ')';
      const rr0 = 0.9 + hash1(i * 11.1) * 1.7;
      ctx.fillRect(sx, sy, rr0, rr0);
    }
  }
  // 远山
  ctx.fillStyle = th.hill;
  for (let i = -1; i < 9; i++) {
    const bx = i * 200 - (par % 200), hh = 60 + hash1(i + 3) * 70;
    ctx.beginPath(); ctx.moveTo(bx, VH - 72); ctx.lineTo(bx + 100, VH - 72 - hh); ctx.lineTo(bx + 200, VH - 72); ctx.closePath(); ctx.fill();
  }
  // 云
  ctx.save(); ctx.globalAlpha = th.cloud;
  for (let i = 0; i < 22; i++) {
    const cx = i * 170 - (G.camX * 0.35 % 170) - 60, cy = 40 + hash1(i * 2.7) * 120, s = 0.7 + hash1(i * 5.1) * 0.7;
    cloud(cx, cy, s);
  }
  ctx.restore();
  // 灌木
  const par2 = G.camX * 0.55;
  ctx.fillStyle = th.bush;
  for (let i = 0; i < 26; i++) {
    const bx = i * 150 - (par2 % 150) - 40;
    for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(bx + k * 20, VH - 74 - (k === 1 ? 12 : 0), 20, Math.PI, 0); ctx.fill(); }
    ctx.fillRect(bx - 20, VH - 76, 78, 8);
  }
}
function cloud(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(255,255,255,0.9)';

  ctx.arc(0, 0, 18, Math.PI * 0.5, Math.PI * 1.5); ctx.arc(14, -8, 20, Math.PI * 0.9, Math.PI * 1.95);
  ctx.arc(34, 0, 16, Math.PI * 1.4, Math.PI * 0.5); ctx.closePath(); ctx.fill();
  ctx.fillRect(0, 10, 34, 16);
  ctx.restore();
}

// ---- 瓦片 ----
function bumpOff(c, r) {
  for (const b of G.bumps) if (b.col === c && b.row === r) return -Math.sin(Math.min(1, b.t / 0.22) * Math.PI) * 12;
  return 0;
}
function drawTiles() {
  const th = themeOf(curLevel() ? curLevel().sky : 'day');
  const c0 = Math.max(0, Math.floor(G.camX / TILE) - 1), c1 = Math.min(G.cols - 1, Math.ceil((G.camX + VW) / TILE));
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = G.grid[r][c];
    if (ch === '.' || ch === 'F') continue;
    const x = c * TILE, y = r * TILE + bumpOff(c, r);
    if (ch === '#') drawGround(x, y, c, r, th);
    else if (ch === 'X') drawStone(x, y);
    else if (ch === 'b') drawBrick(x, y);
    else if (ch === '?' || ch === '!' || ch === 'T') drawQMark(x, y, ch);
    else if (ch === 'u') drawUsed(x, y);
    else if (ch === 'p') drawPipe(x, y, c, r, th);
    else if (ch === 'C') drawCoinTile(x + TILE / 2, y + TILE / 2, (c + r) * 0.7);
  }
  if (G.flagCol >= 0) drawFlag();
}
function drawGround(x, y, c, r, th) {

}
function drawStone(x, y) {
  ctx.fillStyle = '#b9bcc6'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#e2e5ee'; ctx.fillRect(x + 3, y + 3, TILE - 6, 5);

function drawBrick(x, y) {
  ctx.fillStyle = '#c1613a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(x, y, TILE, 4);

  ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
  ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
  ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
  ctx.moveTo(x + TILE * 0.75, y + TILE / 2); ctx.lineTo(x + TILE * 0.75, y + TILE);

}
function drawQMark(x, y, ch) {
  const pulse = 0.5 + 0.5 * Math.sin(G.t * 4 + x * 0.05);
  ctx.fillStyle = ch === 'T' ? '#7a4fd0' : '#e5a021';

  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  [[4, 4], [TILE - 8, 4], [4, TILE - 8], [TILE - 8, TILE - 8]].forEach(p => ctx.fillRect(x + p[0] - 2, y + p[1] - 2, 4, 4));
  const s = ch === '?' ? '?' : ch === '!' ? '!' : '★';
  ctx.save();
  ctx.globalAlpha = 0.75 + pulse * 0.25;
  txt(s, x + TILE / 2, y + TILE / 2 + 1, TILE * 0.62, ch === 'T' ? '#fff' : '#7a4a10', 'center');
  ctx.restore();
}

// ---- 道具 / 火球 ----
function drawItem(it) {
  const cx = it.x + it.w / 2, cy = it.y + it.h / 2;

    ctx.fillStyle = '#f0f0e6'; rr(cx - 6, cy - 2, 12, 14, 4); ctx.fill();
    ctx.fillStyle = '#e8552d'; ctx.beginPath(); ctx.arc(cx, cy - 1, 14, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#ffe9d0'; ctx.beginPath(); ctx.arc(cx - 7, cy - 6, 3.5, 0, 7); ctx.arc(cx + 6, cy - 8, 3, 0, 7); ctx.fill();
    ctx.fillStyle = '#332'; ctx.beginPath(); ctx.arc(cx - 3, cy + 2, 1.6, 0, 7); ctx.arc(cx + 3, cy + 2, 1.6, 0, 7); ctx.fill();
  } else if (it.type === 'flower') {
    const s = 1 + Math.sin(G.t * 6) * 0.06;
    ctx.save(); ctx.translate(cx, cy); ctx.scale(s, s);
    for (let i = 0; i < 6; i++) { ctx.fillStyle = i % 2 ? '#ff8a3d' : '#ffd23d'; ctx.beginPath(); ctx.ellipse(Math.cos(i) * 9, Math.sin(i) * 9, 7, 7, 0, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#7a3b12'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#3f9f4f'; ctx.fillRect(cx - 2, cy + 8, 4, 10);
  } else {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(G.t * 5) * 0.3);
    ctx.fillStyle = '#ffe14d'; ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + i * Math.PI * 2 / 5, a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * 15, Math.sin(a) * 15); ctx.lineTo(Math.cos(a2) * 6.5, Math.sin(a2) * 6.5);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(-5, -3, 3, 5); ctx.fillRect(2, -3, 3, 5);
    ctx.restore();
  }
}
function drawFire(f) {

// ---- 主角（原创美术：橙发菇侠，护目镜 + 围巾 + 工装背带裤）----
function drawPlayer() {
  const p = G.player;
  if (p.invuln > 0 && p.star <= 0 && Math.floor(G.t * 18) % 2 === 0) return;
  const cx = p.x + p.w / 2, feet = p.y + p.h, h = p.h;
  ctx.save(); ctx.translate(cx, 0);
  const body = p.state === 'fire' ? '#ff7a45' : '#e94f3b';
  const overall = p.state === 'fire' ? '#fff3e0' : '#2f6fd0';
  const skin = '#ffcf9e';
  const sc = h / PLAYER_BIG_H;
  ctx.scale(p.dir, 1);
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,0.18)'; ctx.beginPath(); ctx.ellipse(0, feet + 2, p.w * 0.55, 4, 0, 0, 7); ctx.fill();
  const walk = p.onGround && Math.abs(p.vx) > 20 ? Math.sin(p.anim * 3.4) : 0;
  const air = !p.onGround;
  // 腿
  ctx.fillStyle = overall;
  ctx.fillRect(-9 * sc, feet - 14 * sc, 7 * sc, 14 * sc - (air ? 4 : walk * 3));
  ctx.fillRect(2 * sc, feet - 14 * sc, 7 * sc, 14 * sc + (air ? -2 : walk * 3));
  ctx.fillStyle = '#5b3a1e';
  ctx.fillRect(-10 * sc, feet - 4, 9 * sc, 4); ctx.fillRect(1 * sc, feet - 4, 9 * sc, 4);
  // 身体（背带裤）
  const bodyTop = feet - (p.state === 'small' ? 17 * sc : 24 * sc);
  ctx.fillStyle = overall; rr(-11 * sc, bodyTop, 22 * sc, feet - 14 * sc - bodyTop + 2, 4); ctx.fill();
  ctx.fillStyle = body; rr(-11 * sc, bodyTop, 22 * sc, 6, 3); ctx.fill();
  ctx.fillStyle = '#ffd84d'; ctx.fillRect(-8 * sc, bodyTop + 8, 3, 3); ctx.fillRect(5 * sc, bodyTop + 8, 3, 3);
  // 围巾
  ctx.fillStyle = '#f4c430'; rr(-12 * sc, bodyTop - 5, 24 * sc, 6, 3); ctx.fill();
  const flap = Math.sin(G.t * 9) * 3 - (p.vx * 0.02);
  ctx.fillStyle = '#f4c430';
  ctx.beginPath(); ctx.moveTo(-8 * sc, bodyTop - 2); ctx.lineTo(-18 * sc + flap, bodyTop + 8); ctx.lineTo(-9 * sc, bodyTop + 10); ctx.closePath(); ctx.fill();
  // 头
  const headR = p.state === 'small' ? 10 * sc : 11 * sc;
  const headY = bodyTop - 6 - headR * 0.6;
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(0, headY, headR, 0, 7); ctx.fill();
  // 头发（橙色短刺）
  ctx.fillStyle = '#e08a2e';
  ctx.beginPath(); ctx.arc(0, headY - 1, headR, Math.PI * 1.02, Math.PI * 1.98); ctx.fill();
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 6 - 3, headY - headR + 2); ctx.lineTo(i * 6, headY - headR - 6); ctx.lineTo(i * 6 + 3, headY - headR + 2); ctx.closePath(); ctx.fill(); }
  // 护目镜
  ctx.fillStyle = 'rgba(40,44,58,0.9)'; rr(-headR, headY - 5, headR * 2, 7, 3); ctx.fill();
  ctx.fillStyle = p.star > 0 ? '#fff' : '#8ee7ff'; rr(1, headY - 4, headR - 2, 5, 2); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillRect(-headR + 2, headY - 4, 4, 2);
  // 眼/嘴
  ctx.fillStyle = '#3a2a1c'; ctx.beginPath(); ctx.arc(headR * 0.42, headY + 3, 1.7, 0, 7); ctx.fill();
  if (p.dead) { ctx.fillStyle = '#3a2a1c'; ctx.fillRect(headR * 0.2, headY + 5, 6, 2); }
  else { ctx.strokeStyle = '#3a2a1c'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(headR * 0.3, headY + 4, 3.2, 0.1, 1.2); ctx.stroke(); }
  // 手臂
  ctx.strokeStyle = body; ctx.lineWidth = 5 * sc; ctx.lineCap = 'round';
  const armA = air ? -1.1 : (p.skid > 0 ? 1.4 : Math.sin(p.anim * 3.4) * 0.9);
  ctx.beginPath(); ctx.moveTo(6 * sc, bodyTop + 6); ctx.lineTo(6 * sc + Math.cos(armA) * 12 * sc, bodyTop + 6 + Math.sin(armA) * 12 * sc); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-6 * sc, bodyTop + 6); ctx.lineTo(-6 * sc + Math.cos(Math.PI - armA) * 12 * sc, bodyTop + 6 + Math.sin(Math.PI - armA) * 12 * sc); ctx.stroke();
  ctx.restore();
  if (p.star > 0) {
    ctx.globalAlpha = 0.5 + 0.3 * Math.sin(G.t * 20);
    ctx.strokeStyle = ['#ffe14d', '#ff8a3d', '#7ee08a'][Math.floor(G.t * 10) % 3];
    ctx.lineWidth = 3; rr(p.x - 5, p.y - 5, p.w + 10, p.h + 10, 8); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ---- 粒子 / 飘字 ----
function drawFx() {
  for (const q of G.parts) {
    const k = 1 - q.t / q.life;
    ctx.globalAlpha = Math.max(0, k);
    if (q.coin) drawCoinTile(q.x, q.y, 0);
    else if (q.brick) { ctx.fillStyle = q.col; ctx.fillRect(q.x - q.r, q.y - q.r, q.r * 2, q.r * 2); }
    else { ctx.fillStyle = q.col; ctx.beginPath(); ctx.arc(q.x, q.y, q.r * k + 1, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const q of G.pops) {
    const k = q.t / 0.9;
    ctx.globalAlpha = Math.max(0, 1 - k);
    txt(q.text, q.x, q.y - k * 34, 15, q.col, 'center');
  }
  ctx.globalAlpha = 1;
}

// ============================================================
// 更新循环 + HUD/面板 + 输入 + 主循环
// ============================================================
function updateFx(dt) {
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const q = G.parts[i];
    q.t += dt; q.vy += 1250 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
    if (q.t >= q.life) G.parts.splice(i, 1);
  }
  for (let i = G.pops.length - 1; i >= 0; i--) { const q = G.pops[i]; q.t += dt; if (q.t > 0.9) G.pops.splice(i, 1); }
  for (let i = G.bumps.length - 1; i >= 0; i--) { const b = G.bumps[i]; b.t += dt; if (b.t > 0.22) G.bumps.splice(i, 1); }
}

function updateCamera() {
  const p = G.player, target = p.x + p.w / 2 - VW * 0.38;
  const maxCam = Math.max(0, G.cols * TILE - VW);
  G.camX = Math.max(0, Math.min(maxCam, target));
}

function update(dt) {
  G.t += dt;
  updateFx(dt);
  if (G.scene === 'clear') { updateClear(dt); return; }
  if (G.scene !== 'play') return;

  G.timeLeft -= dt;
  if (G.timeLeft <= 0 && !G.player.dead) { G.timeLeft = 0; killPlayer(true); popup(G.player.x, G.player.y - 20, '时间到！', '#ffd0d0'); }

  updatePlayer(G.player, dt);
  const x0 = G.camX - 160, x1 = G.camX + VW + 260;
  for (const e of G.enemies) if (!e.remove && e.x > x0 - 400 && e.x < x1) updateEnemy(e, dt);
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].remove) G.enemies.splice(i, 1);
  for (const it of G.items) if (!it.remove) updateItem(it, dt);
  for (let i = G.items.length - 1; i >= 0; i--) if (G.items[i].remove) G.items.splice(i, 1);
  for (const f of G.fires) if (!f.remove) updateFire(f, dt);
  for (let i = G.fires.length - 1; i >= 0; i--) if (G.fires[i].remove) G.fires.splice(i, 1);
  contactPass(dt);
  for (let i = G.enemies.length - 1; i >= 0; i--) if (G.enemies[i].remove) G.enemies.splice(i, 1);
  updateCamera();
  if (Math.floor(G.timeLeft) !== G.lastSecShown) {
    G.lastSecShown = Math.floor(G.timeLeft);
    if (G.timeLeft <= 30 && G.timeLeft > 0 && !G.player.dead) tone(880, 0.05, 'square', 0.07);
  }
}

function updateClear(dt) {
  const p = G.player;
  G.clearT += dt;
  const groundY = (ROWS - 2) * TILE - p.h - 0.01;
  if (G.clearT < 1.0) {
    p.dir = 1; p.anim += dt * 4;
    p.x = G.flagCol * TILE - p.w + 8;
    p.y = Math.min(groundY, p.y + 210 * dt);
    G.flagY = Math.min(groundY + p.h * 0.4, (G.flagY == null ? G.flagTopRow * TILE + 12 : G.flagY) + 210 * dt);
  } else if (G.clearT < 2.1) {
    p.x += 165 * dt; p.anim += dt * 12;
    if (p.y < groundY) p.y = Math.min(groundY, p.y + 900 * dt);
  } else { finishClear(); }
}

// ============================================================
// 绘制
// ============================================================
function drawScene() {
  G.ui = [];
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#0d1b2a'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(OX, OY, VW * U, VH * U); ctx.clip();
  ctx.translate(OX, OY); ctx.scale(U, U);
  const lv = curLevel();
  drawSky(lv.sky);
  if (G.started) {
    ctx.save(); ctx.translate(-Math.round(G.camX), 0);
    drawTiles();
    for (const it of G.items) if (!it.remove) drawItem(it);
    for (const e of G.enemies) if (!e.remove) drawEnemy(e);
    for (const f of G.fires) if (!f.remove) drawFire(f);
    if (G.player) drawPlayer();
    drawFx();
    ctx.restore();
  }
  drawHUD();
  if (G.scene === 'menu') drawMenu();
  else if (G.scene === 'levels') drawLevels();
  else if (G.scene === 'pause') drawPause();
  else if (G.scene === 'result') drawResult();
  else if (G.scene === 'over') drawOver();
  else if (G.scene === 'win') drawWin();
  ctx.restore();
  drawKeys();
}

  }

  // 右侧圆形按钮

  btn(0, '菜单', () => { G.scene = 'pause'; });
  btn(1, muted ? '静' : '音', () => { muted = !muted; });
  btn(2, G.speed + 'x', () => { G.speed = G.speed === 1 ? 2 : G.speed === 2 ? 3 : 1; }, G.speed > 1);

// ---- 面板通用 ----
function dim(a) { ctx.fillStyle = 'rgba(8,14,22,' + a + ')'; ctx.fillRect(0, 0, VW, VH); }
function panel(x, y, w, h) {
  ctx.fillStyle = 'rgba(16,28,42,0.92)'; rr(x, y, w, h, 22); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.16)'; ctx.lineWidth = 2; rr(x, y, w, h, 22); ctx.stroke();
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, 'rgba(255,255,255,0.10)'); g.addColorStop(0.4, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; rr(x, y, w, h, 22); ctx.fill();
}
function bigButton(x, y, w, h, label, cb, col, sub) {
  const grad = ctx.createLinearGradient(x, y, x, y + h);
  grad.addColorStop(0, col || '#4fbf6a'); grad.addColorStop(1, shade(col || '#4fbf6a', -0.28));
  ctx.fillStyle = grad; rr(x, y, w, h, h / 2); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2; rr(x, y, w, h, h / 2); ctx.stroke();
  txt(label, x + w / 2, y + h / 2 - (sub ? 8 : 0), h * 0.42, '#fff', 'center');
  if (sub) txt(sub, x + w / 2, y + h / 2 + h * 0.26, h * 0.24, 'rgba(255,255,255,0.8)', 'center');
  hit('btn' + label, x, y, w, h, cb);
}
function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * k)));
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

// ---- 手机虚拟键（屏幕坐标，画在场景带下方）----
function drawKeys() {
  if (!KEYS) return;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = 'rgba(8,14,22,0.9)'; ctx.fillRect(0, H - BAR_H, W, BAR_H);
  ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fillRect(0, H - BAR_H, W, 2);
  const active = k => (k === 'left' && IN.left) || (k === 'right' && IN.right) || (k === 'jump' && IN.jump) || (k === 'run' && IN.run) || (k === 'fire' && IN.fire);
  for (const k in KEYS) {
    const r = KEYS[k], on = active(k);
    ctx.fillStyle = on ? 'rgba(255,224,102,0.9)' : 'rgba(255,255,255,0.16)';
    rr(r.x, r.y, r.w, r.h, r.h * 0.3); ctx.fill();
    ctx.strokeStyle = on ? '#ffe066' : 'rgba(255,255,255,0.3)'; ctx.lineWidth = 2;
    rr(r.x, r.y, r.w, r.h, r.h * 0.3); ctx.stroke();
    txt(r.label, r.x + r.w / 2, r.y + r.h / 2 + 1, r.h * 0.42, on ? '#28200a' : '#fff', 'center');
  }
}

// ---- 命中检测 ----
function uiHit(px, py) {
  for (let i = G.ui.length - 1; i >= 0; i--) {
    const u = G.ui[i];
    if (px >= u.sx && px <= u.sx + u.sw && py >= u.sy && py <= u.sy + u.sh) { u.cb(); return true; }
  }
  return false;
}
function keyHit(px, py) {
  if (!KEYS) return null;
  for (const k in KEYS) {
    const r = KEYS[k];
    if (px >= r.x - 6 && px <= r.x + r.w + 6 && py >= r.y - 6 && py <= r.y + r.h + 6) return k;
  }
  return null;
}

// ---- 键盘输入 ----
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', KeyK: 'jump',
  ShiftLeft: 'run', ShiftRight: 'run', KeyB: 'run', KeyX: 'fire', KeyJ: 'fire',
};
function doConfirm() {
  if (G.scene === 'menu') { beginRun(); return true; }
  if (G.scene === 'result') { const last = G.levelIdx >= LEVELS.length - 1; if (last) G.scene = 'win'; else nextLevel(); return true; }
  if (G.scene === 'pause') { G.scene = 'play'; return true; }
  if (G.scene === 'over' || G.scene === 'win') { G.score = 0; G.coinCount = 0; startLevel(0); return true; }
  if (G.scene === 'levels') { G.scene = 'menu'; return true; }
  return false;
}
window.addEventListener('keydown', e => {
  ensureAC();
  const k = KEYMAP[e.code] || (e.key === ' ' ? 'jump' : null);
  if (k) {
    e.preventDefault();
    IN[k] = true;
    if (lastTouch) { lastTouch = false; resize(); }   // 接回键盘时收起虚拟键
    return;
  }
  if (e.code === 'Escape' || e.key === 'Escape') {
    if (G.scene === 'play') G.scene = 'pause';
    else if (G.scene === 'pause') G.scene = 'play';
    else if (G.scene === 'result' || G.scene === 'over' || G.scene === 'win') { G.scene = 'menu'; }
    return;
  }
  if (e.key === 'm' || e.key === 'M') { muted = !muted; return; }
  if (e.key === 'Enter') { e.preventDefault(); if (!doConfirm()) { /* noop */ } return; }
  if (G.scene === 'menu' && ['1', '2', '3'].indexOf(e.key) >= 0) { G.diff = DIFF_ORDER[+e.key - 1]; saveDiff(); SFX.select(); }
});
window.addEventListener('keyup', e => {
  const k = KEYMAP[e.code] || (e.key === ' ' ? 'jump' : null);
  if (k) { e.preventDefault(); IN[k] = false; }
});
// ---- 指针输入（多点触控：虚拟键 + 面板点击）----
const ptrKeys = new Map();
window.addEventListener('pointerdown', e => {
  ensureAC();
  const px = e.clientX, py = e.clientY;
  const kk = keyHit(px, py);
  if (kk && (G.scene === 'play' || G.scene === 'clear')) {
    if (!KEYS) { lastTouch = true; resize(); }
    ptrKeys.set(e.pointerId, kk); IN[kk] = true;
    e.preventDefault();
    return;
  }
  if (uiHit(px, py)) return;
  if (G.scene === 'play') { ptrKeys.set(e.pointerId, 'jump'); IN.jump = true; }
  else doConfirm();
});
function releasePtr(e) {
  const kk = ptrKeys.get(e.pointerId);
  if (kk) { IN[kk] = false; ptrKeys.delete(e.pointerId); }
}
window.addEventListener('pointerup', releasePtr);
window.addEventListener('pointercancel', releasePtr);
window.addEventListener('blur', () => { IN.left = IN.right = IN.jump = IN.run = IN.fire = false; ptrKeys.clear(); });
window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', () => { lastFrame = null; });
document.addEventListener('contextmenu', e => e.preventDefault());

// ---- 主循环 ----
let lastFrame = null, acc = 0;
const STEP = 1 / 60;
function frame(ts) {
  requestAnimationFrame(frame);
  if (lastFrame === null) { lastFrame = ts; return; }
  let dt = (ts - lastFrame) / 1000; lastFrame = ts;
  if (dt > 0.05) dt = 0.05;
  acc += dt;
  let guard = 0;
  while (acc >= STEP && guard++ < 12) {
    for (let s = 0; s < G.speed; s++) update(STEP);
    acc -= STEP;
  }
  if (acc > STEP * 12) acc = 0;
  drawScene();
}

function init() {
  loadBest(); loadDiff(); loadUnlock();
  buildLevel(0);
  G.scene = 'menu';
  resize();
}

init();
requestAnimationFrame(frame);
